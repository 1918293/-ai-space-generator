<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#151719" />
  <meta name="description" content="手機優先的 AI 空間生成器概念工具：拍照、選取區域、材質模擬、前後比較與下載。" />
  <style>
:root {
  color-scheme: dark;
  --bg: #0e1012;
  --surface: #171a1d;
  --surface-2: #202429;
  --line: #30363d;
  --text: #f3f4f5;
  --muted: #a5adb6;
  --accent: #c8ff72;
  --accent-ink: #17200c;
  --danger: #ffb4a9;
  --radius: 22px;
  font-family: Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
}

* { box-sizing: border-box; }
html { background: var(--bg); }
body {
  margin: 0;
  min-height: 100vh;
  background:
    radial-gradient(circle at 10% 0%, rgba(200,255,114,.08), transparent 34rem),
    var(--bg);
  color: var(--text);
}
button, input, select, textarea { font: inherit; }
button, select, textarea, input[type="color"] { color: var(--text); }
button { cursor: pointer; }

.topbar {
  position: sticky;
  top: 0;
  z-index: 20;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 16px;
  padding: max(18px, env(safe-area-inset-top)) 18px 14px;
  background: rgba(14,16,18,.88);
  border-bottom: 1px solid rgba(255,255,255,.08);
  backdrop-filter: blur(18px);
}

h1, h2, p { margin-top: 0; }
h1 { margin-bottom: 0; font-size: clamp(1.45rem, 6vw, 2.25rem); letter-spacing: -.045em; }
h2 { margin-bottom: 8px; font-size: 1.3rem; letter-spacing: -.025em; }
.eyebrow { margin-bottom: 5px; color: var(--accent); font-size: .72rem; font-weight: 800; letter-spacing: .15em; }

.app-shell {
  width: min(100%, 880px);
  margin: 0 auto;
  padding: 18px 14px 80px;
}

.card {
  margin-bottom: 14px;
  padding: 18px;
  border: 1px solid var(--line);
  border-radius: var(--radius);
  background: rgba(23,26,29,.94);
  box-shadow: 0 20px 50px rgba(0,0,0,.18);
}

.intro p { margin-bottom: 10px; line-height: 1.55; }
.notice { color: var(--muted); font-size: .9rem; }

.upload-button,
.primary,
button {
  min-height: 46px;
  border: 1px solid var(--line);
  border-radius: 15px;
  background: var(--surface-2);
  padding: 10px 14px;
  font-weight: 720;
}

.upload-button {
  display: flex;
  align-items: center;
  justify-content: center;
  width: 100%;
  background: var(--accent);
  color: var(--accent-ink);
}
.upload-button input { position: absolute; inline-size: 1px; block-size: 1px; opacity: 0; }
.primary { background: var(--accent); color: var(--accent-ink); border-color: transparent; }
button:disabled { opacity: .42; cursor: not-allowed; }
.ghost { background: transparent; }

.meta-grid {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 8px;
  margin-top: 14px;
  color: var(--muted);
  font-size: .82rem;
}
.meta-grid span { padding: 9px 10px; border-radius: 12px; background: #111416; overflow-wrap: anywhere; }

.toolbar { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 14px; }
.tool { padding-inline: 8px; font-size: .86rem; }
.tool.active { border-color: var(--accent); color: var(--accent); }
.range-row { display: grid; grid-template-columns: auto 1fr 42px; align-items: center; gap: 10px; margin-top: 16px; color: var(--muted); }
.range-row output { text-align: right; color: var(--text); }
input[type="range"] { accent-color: var(--accent); }

.workspace-card { padding: 8px; overflow: hidden; }
.empty-state { display: grid; place-items: center; min-height: 260px; gap: 7px; color: var(--muted); text-align: center; }
.empty-state strong { color: var(--text); }
.canvas-wrap { position: relative; width: 100%; touch-action: none; border-radius: 16px; overflow: hidden; background: #08090a; }
.canvas-wrap canvas { display: block; width: 100%; height: auto; }
#maskCanvas { position: absolute; inset: 0; }

.field-grid { display: grid; grid-template-columns: 1fr 108px; gap: 10px; }
label > span { display: block; margin-bottom: 7px; color: var(--muted); font-size: .83rem; }
select, textarea, input[type="color"] {
  width: 100%;
  border: 1px solid var(--line);
  border-radius: 14px;
  background: #111416;
}
select { height: 48px; padding: 0 12px; }
textarea { padding: 12px; resize: vertical; margin-bottom: 12px; }
input[type="color"] { height: 48px; padding: 5px; }
.action-grid { display: grid; grid-template-columns: 1.5fr 1fr 1fr; gap: 8px; }
.status { min-height: 20px; margin: 12px 2px 0; color: var(--muted); font-size: .86rem; }

.section-heading { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.compare-box { position: relative; overflow: hidden; border-radius: 16px; background: #08090a; touch-action: none; }
.compare-box canvas { display: block; width: 100%; height: auto; }
.after-layer { position: absolute; inset: 0; width: 50%; overflow: hidden; }
.after-layer canvas { width: auto; max-width: none; height: 100%; }
.compare-line { position: absolute; top: 0; bottom: 0; left: 50%; width: 2px; background: white; box-shadow: 0 0 0 1px rgba(0,0,0,.3); transform: translateX(-1px); pointer-events: none; }
.compare-line::after { content: "↔"; position: absolute; top: 50%; left: 50%; display: grid; place-items: center; width: 38px; height: 38px; border-radius: 50%; background: white; color: #111; transform: translate(-50%,-50%); font-weight: 900; }
.compare-range { position: absolute; inset: 0; width: 100%; height: 100%; opacity: 0; cursor: ew-resize; }
.roadmap p:last-child { margin-bottom: 0; color: var(--muted); line-height: 1.55; }
footer { padding: 26px 18px calc(28px + env(safe-area-inset-bottom)); color: #737b84; text-align: center; font-size: .75rem; }
.hidden { display: none !important; }

@media (min-width: 720px) {
  .app-shell { padding-top: 28px; }
  .controls { display: grid; grid-template-columns: 1fr 1fr; gap: 14px 18px; }
  .upload-button, .meta-grid { grid-column: 1 / -1; }
}

  </style>
  <title>AI 空間生成器</title>
</head>
<body>
  <header class="topbar">
    <div>
      <p class="eyebrow">AI SPACE GENERATOR</p>
      <h1>AI 空間生成器</h1>
    </div>
    <button id="installBtn" class="ghost hidden" type="button">安裝</button>
  </header>

  <main class="app-shell">
    <section class="card intro">
      <p>上傳或拍攝空間照片，在畫面上塗選需要修改的位置，再套用移除、顏色或材質模擬。</p>
      <p class="notice">目前為手機端概念生成版本；不會上傳照片，也不是精確施工或結構判斷工具。</p>
    </section>

    <section class="card controls">
      <label class="upload-button" for="imageInput">
        <span>拍攝／選擇照片</span>
        <input id="imageInput" type="file" accept="image/*" capture="environment" />
      </label>

      <div id="fileMeta" class="meta-grid" aria-live="polite">
        <span>尚未載入照片</span>
      </div>

      <div class="toolbar" aria-label="編輯工具">
        <button type="button" data-tool="brush" class="tool active">筆刷選取</button>
        <button type="button" data-tool="eraser" class="tool">擦除選取</button>
        <button id="clearMaskBtn" type="button" class="tool">清除選取</button>
      </div>

      <label class="range-row">
        <span>筆刷大小</span>
        <input id="brushSize" type="range" min="8" max="120" value="44" />
        <output id="brushSizeValue">44</output>
      </label>
    </section>

    <section class="card workspace-card">
      <div id="emptyState" class="empty-state">
        <strong>先加入一張空間照片</strong>
        <span>照片只在你的裝置中處理。</span>
      </div>

      <div id="canvasWrap" class="canvas-wrap hidden">
        <canvas id="photoCanvas"></canvas>
        <canvas id="maskCanvas"></canvas>
      </div>
    </section>

    <section class="card generation-panel">
      <div class="field-grid">
        <label>
          <span>操作</span>
          <select id="operation">
            <option value="remove">移除／弱化物件</option>
            <option value="color">更換顏色</option>
            <option value="wood">木質材質</option>
            <option value="stone">石材質感</option>
            <option value="fabric">織物質感</option>
            <option value="light">提亮空間</option>
          </select>
        </label>

        <label id="colorField">
          <span>顏色</span>
          <input id="fillColor" type="color" value="#d6c4aa" />
        </label>
      </div>

      <label>
        <span>設計描述</span>
        <textarea id="prompt" rows="3" placeholder="例如：溫暖木質、乾淨留白、自然採光、低飽和色系"></textarea>
      </label>

      <div class="action-grid">
        <button id="generateBtn" type="button" class="primary" disabled>生成概念</button>
        <button id="undoBtn" type="button" disabled>復原</button>
        <button id="resetBtn" type="button" disabled>重設</button>
      </div>
      <p id="status" class="status" aria-live="polite"></p>
    </section>

    <section id="resultSection" class="card hidden">
      <div class="section-heading">
        <div>
          <p class="eyebrow">COMPARE</p>
          <h2>修改前後比較</h2>
        </div>
        <button id="downloadBtn" type="button" class="ghost">下載 PNG</button>
      </div>

      <div id="compareBox" class="compare-box">
        <canvas id="beforeCanvas"></canvas>
        <div id="afterLayer" class="after-layer">
          <canvas id="afterCanvas"></canvas>
        </div>
        <div id="compareLine" class="compare-line" aria-hidden="true"></div>
        <input id="compareRange" class="compare-range" type="range" min="0" max="100" value="50" aria-label="前後比較位置" />
      </div>
    </section>

    <section class="card roadmap">
      <p class="eyebrow">NEXT</p>
      <h2>後續可接入</h2>
      <p>物件辨識、語意分割、真正的局部生成、2D 平面圖轉 3D、多視角一致性與 AR 預覽。</p>
    </section>
  </main>

  <footer>AI Space Generator · Local-first prototype</footer>
  <script>
'use strict';

const $ = (id) => document.getElementById(id);
const state = {
  original: null,
  current: null,
  history: [],
  tool: 'brush',
  drawing: false,
  scale: 1,
  deferredInstall: null,
};

const imageInput = $('imageInput');
const photoCanvas = $('photoCanvas');
const maskCanvas = $('maskCanvas');
const beforeCanvas = $('beforeCanvas');
const afterCanvas = $('afterCanvas');
const photoCtx = photoCanvas.getContext('2d', { willReadFrequently: true });
const maskCtx = maskCanvas.getContext('2d', { willReadFrequently: true });
const beforeCtx = beforeCanvas.getContext('2d');
const afterCtx = afterCanvas.getContext('2d');

function setStatus(message, error = false) {
  $('status').textContent = message;
  $('status').style.color = error ? 'var(--danger)' : '';
}

function setButtons(enabled) {
  $('generateBtn').disabled = !enabled;
  $('resetBtn').disabled = !enabled;
  $('undoBtn').disabled = state.history.length === 0;
}

function fitDimensions(width, height, max = 1600) {
  const ratio = Math.min(1, max / Math.max(width, height));
  return { width: Math.round(width * ratio), height: Math.round(height * ratio) };
}

async function loadFile(file) {
  if (!file || !file.type.startsWith('image/')) {
    setStatus('請選擇有效的圖片檔案。', true);
    return;
  }

  const url = URL.createObjectURL(file);
  const img = new Image();
  img.onload = () => {
    const fitted = fitDimensions(img.naturalWidth, img.naturalHeight);
    [photoCanvas, maskCanvas, beforeCanvas, afterCanvas].forEach((canvas) => {
      canvas.width = fitted.width;
      canvas.height = fitted.height;
    });

    photoCtx.drawImage(img, 0, 0, fitted.width, fitted.height);
    state.original = photoCtx.getImageData(0, 0, fitted.width, fitted.height);
    state.current = new ImageData(new Uint8ClampedArray(state.original.data), fitted.width, fitted.height);
    state.history = [];
    clearMask();
    renderCurrent();
    renderMeta(file, img, fitted);
    $('emptyState').classList.add('hidden');
    $('canvasWrap').classList.remove('hidden');
    $('resultSection').classList.add('hidden');
    setButtons(true);
    setStatus('照片已載入。請塗選需要修改的區域。');
    URL.revokeObjectURL(url);
  };
  img.onerror = () => {
    URL.revokeObjectURL(url);
    setStatus('無法讀取這張圖片。', true);
  };
  img.src = url;
}

function renderMeta(file, img, fitted) {
  const kb = Math.round(file.size / 1024).toLocaleString('zh-TW');
  const modified = new Date(file.lastModified).toLocaleString('zh-TW');
  $('fileMeta').innerHTML = `
    <span>檔名：${escapeHtml(file.name)}</span>
    <span>大小：${kb} KB</span>
    <span>原始：${img.naturalWidth} × ${img.naturalHeight}</span>
    <span>處理：${fitted.width} × ${fitted.height}</span>
    <span>格式：${escapeHtml(file.type || '未知')}</span>
    <span>修改：${escapeHtml(modified)}</span>
  `;
}

function escapeHtml(value) {
  return String(value).replace(/[&<>'"]/g, (char) => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', "'":'&#39;', '"':'&quot;' }[char]));
}

function renderCurrent() {
  if (!state.current) return;
  photoCtx.putImageData(state.current, 0, 0);
}

function clearMask() {
  maskCtx.clearRect(0, 0, maskCanvas.width, maskCanvas.height);
}

function canvasPoint(event) {
  const rect = maskCanvas.getBoundingClientRect();
  const source = event.touches ? event.touches[0] : event;
  return {
    x: (source.clientX - rect.left) * (maskCanvas.width / rect.width),
    y: (source.clientY - rect.top) * (maskCanvas.height / rect.height),
  };
}

function drawMask(event) {
  if (!state.drawing || !state.current) return;
  event.preventDefault();
  const { x, y } = canvasPoint(event);
  const size = Number($('brushSize').value);
  maskCtx.save();
  maskCtx.globalCompositeOperation = state.tool === 'eraser' ? 'destination-out' : 'source-over';
  maskCtx.fillStyle = 'rgba(200,255,114,.58)';
  maskCtx.beginPath();
  maskCtx.arc(x, y, size / 2, 0, Math.PI * 2);
  maskCtx.fill();
  maskCtx.restore();
}

function hasMask(maskData) {
  for (let i = 3; i < maskData.length; i += 4) if (maskData[i] > 15) return true;
  return false;
}

function saveHistory() {
  state.history.push(new ImageData(new Uint8ClampedArray(state.current.data), state.current.width, state.current.height));
  if (state.history.length > 12) state.history.shift();
}

function generate() {
  if (!state.current) return;
  const mask = maskCtx.getImageData(0, 0, maskCanvas.width, maskCanvas.height);
  if (!hasMask(mask.data)) {
    setStatus('請先用筆刷塗選要修改的區域。', true);
    return;
  }

  saveHistory();
  const output = new ImageData(new Uint8ClampedArray(state.current.data), state.current.width, state.current.height);
  const operation = $('operation').value;
  const color = hexToRgb($('fillColor').value);
  const width = output.width;
  const height = output.height;
  const source = state.current.data;
  const data = output.data;

  for (let y = 0; y < height; y++) {
    for (let x = 0; x < width; x++) {
      const i = (y * width + x) * 4;
      const alpha = mask.data[i + 3] / 255;
      if (alpha <= 0.04) continue;
      const strength = Math.min(.92, alpha * .92);
      let target;

      if (operation === 'remove') {
        target = neighborhoodAverage(source, width, height, x, y, 20);
      } else if (operation === 'color') {
        const lum = (source[i] + source[i+1] + source[i+2]) / (255 * 3);
        target = [color.r * (.55 + lum * .55), color.g * (.55 + lum * .55), color.b * (.55 + lum * .55)];
      } else if (operation === 'wood') {
        const grain = 22 * Math.sin(y * .18 + Math.sin(x * .03)) + 10 * Math.sin(y * .035);
        target = [161 + grain, 116 + grain * .55, 73 + grain * .25];
      } else if (operation === 'stone') {
        const noise = ((x * 17 + y * 31) % 29) - 14;
        const vein = Math.abs(Math.sin(x * .018 + y * .027)) > .965 ? -45 : 0;
        target = [176 + noise + vein, 178 + noise + vein, 174 + noise + vein];
      } else if (operation === 'fabric') {
        const weave = ((x % 7 < 2) || (y % 7 < 2)) ? -26 : 8;
        target = [154 + weave, 144 + weave, 132 + weave];
      } else {
        target = [Math.min(255, source[i] * 1.28 + 18), Math.min(255, source[i+1] * 1.25 + 18), Math.min(255, source[i+2] * 1.18 + 14)];
      }

      data[i] = mix(source[i], target[0], strength);
      data[i+1] = mix(source[i+1], target[1], strength);
      data[i+2] = mix(source[i+2], target[2], strength);
    }
  }

  state.current = output;
  renderCurrent();
  clearMask();
  renderComparison();
  setButtons(true);
  const prompt = $('prompt').value.trim();
  setStatus(prompt ? `已產生概念模擬：「${prompt}」` : '已產生概念模擬。');
}

function neighborhoodAverage(data, width, height, x, y, radius) {
  const samples = [[-radius,0],[radius,0],[0,-radius],[0,radius],[-radius,-radius],[radius,radius]];
  let r = 0, g = 0, b = 0, count = 0;
  for (const [dx,dy] of samples) {
    const sx = Math.max(0, Math.min(width - 1, x + dx));
    const sy = Math.max(0, Math.min(height - 1, y + dy));
    const j = (sy * width + sx) * 4;
    r += data[j]; g += data[j+1]; b += data[j+2]; count++;
  }
  return [r/count, g/count, b/count];
}

function mix(a, b, t) { return Math.round(a * (1 - t) + b * t); }
function hexToRgb(hex) {
  const value = parseInt(hex.replace('#',''), 16);
  return { r: (value >> 16) & 255, g: (value >> 8) & 255, b: value & 255 };
}

function renderComparison() {
  beforeCtx.putImageData(state.original, 0, 0);
  afterCtx.putImageData(state.current, 0, 0);
  $('resultSection').classList.remove('hidden');
  updateComparison($('compareRange').value);
}

function updateComparison(value) {
  $('afterLayer').style.width = `${value}%`;
  $('compareLine').style.left = `${value}%`;
}

function undo() {
  if (!state.history.length) return;
  state.current = state.history.pop();
  renderCurrent();
  renderComparison();
  setButtons(true);
  setStatus('已復原上一個修改。');
}

function reset() {
  if (!state.original) return;
  state.current = new ImageData(new Uint8ClampedArray(state.original.data), state.original.width, state.original.height);
  state.history = [];
  renderCurrent();
  clearMask();
  $('resultSection').classList.add('hidden');
  setButtons(true);
  setStatus('已回到原始照片。');
}

function download() {
  if (!state.current) return;
  const canvas = document.createElement('canvas');
  canvas.width = state.current.width;
  canvas.height = state.current.height;
  canvas.getContext('2d').putImageData(state.current, 0, 0);
  const link = document.createElement('a');
  link.download = `ai-space-generator-${Date.now()}.png`;
  link.href = canvas.toDataURL('image/png');
  link.click();
}

imageInput.addEventListener('change', (event) => loadFile(event.target.files?.[0]));
$('brushSize').addEventListener('input', (event) => $('brushSizeValue').value = event.target.value);
$('clearMaskBtn').addEventListener('click', () => { clearMask(); setStatus('選取區域已清除。'); });
$('generateBtn').addEventListener('click', generate);
$('undoBtn').addEventListener('click', undo);
$('resetBtn').addEventListener('click', reset);
$('downloadBtn').addEventListener('click', download);
$('compareRange').addEventListener('input', (event) => updateComparison(event.target.value));

document.querySelectorAll('[data-tool]').forEach((button) => {
  button.addEventListener('click', () => {
    state.tool = button.dataset.tool;
    document.querySelectorAll('[data-tool]').forEach((item) => item.classList.toggle('active', item === button));
  });
});

['pointerdown','touchstart'].forEach((name) => maskCanvas.addEventListener(name, (event) => { state.drawing = true; drawMask(event); }, { passive: false }));
['pointermove','touchmove'].forEach((name) => maskCanvas.addEventListener(name, drawMask, { passive: false }));
['pointerup','pointercancel','pointerleave','touchend','touchcancel'].forEach((name) => maskCanvas.addEventListener(name, () => { state.drawing = false; }));

  </script>
