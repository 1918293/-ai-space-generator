extensions:
  health_check:
    endpoint: 0.0.0.0:13133
  googleclientauth:

receivers:
  otlp:
    protocols:
      http:
        endpoint: 127.0.0.1:4318

processors:
  resourcedetection:
    detectors: [gcp]
    timeout: 10s
  resource/gcp_project_id:
    attributes:
      - action: insert
        key: gcp.project_id
        value: ${GOOGLE_CLOUD_PROJECT}
  memory_limiter:
    check_interval: 1s
    limit_mib: 256
    spike_limit_mib: 64
  batch:
    timeout: 5s
    send_batch_size: 512
    send_batch_max_size: 1024

exporters:
  otlp_grpc:
    endpoint: telemetry.googleapis.com:443
    balancer_name: pick_first
    auth:
      authenticator: googleclientauth

service:
  extensions: [health_check, googleclientauth]
  telemetry:
    logs:
      level: warn
  pipelines:
    traces:
      receivers: [otlp]
      processors: [resourcedetection, resource/gcp_project_id, memory_limiter, batch]
      exporters: [otlp_grpc]
    metrics:
      receivers: [otlp]
      processors: [resourcedetection, resource/gcp_project_id, memory_limiter, batch]
      exporters: [otlp_grpc]
