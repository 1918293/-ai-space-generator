name: Lane E Parent Distributed Verification

on:
  push:
    branches:
      - exp/runtime-v2-lane-e-parent-distributed

permissions:
  contents: read

jobs:
  lane-e-distributed-verification:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ai-space-generator
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: ai-space-generator/requirements-control.txt
      - name: Install Runtime v2 dependencies
        run: python -m pip install -r requirements-control.txt
      - name: Run Lane E distributed regressions and parent baseline
        run: >-
          python -m pytest -q
          tests/test_parent_distributed_verification.py
          tests/test_parent_task_production.py
          tests/test_task_runtime.py
          tests/test_temporal_control.py
          tests/test_temporal_workflow_integration.py
          tests/test_production_temporal_integration.py
