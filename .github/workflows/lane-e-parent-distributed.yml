name: Lane E Parent Distributed Verification

on:
  push:
    branches:
      - exp/runtime-v2-lane-e-parent-distributed

permissions:
  contents: read

jobs:
  lane-e-distributed-verification:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ai-space-generator
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: ai-space-generator/requirements-control.txt
      - name: Install Runtime v2 dependencies
        run: python -m pip install --upgrade pytest -r requirements-control.txt
      - name: Run complete Runtime v2 surface including Lane E regressions
        run: >-
          python -m pytest tests -q
          --ignore=tests/test_core.py
          --ignore=tests/test_validation.py
