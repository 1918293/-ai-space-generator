name: Runtime v2 Lane A HTTP OAuth

on:
  push:
    branches:
      - exp/runtime-v2-lane-a-http-oauth

permissions:
  contents: read

jobs:
  lane-a-http-oauth:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: ai-space-generator
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: ai-space-generator/requirements-control.txt
      - name: Install Runtime v2 dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements-control.txt pytest
      - name: Real TCP Streamable HTTP OAuth gate
        run: pytest -q tests/test_mcp_http_oauth_network_e2e.py tests/test_oauth_verifier.py tests/test_mcp_control_server.py tests/test_mcp_control_bridge.py
      - name: Runtime v2 regression
        run: pytest -q tests
