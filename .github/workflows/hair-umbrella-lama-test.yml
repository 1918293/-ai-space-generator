name: Hao Hair Masked Umbrella Removal

on:
  push:
    branches:
      - hao-hair-sr-test-20260817
    paths:
      - '.github/workflows/hair-umbrella-lama-test.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  lama-umbrella-mask:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Download verified primary SR artifact
        uses: actions/download-artifact@v4
        with:
          name: hao-hair-realesr-general-x2-dn020
          path: work/source_artifact
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: 32003834720

      - name: Install CPU LaMa stack
        run: |
          python -m pip install --upgrade pip
          pip install 'numpy<2' 'Pillow==9.5.0' opencv-python-headless==4.10.0.84
          pip install torch==2.1.2 torchvision==0.16.2 --index-url https://download.pytorch.org/whl/cpu
          pip install 'IOPaint==1.6.0'
          python - <<'PY'
          import torch, numpy, PIL
          print('TORCH', torch.__version__, 'CUDA', torch.cuda.is_available())
          print('NUMPY', numpy.__version__, 'PIL', PIL.__version__)
          PY

      - name: Prepare content-aware protected mask and full-context patch
        run: |
          python - <<'PY'
          from pathlib import Path
          from PIL import Image
          import numpy as np, cv2, json

          files=list(Path('work/source_artifact').rglob('*.png'))
          assert files, 'Primary SR PNG not found in downloaded artifact'
          src_path=files[0]
          src=Image.open(src_path).convert('RGB')
          assert src.size == (2360, 4192), src.size

          crop_box=(1400,2700,2360,4192)
          patch_img=src.crop(crop_box)
          patch=np.asarray(patch_img)
          assert patch_img.size == (960,1492), patch_img.size

          gray=cv2.cvtColor(patch,cv2.COLOR_RGB2GRAY)
          R,G,B=[patch[:,:,i].astype(np.int16) for i in range(3)]
          yy,xx=np.indices(gray.shape)

          dark=gray < 135
          red=(R>75)&(R>G*1.18)&(R>B*1.08)
          roi=(xx>250)&(yy>400)
          candidate=(dark|red)&roi

          # Detect the arm as one connected skin component and protect it with a safety margin.
          skin=((R>130)&(G>70)&(B<145)&((R-G)>20)&((G-B)>5)&(yy<830)&(xx<700))
          n,labels,stats,_=cv2.connectedComponentsWithStats(skin.astype(np.uint8),8)
          skin_keep=np.zeros_like(gray,dtype=np.uint8)
          for i in range(1,n):
              comp=labels==i
              area=stats[i,cv2.CC_STAT_AREA]
              if area>500 and np.any(comp&(xx>230)&(xx<580)&(yy>430)&(yy<770)):
                  skin_keep[comp]=255
          skin_keep=cv2.dilate(skin_keep,np.ones((17,17),np.uint8),iterations=1)

          protect=np.zeros_like(gray,dtype=np.uint8)
          protect[skin_keep>0]=255
          sleeve=np.array([(0,0),(715,0),(715,500),(690,510),(655,520),(620,510),(580,470),(500,420),(380,380),(250,350),(0,330)],np.int32)
          cv2.fillPoly(protect,[sleeve],255)
          cv2.rectangle(protect,(0,700),(320,1491),255,-1)

          mask=(candidate.astype(np.uint8)*255)
          mask=cv2.morphologyEx(mask,cv2.MORPH_CLOSE,np.ones((17,17),np.uint8))
          mask=cv2.dilate(mask,np.ones((31,31),np.uint8),iterations=1)
          mask[protect>0]=0

          n,labels,stats,_=cv2.connectedComponentsWithStats((mask>0).astype(np.uint8),8)
          keep=np.zeros_like(mask)
          for i in range(1,n):
              comp=labels==i
              area=stats[i,cv2.CC_STAT_AREA]
              if area>800 and np.any(comp&(xx>500)&(yy>450)):
                  keep[comp]=255
          keep[protect>0]=0
          mask=keep

          Path('work/patch_input').mkdir(parents=True,exist_ok=True)
          Path('work/patch_mask').mkdir(parents=True,exist_ok=True)
          Path('work/patch_output').mkdir(parents=True,exist_ok=True)
          Path('work/final').mkdir(parents=True,exist_ok=True)
          patch_img.save('work/patch_input/input.png')
          Image.fromarray(mask).save('work/patch_mask/input.png')

          # Force LaMa to use the complete 960x1492 patch instead of IOPaint's default 128px mask crop.
          Path('work/lama-config.json').write_text(json.dumps({'hd_strategy':'Original'}),encoding='utf-8')

          red_layer=np.zeros_like(patch); red_layer[:,:,0]=255
          alpha=(mask.astype(np.float32)/255.0*0.45)[...,None]
          overlay=np.clip(patch*(1-alpha)+red_layer*alpha,0,255).astype(np.uint8)
          Image.fromarray(overlay).save('work/final/mask_overlay_v03.png')

          meta={
              'source_file':str(src_path),
              'source_size':src.size,
              'crop_box':crop_box,
              'patch_size':patch_img.size,
              'mask_nonzero_pixels':int(np.count_nonzero(mask)),
              'mask_method':'expanded dark/red content-aware selection with arm/sleeve protection',
              'lama_hd_strategy':'Original',
              'person_protection':'skin component + explicit sleeve/clothing exclusion; final compositing preserves every pixel outside mask'
          }
          Path('work/final/mask_metadata_v03.json').write_text(json.dumps(meta,indent=2),encoding='utf-8')
          print(meta)
          PY

      - name: Run LaMa with full patch context
        run: |
          iopaint run --model=lama --device=cpu \
            --image=work/patch_input \
            --mask=work/patch_mask \
            --output=work/patch_output \
            --config=work/lama-config.json

      - name: Composite into source and verify untouched pixels
        run: |
          python - <<'PY'
          from pathlib import Path
          from PIL import Image, ImageFilter
          import numpy as np, json, hashlib

          src_path=list(Path('work/source_artifact').rglob('*.png'))[0]
          src=Image.open(src_path).convert('RGB')
          crop_box=(1400,2700,2360,4192)
          patch_src=src.crop(crop_box)
          mask=Image.open('work/patch_mask/input.png').convert('L')

          outs=list(Path('work/patch_output').rglob('*.png'))+list(Path('work/patch_output').rglob('*.jpg'))+list(Path('work/patch_output').rglob('*.jpeg'))
          assert outs,'LaMa output not found'
          patch_out=Image.open(outs[0]).convert('RGB')
          if patch_out.size!=patch_src.size:
              patch_out=patch_out.resize(patch_src.size,Image.Resampling.LANCZOS)

          blurred=mask.filter(ImageFilter.GaussianBlur(radius=2))
          m=np.asarray(mask,dtype=np.float32)/255.0
          b=np.asarray(blurred,dtype=np.float32)/255.0
          a=np.minimum(m,b)[...,None]
          s=np.asarray(patch_src,dtype=np.float32)
          o=np.asarray(patch_out,dtype=np.float32)
          comp=np.clip(o*a+s*(1-a),0,255).astype(np.uint8)

          final=src.copy()
          final.paste(Image.fromarray(comp,'RGB'),crop_box[:2])
          out_path=Path('work/final/Hao_Hair_SR_x2_masked_umbrella_lama_v03.png')
          final.save(out_path)

          src_np=np.asarray(src); final_np=np.asarray(final)
          gm=np.zeros((4192,2360),dtype=bool)
          gm[2700:4192,1400:2360]=np.asarray(mask)>0
          outside_identical=bool(np.array_equal(src_np[~gm],final_np[~gm]))
          changed_pixels=int(np.count_nonzero(np.any(src_np!=final_np,axis=2)))
          assert outside_identical,'Pixels outside mask changed'
          assert final.size==(2360,4192),final.size

          report={
              'source_size':[2360,4192],
              'output_size':list(final.size),
              'outside_mask_bit_identical':outside_identical,
              'mask_pixels':int(np.count_nonzero(gm)),
              'changed_pixels':changed_pixels,
              'output_sha256':hashlib.sha256(out_path.read_bytes()).hexdigest(),
              'method':'IOPaint 1.6.0 / LaMa CPU with hd_strategy=Original on protected local mask'
          }
          Path('work/final/verification_v03.json').write_text(json.dumps(report,indent=2),encoding='utf-8')
          print(report)
          PY

      - name: Upload masked removal candidate
        uses: actions/upload-artifact@v4
        with:
          name: hao-hair-umbrella-lama-v03
          path: work/final/*
          if-no-files-found: error
          retention-days: 7
