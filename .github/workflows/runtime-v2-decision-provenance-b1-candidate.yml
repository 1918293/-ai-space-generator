name: Runtime v2 Decision Provenance B1 Candidate

on:
  push:
    branches:
      - exp/runtime-v2-decision-provenance-b1

permissions:
  contents: write

concurrency:
  group: runtime-v2-decision-provenance-b1
  cancel-in-progress: false

jobs:
  materialize:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ai-space-generator
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: ai-space-generator/requirements-control.txt
      - name: Materialize bounded observability provenance delta
        working-directory: .
        run: python .github/runtime-v2-decision-provenance-b1-materialize.py
      - name: Compile affected Runtime files
        run: python -m py_compile src/runtime_observability.py src/runtime_observability_bridge.py src/mcp_control_bridge.py
      - name: Install focused Runtime dependencies
        run: python -m pip install --upgrade pytest -r requirements-control.txt
      - name: Run focused provenance and observability regressions
        run: python -m pytest tests/test_runtime_observability.py tests/test_mcp_control_bridge.py -q
      - name: Commit verified source delta when present
        working-directory: .
        run: |
          if git diff --quiet -- ai-space-generator/src/runtime_observability.py ai-space-generator/src/runtime_observability_bridge.py ai-space-generator/src/mcp_control_bridge.py ai-space-generator/tests/test_runtime_observability.py ai-space-generator/tests/test_mcp_control_bridge.py; then
            echo "No source delta to commit."
            exit 0
          fi
          git config user.name "Hao"
          git config user.email "133175353+1918293@users.noreply.github.com"
          git add ai-space-generator/src/runtime_observability.py ai-space-generator/src/runtime_observability_bridge.py ai-space-generator/src/mcp_control_bridge.py ai-space-generator/tests/test_runtime_observability.py ai-space-generator/tests/test_mcp_control_bridge.py
          git commit -m "EXP: trace Runtime decision provenance through MCP observability"
          git push origin HEAD:exp/runtime-v2-decision-provenance-b1
