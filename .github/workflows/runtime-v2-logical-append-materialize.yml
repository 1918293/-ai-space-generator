name: Runtime v2 logical append materializer

on:
  push:
    branches:
      - exp/runtime-v2-logical-append-materialization

permissions:
  contents: write

jobs:
  materialize:
    if: ${{ !contains(github.event.head_commit.message, '[logical-append-materialized]') }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ai-space-generator
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Apply source-guarded logical append correction
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"SOURCE_GUARD_FAILED:{path}:count={count}")
              p.write_text(text.replace(old, new, 1))

          adapter = 'src/google_workspace_adapter.py'

          replace_once(
              adapter,
              '''    return rows, ""\n\n\n@dataclass(frozen=True)\nclass AuthorityFileSource:''',
              '''    return rows, ""\n\n\ndef _column_index(column: str) -> int:\n    token = column.strip().upper().replace("$", "")\n    if not token or not token.isalpha():\n        raise ValueError("SHEETS_COLUMN_INVALID")\n    result = 0\n    for char in token:\n        result = result * 26 + (ord(char) - ord("A") + 1)\n    return result - 1\n\n\ndef _full_column_bounds(range_a1: str) -> tuple[int, int]:\n    try:\n        _, columns = range_a1.rsplit("!", 1)\n        start_column, end_column = columns.split(":", 1)\n    except ValueError as exc:\n        raise ValueError("SHEETS_LOGICAL_APPEND_FULL_COLUMN_RANGE_REQUIRED") from exc\n    start = _column_index(start_column)\n    end = _column_index(end_column)\n    if end < start:\n        raise ValueError("SHEETS_LOGICAL_APPEND_COLUMN_RANGE_INVALID")\n    return start, end\n\n\ndef _stable_key_token(value: Any) -> str:\n    return json.dumps(value, ensure_ascii=False, sort_keys=True, separators=(",", ":"))\n\n\ndef _user_entered_value(value: Any) -> dict[str, Any]:\n    if value is None:\n        return {}\n    if isinstance(value, bool):\n        return {"boolValue": value}\n    if isinstance(value, (int, float)):\n        return {"numberValue": value}\n    return {"stringValue": str(value)}\n\n\n@dataclass(frozen=True)\nclass AuthorityFileSource:'''
          )

          replace_once(
              adapter,
              '''class SheetsMutationTarget:\n    binding_id: str\n    spreadsheet_id: str\n    range_a1: str\n    value_input_option: str = "RAW"\n    authority_sources: tuple[AuthorityFileSource, ...] = ()''',
              '''class SheetsMutationTarget:\n    binding_id: str\n    spreadsheet_id: str\n    range_a1: str\n    value_input_option: str = "RAW"\n    authority_sources: tuple[AuthorityFileSource, ...] = ()\n    mutation_mode: str = "fixed_range"\n    sheet_id: int | None = None\n    stable_unique_key_column: str = ""'''
          )

          replace_once(
              adapter,
              '''            if not target.spreadsheet_id.strip() or not target.range_a1.strip():\n                raise ValueError("SHEETS_TARGET_REQUIRED")\n            if target.value_input_option not in {"RAW", "USER_ENTERED"}:\n                raise ValueError("SHEETS_VALUE_INPUT_OPTION_INVALID")\n            by_binding[key] = target''',
              '''            if not target.spreadsheet_id.strip() or not target.range_a1.strip():\n                raise ValueError("SHEETS_TARGET_REQUIRED")\n            if target.value_input_option not in {"RAW", "USER_ENTERED"}:\n                raise ValueError("SHEETS_VALUE_INPUT_OPTION_INVALID")\n            mode = target.mutation_mode.strip().lower() or "fixed_range"\n            if mode not in {"fixed_range", "logical_append"}:\n                raise ValueError("SHEETS_MUTATION_MODE_INVALID")\n            if mode == "logical_append":\n                if target.value_input_option != "RAW":\n                    raise ValueError("SHEETS_LOGICAL_APPEND_REQUIRES_RAW")\n                if target.sheet_id is None or int(target.sheet_id) < 0:\n                    raise ValueError("SHEETS_LOGICAL_APPEND_SHEET_ID_REQUIRED")\n                start_column, end_column = _full_column_bounds(target.range_a1)\n                key_column = target.stable_unique_key_column.strip().upper()\n                key_index = _column_index(key_column)\n                if key_index < start_column or key_index > end_column:\n                    raise ValueError("SHEETS_STABLE_UNIQUE_KEY_COLUMN_OUTSIDE_RANGE")\n            by_binding[key] = target'''
          )

          replace_once(
              adapter,
              '''        if error or values is None:\n            return None\n        expected_digest = canonical_values_digest(values)\n        trusted_payload = {\n            "binding_id": binding_id,\n            "spreadsheet_id": target.spreadsheet_id.strip(),\n            "range_a1": target.range_a1.strip(),\n            "value_input_option": target.value_input_option,\n            "values_json": json.dumps(values, ensure_ascii=False, separators=(",", ":")),''',
              '''        if error or values is None:\n            return None\n        mode = target.mutation_mode.strip().lower() or "fixed_range"\n        if mode == "logical_append" and len(values) != 1:\n            return None\n        expected_digest = canonical_values_digest(values)\n        trusted_payload = {\n            "binding_id": binding_id,\n            "spreadsheet_id": target.spreadsheet_id.strip(),\n            "range_a1": target.range_a1.strip(),\n            "value_input_option": target.value_input_option,\n            "mutation_mode": mode,\n            "sheet_id": "" if target.sheet_id is None else str(target.sheet_id),\n            "stable_unique_key_column": target.stable_unique_key_column.strip().upper(),\n            "values_json": json.dumps(values, ensure_ascii=False, separators=(",", ":")),'''
          )

          replace_once(
              adapter,
              '''    def _mutate_sync(self, command: DriveMutationCommand) -> DriveMutationReceipt:\n        spreadsheet_id, range_a1, value_input_option, values = self._mutation_input(command)\n        try:\n            result = (\n                self._sheets.spreadsheets()\n                .values()\n                .update(\n                    spreadsheetId=spreadsheet_id,\n                    range=range_a1,\n                    valueInputOption=value_input_option,\n                    includeValuesInResponse=True,\n                    body={"values": values},\n                )\n                .execute()\n            )\n        except Exception as exc:\n            try:\n                from googleapiclient.errors import HttpError\n\n                if isinstance(exc, HttpError) and int(getattr(exc.resp, "status", 0)) in {\n                    400,\n                    401,\n                    403,\n                    404,\n                }:\n                    return DriveMutationReceipt(\n                        False,\n                        error_code=f"GOOGLE_SHEETS_REJECTED:{int(exc.resp.status)}",\n                        no_effect_confirmed=True,\n                    )\n            except Exception:\n                pass\n            raise\n\n        updated_range = str(result.get("updatedRange", range_a1))\n        updated_cells = int(result.get("updatedCells", 0) or 0)\n        receipt_material = f"{spreadsheet_id}:{updated_range}:{updated_cells}:{command.action_id}"\n        receipt_id = "GSHEETS-" + sha256(receipt_material.encode("utf-8")).hexdigest()[:32]\n        return DriveMutationReceipt(True, receipt_id, "google-sheets:spreadsheets.values.update")''',
              '''    @staticmethod\n    def _logical_append_input(\n        command: DriveMutationCommand,\n    ) -> tuple[str, str, int, int, int, list[Any], Any]:\n        spreadsheet_id, range_a1, value_input_option, values = (\n            GoogleWorkspaceSheetsClient._mutation_input(command)\n        )\n        payload = _payload(command)\n        mode = payload.get("mutation_mode", "fixed_range").strip().lower() or "fixed_range"\n        if mode != "logical_append":\n            raise ValueError("SHEETS_LOGICAL_APPEND_MODE_REQUIRED")\n        if value_input_option != "RAW" or len(values) != 1:\n            raise ValueError("SHEETS_LOGICAL_APPEND_ONE_RAW_ROW_REQUIRED")\n        try:\n            sheet_id = int(payload.get("sheet_id", "").strip())\n        except ValueError as exc:\n            raise ValueError("SHEETS_LOGICAL_APPEND_SHEET_ID_REQUIRED") from exc\n        start_column, end_column = _full_column_bounds(range_a1)\n        key_column = payload.get("stable_unique_key_column", "").strip().upper()\n        key_absolute_index = _column_index(key_column)\n        if key_absolute_index < start_column or key_absolute_index > end_column:\n            raise ValueError("SHEETS_STABLE_UNIQUE_KEY_COLUMN_OUTSIDE_RANGE")\n        key_relative_index = key_absolute_index - start_column\n        row = values[0]\n        if key_relative_index >= len(row):\n            raise ValueError("SHEETS_STABLE_UNIQUE_KEY_REQUIRED")\n        key_value = row[key_relative_index]\n        if key_value is None or (isinstance(key_value, str) and not key_value.strip()):\n            raise ValueError("SHEETS_STABLE_UNIQUE_KEY_REQUIRED")\n        return (\n            spreadsheet_id,\n            range_a1,\n            sheet_id,\n            start_column,\n            key_relative_index,\n            row,\n            key_value,\n        )\n\n    @staticmethod\n    def _known_no_effect_http_receipt(exc: Exception) -> DriveMutationReceipt | None:\n        try:\n            from googleapiclient.errors import HttpError\n\n            if isinstance(exc, HttpError) and int(getattr(exc.resp, "status", 0)) in {\n                400,\n                401,\n                403,\n                404,\n            }:\n                return DriveMutationReceipt(\n                    False,\n                    error_code=f"GOOGLE_SHEETS_REJECTED:{int(exc.resp.status)}",\n                    no_effect_confirmed=True,\n                )\n        except Exception:\n            return None\n        return None\n\n    def _mutate_sync(self, command: DriveMutationCommand) -> DriveMutationReceipt:\n        mode = _payload(command).get("mutation_mode", "fixed_range").strip().lower() or "fixed_range"\n        if mode == "fixed_range":\n            spreadsheet_id, range_a1, value_input_option, values = self._mutation_input(command)\n            try:\n                result = (\n                    self._sheets.spreadsheets()\n                    .values()\n                    .update(\n                        spreadsheetId=spreadsheet_id,\n                        range=range_a1,\n                        valueInputOption=value_input_option,\n                        includeValuesInResponse=True,\n                        body={"values": values},\n                    )\n                    .execute()\n                )\n            except Exception as exc:\n                receipt = self._known_no_effect_http_receipt(exc)\n                if receipt is not None:\n                    return receipt\n                raise\n\n            updated_range = str(result.get("updatedRange", range_a1))\n            updated_cells = int(result.get("updatedCells", 0) or 0)\n            receipt_material = (\n                f"{spreadsheet_id}:{updated_range}:{updated_cells}:{command.action_id}"\n            )\n            receipt_id = "GSHEETS-" + sha256(receipt_material.encode("utf-8")).hexdigest()[:32]\n            return DriveMutationReceipt(\n                True, receipt_id, "google-sheets:spreadsheets.values.update"\n            )\n\n        if mode != "logical_append":\n            return DriveMutationReceipt(\n                False,\n                error_code="SHEETS_MUTATION_MODE_INVALID",\n                no_effect_confirmed=True,\n            )\n\n        try:\n            (\n                spreadsheet_id,\n                range_a1,\n                sheet_id,\n                start_column,\n                key_relative_index,\n                row,\n                key_value,\n            ) = self._logical_append_input(command)\n        except ValueError as exc:\n            return DriveMutationReceipt(\n                False, error_code=str(exc), no_effect_confirmed=True\n            )\n\n        try:\n            current = (\n                self._sheets.spreadsheets()\n                .values()\n                .get(\n                    spreadsheetId=spreadsheet_id,\n                    range=range_a1,\n                    valueRenderOption="UNFORMATTED_VALUE",\n                    dateTimeRenderOption="SERIAL_NUMBER",\n                )\n                .execute()\n            )\n        except Exception as exc:\n            return DriveMutationReceipt(\n                False,\n                error_code=f"GOOGLE_SHEETS_LOGICAL_APPEND_PREFLIGHT_READ_FAILED:{type(exc).__name__}",\n                no_effect_confirmed=True,\n            )\n\n        raw_rows = current.get("values", [])\n        if not isinstance(raw_rows, list):\n            return DriveMutationReceipt(\n                False,\n                error_code="GOOGLE_SHEETS_LOGICAL_APPEND_PREFLIGHT_VALUES_INVALID",\n                no_effect_confirmed=True,\n            )\n        normalized_rows = _normalized_sheet_values(raw_rows)\n        if not isinstance(normalized_rows, list):\n            return DriveMutationReceipt(\n                False,\n                error_code="GOOGLE_SHEETS_LOGICAL_APPEND_PREFLIGHT_VALUES_INVALID",\n                no_effect_confirmed=True,\n            )\n        key_token = _stable_key_token(key_value)\n        matches = 0\n        for existing_row in normalized_rows:\n            if (\n                isinstance(existing_row, list)\n                and key_relative_index < len(existing_row)\n                and _stable_key_token(existing_row[key_relative_index]) == key_token\n            ):\n                matches += 1\n        if matches:\n            return DriveMutationReceipt(\n                False,\n                error_code="GOOGLE_SHEETS_STABLE_UNIQUE_KEY_DUPLICATE",\n                no_effect_confirmed=True,\n            )\n\n        logical_tail_index = len(normalized_rows)\n        requests = [\n            {\n                "insertDimension": {\n                    "range": {\n                        "sheetId": sheet_id,\n                        "dimension": "ROWS",\n                        "startIndex": logical_tail_index,\n                        "endIndex": logical_tail_index + 1,\n                    },\n                    "inheritFromBefore": logical_tail_index > 0,\n                }\n            },\n            {\n                "updateCells": {\n                    "start": {\n                        "sheetId": sheet_id,\n                        "rowIndex": logical_tail_index,\n                        "columnIndex": start_column,\n                    },\n                    "rows": [\n                        {\n                            "values": [\n                                {"userEnteredValue": _user_entered_value(value)}\n                                for value in row\n                            ]\n                        }\n                    ],\n                    "fields": "userEnteredValue",\n                }\n            },\n        ]\n        try:\n            (\n                self._sheets.spreadsheets()\n                .batchUpdate(\n                    spreadsheetId=spreadsheet_id,\n                    body={"requests": requests},\n                )\n                .execute()\n            )\n        except Exception as exc:\n            receipt = self._known_no_effect_http_receipt(exc)\n            if receipt is not None:\n                return receipt\n            raise\n\n        receipt_material = (\n            f"{spreadsheet_id}:{range_a1}:{logical_tail_index}:"\n            f"{key_token}:{command.action_id}"\n        )\n        receipt_id = "GSHEETS-" + sha256(receipt_material.encode("utf-8")).hexdigest()[:32]\n        return DriveMutationReceipt(\n            True, receipt_id, "google-sheets:spreadsheets.batchUpdate"\n        )'''
          )

          replace_once(
              adapter,
              '''    def _readback_sync(self, command: DriveMutationCommand) -> DriveStateReadback:\n        spreadsheet_id, range_a1, _, _ = self._mutation_input(command)\n        result = (\n            self._sheets.spreadsheets()\n            .values()\n            .get(\n                spreadsheetId=spreadsheet_id,\n                range=range_a1,\n                valueRenderOption="UNFORMATTED_VALUE",\n                dateTimeRenderOption="SERIAL_NUMBER",\n            )\n            .execute()\n        )\n        values = result.get("values", [])\n        digest = canonical_values_digest(values)\n        return DriveStateReadback(\n            digest,\n            "google-sheets:spreadsheets.values.get",\n            digest == command.expected_state_digest,\n            "" if digest == command.expected_state_digest else "GOOGLE_SHEETS_READBACK_MISMATCH",\n        )''',
              '''    def _readback_sync(self, command: DriveMutationCommand) -> DriveStateReadback:\n        mode = _payload(command).get("mutation_mode", "fixed_range").strip().lower() or "fixed_range"\n        if mode == "fixed_range":\n            spreadsheet_id, range_a1, _, _ = self._mutation_input(command)\n            result = (\n                self._sheets.spreadsheets()\n                .values()\n                .get(\n                    spreadsheetId=spreadsheet_id,\n                    range=range_a1,\n                    valueRenderOption="UNFORMATTED_VALUE",\n                    dateTimeRenderOption="SERIAL_NUMBER",\n                )\n                .execute()\n            )\n            values = result.get("values", [])\n            digest = canonical_values_digest(values)\n            return DriveStateReadback(\n                digest,\n                "google-sheets:spreadsheets.values.get",\n                digest == command.expected_state_digest,\n                ""\n                if digest == command.expected_state_digest\n                else "GOOGLE_SHEETS_READBACK_MISMATCH",\n            )\n\n        (\n            spreadsheet_id,\n            range_a1,\n            _,\n            _,\n            key_relative_index,\n            _,\n            key_value,\n        ) = self._logical_append_input(command)\n        result = (\n            self._sheets.spreadsheets()\n            .values()\n            .get(\n                spreadsheetId=spreadsheet_id,\n                range=range_a1,\n                valueRenderOption="UNFORMATTED_VALUE",\n                dateTimeRenderOption="SERIAL_NUMBER",\n            )\n            .execute()\n        )\n        values = result.get("values", [])\n        if not isinstance(values, list):\n            return DriveStateReadback(\n                "",\n                "google-sheets:spreadsheets.values.get",\n                False,\n                "GOOGLE_SHEETS_READBACK_VALUES_INVALID",\n            )\n        key_token = _stable_key_token(key_value)\n        matching_rows = [\n            row\n            for row in values\n            if isinstance(row, list)\n            and key_relative_index < len(row)\n            and _stable_key_token(row[key_relative_index]) == key_token\n        ]\n        if len(matching_rows) != 1:\n            return DriveStateReadback(\n                "",\n                "google-sheets:spreadsheets.values.get",\n                False,\n                "GOOGLE_SHEETS_STABLE_UNIQUE_KEY_NOT_EXACTLY_ONCE",\n            )\n        digest = canonical_values_digest([matching_rows[0]])\n        return DriveStateReadback(\n            digest,\n            "google-sheets:spreadsheets.values.get",\n            digest == command.expected_state_digest,\n            ""\n            if digest == command.expected_state_digest\n            else "GOOGLE_SHEETS_LOGICAL_APPEND_ROW_MISMATCH",\n        )'''
          )

          replace_once(
              'src/runtime_deployment.py',
              '''                value_input_option=str(item.get("value_input_option", "RAW")).strip(),\n                authority_sources=_authority_sources(item.get("authority_sources", [])),''',
              '''                value_input_option=str(item.get("value_input_option", "RAW")).strip(),\n                authority_sources=_authority_sources(item.get("authority_sources", [])),\n                mutation_mode=str(item.get("mutation_mode", "fixed_range")).strip(),\n                sheet_id=(\n                    int(item["sheet_id"])\n                    if str(item.get("sheet_id", "")).strip()\n                    else None\n                ),\n                stable_unique_key_column=str(\n                    item.get("stable_unique_key_column", "")\n                ).strip(),'''
          )

          test_path = 'tests/test_google_workspace_adapter.py'
          replace_once(
              test_path,
              '''class SpreadsheetsAPI:\n    def __init__(self, values_api):\n        self.values_api = values_api\n\n    def values(self):\n        return self.values_api''',
              '''class SpreadsheetsAPI:\n    def __init__(self, values_api):\n        self.values_api = values_api\n        self.batch_update_calls = []\n\n    def values(self):\n        return self.values_api\n\n    def batchUpdate(self, **kwargs):\n        self.batch_update_calls.append(kwargs)\n        requests = kwargs["body"]["requests"]\n        row_index = requests[0]["insertDimension"]["range"]["startIndex"]\n        cells = requests[1]["updateCells"]["rows"][0]["values"]\n        row = []\n        for cell in cells:\n            value = cell.get("userEnteredValue", {})\n            if "stringValue" in value:\n                row.append(value["stringValue"])\n            elif "numberValue" in value:\n                row.append(value["numberValue"])\n            elif "boolValue" in value:\n                row.append(value["boolValue"])\n            else:\n                row.append(None)\n        self.values_api.values.insert(row_index, row)\n        return Request({"replies": [{}, {}]})'''
          )

          with Path(test_path).open('a') as fh:
              fh.write(r'''\n\n\ndef logical_proposal(values_json='[["REC-NEW","2026-09-06"]]'):\n    result = resolve_model_intent(\n        record(),\n        ModelActionIntent(\n            "INTENT-LOGICAL",\n            "formal_persistence",\n            "drive.formal_cells.update",\n            expected_state_delta="append exact configured row",\n            authorization_target="formal-record",\n            arguments=(("values_json", values_json),),\n        ),\n        ActionCatalog((binding(),)),\n        sequence=1,\n    )\n    assert result.proposal is not None\n    return result.proposal\n\n\ndef logical_target():\n    return SheetsMutationTarget(\n        binding_id="drive.formal_cells.update",\n        spreadsheet_id="trusted-sheet",\n        range_a1="01_Intake!A:V",\n        value_input_option="RAW",\n        authority_sources=(AuthorityFileSource("AUTH:MAIN", "trusted-sheet"),),\n        mutation_mode="logical_append",\n        sheet_id=1001,\n        stable_unique_key_column="A",\n    )\n\n\ndef test_logical_append_target_is_deployment_owned_and_requires_one_row():\n    resolver = ConfiguredSheetsCommandResolver((logical_target(),))\n    command = resolver.resolve(logical_proposal())\n    assert command is not None\n    payload = dict(command.payload)\n    assert payload["spreadsheet_id"] == "trusted-sheet"\n    assert payload["range_a1"] == "01_Intake!A:V"\n    assert payload["mutation_mode"] == "logical_append"\n    assert payload["sheet_id"] == "1001"\n    assert payload["stable_unique_key_column"] == "A"\n    assert resolver.resolve(proposal()) is None\n\n\ndef test_logical_append_resolves_fresh_tail_and_emits_atomic_batch():\n    resolver = ConfiguredSheetsCommandResolver((logical_target(),))\n    command = resolver.resolve(logical_proposal())\n    assert command is not None\n    client = client_with_fakes()\n    client._sheets.values_api.values = [\n        ["record_id", "timestamp"],\n        ["REC-OLD", "2026-09-05"],\n    ]\n\n    mutation = asyncio.run(client.mutate(command))\n    assert mutation.success is True\n    assert mutation.source == "google-sheets:spreadsheets.batchUpdate"\n    assert len(client._sheets.spreadsheets_api.batch_update_calls) == 1\n    body = client._sheets.spreadsheets_api.batch_update_calls[0]["body"]\n    requests = body["requests"]\n    assert requests[0]["insertDimension"]["range"] == {\n        "sheetId": 1001,\n        "dimension": "ROWS",\n        "startIndex": 2,\n        "endIndex": 3,\n    }\n    assert requests[1]["updateCells"]["start"] == {\n        "sheetId": 1001,\n        "rowIndex": 2,\n        "columnIndex": 0,\n    }\n    readback = asyncio.run(client.readback(command))\n    assert readback.matched is True\n    assert readback.state_digest == command.expected_state_digest\n\n\ndef test_logical_append_blank_or_duplicate_key_blocks_before_mutation():\n    resolver = ConfiguredSheetsCommandResolver((logical_target(),))\n    client = client_with_fakes()\n    blank = resolver.resolve(logical_proposal('[["","2026-09-06"]]'))\n    assert blank is not None\n    blank_result = asyncio.run(client.mutate(blank))\n    assert blank_result.success is False\n    assert blank_result.no_effect_confirmed is True\n    assert blank_result.error_code == "SHEETS_STABLE_UNIQUE_KEY_REQUIRED"\n    assert client._sheets.spreadsheets_api.batch_update_calls == []\n\n    client._sheets.values_api.values = [["REC-DUP", "old"]]\n    duplicate = resolver.resolve(logical_proposal('[["REC-DUP","new"]]'))\n    assert duplicate is not None\n    duplicate_result = asyncio.run(client.mutate(duplicate))\n    assert duplicate_result.success is False\n    assert duplicate_result.no_effect_confirmed is True\n    assert duplicate_result.error_code == "GOOGLE_SHEETS_STABLE_UNIQUE_KEY_DUPLICATE"\n    assert client._sheets.spreadsheets_api.batch_update_calls == []\n\n\ndef test_logical_append_readback_fails_closed_on_duplicate_or_row_mismatch():\n    resolver = ConfiguredSheetsCommandResolver((logical_target(),))\n    command = resolver.resolve(logical_proposal())\n    assert command is not None\n    client = client_with_fakes()\n\n    client._sheets.values_api.values = [\n        ["REC-NEW", "2026-09-06"],\n        ["REC-NEW", "2026-09-06"],\n    ]\n    duplicate = asyncio.run(client.readback(command))\n    assert duplicate.matched is False\n    assert duplicate.error_code == "GOOGLE_SHEETS_STABLE_UNIQUE_KEY_NOT_EXACTLY_ONCE"\n\n    client._sheets.values_api.values = [["REC-NEW", "wrong"]]\n    mismatch = asyncio.run(client.readback(command))\n    assert mismatch.matched is False\n    assert mismatch.error_code == "GOOGLE_SHEETS_LOGICAL_APPEND_ROW_MISMATCH"\n''')

          deployment_test = 'tests/test_runtime_deployment.py'
          marker = '\n\nclass SqlitePostgresCompatConnection:'
          addition = r'''\n\ndef test_logical_append_target_configuration_is_deployment_owned():\n    values = deployment_values()\n    values["HAO_SHEETS_TARGETS_JSON"] = """[\n      {\n        "binding_id": "formal.intake.append",\n        "spreadsheet_id": "sheet-main",\n        "range_a1": "01_Intake!A:V",\n        "value_input_option": "RAW",\n        "mutation_mode": "logical_append",\n        "sheet_id": 1001,\n        "stable_unique_key_column": "A",\n        "authority_sources": [\n          {"ref": "AUTH-MAIN", "file_id": "drive-main"}\n        ]\n      }\n    ]"""\n    target = load_sheets_targets(values)[0]\n    assert target.mutation_mode == "logical_append"\n    assert target.sheet_id == 1001\n    assert target.stable_unique_key_column == "A"\n    assert target.range_a1 == "01_Intake!A:V"\n'''
          replace_once(deployment_test, marker, addition + marker)

          docs = 'docs/HAO_RUNTIME_V2_DEPLOYMENT.md'
          replace_once(
              docs,
