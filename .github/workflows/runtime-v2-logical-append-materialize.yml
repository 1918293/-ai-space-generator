name: Runtime v2 logical append materializer

on:
  push:
    branches:
      - exp/runtime-v2-logical-append-materialization

permissions:
  contents: write

jobs:
  materialize:
    if: ${{ !contains(github.event.head_commit.message, '[logical-append-materialized]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Verify exact parent and unchanged target files
        shell: bash
        env:
          PARENT: a2f52a34115dc5f9367a005e7f1982e0b9058c55
        run: |
          set -euo pipefail
          git merge-base --is-ancestor "$PARENT" HEAD
          for path in \
            ai-space-generator/src/google_workspace_adapter.py \
            ai-space-generator/src/runtime_deployment.py \
            ai-space-generator/tests/test_google_workspace_adapter.py
          do
            current=$(git hash-object "$path")
            parent=$(git rev-parse "$PARENT:$path")
            test "$current" = "$parent" || {
              echo "::error::TARGET_FILE_DRIFT:$path current=$current parent=$parent"
              exit 2
            }
          done

      - name: Fetch exact Codex unified diff from PR comment
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          COMMENT_ID: '5554522042'
          EXPECTED_PATCH_SHA256: '20b4e2750bd7537e103cd95d9c7726a7428f5998647250304349ade2ff7d863a'
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib
          import json
          import os
          import re
          import urllib.request
          from pathlib import Path

          url = (
              'https://api.github.com/repos/1918293/-ai-space-generator/issues/comments/'
              + os.environ['COMMENT_ID']
          )
          request = urllib.request.Request(
              url,
              headers={
                  'Authorization': f"Bearer {os.environ['GH_TOKEN']}",
                  'Accept': 'application/vnd.github+json',
                  'X-GitHub-Api-Version': '2022-11-28',
                  'User-Agent': 'hao-runtime-v2-materializer',
              },
          )
          with urllib.request.urlopen(request, timeout=30) as response:
              payload = json.load(response)

          body = payload.get('body', '')
          match = re.search(r'```diff\n(.*?)\n```', body, re.DOTALL)
          if match is None:
              raise SystemExit('CODEX_COMPLETE_DIFF_NOT_FOUND')
          patch = match.group(1) + '\n'
          digest = hashlib.sha256(patch.encode('utf-8')).hexdigest()
          expected = os.environ['EXPECTED_PATCH_SHA256']
          if digest != expected:
              raise SystemExit(
                  f'CODEX_PATCH_SHA256_MISMATCH:expected={expected}:actual={digest}'
              )

          changed = []
          for line in patch.splitlines():
              if line.startswith('diff --git a/'):
                  parts = line.split()
                  changed.append(parts[2][2:])
          allowed = {
              'ai-space-generator/src/google_workspace_adapter.py',
              'ai-space-generator/src/runtime_deployment.py',
              'ai-space-generator/tests/test_google_workspace_adapter.py',
          }
          if set(changed) != allowed or len(changed) != len(allowed):
              raise SystemExit(f'CODEX_PATCH_SCOPE_MISMATCH:{changed!r}')

          Path('/tmp/logical-append.patch').write_text(patch, encoding='utf-8')
          print(f'Exact Codex patch verified: sha256={digest}, files={len(changed)}')
          PY

      - name: Apply exact Codex patch
        shell: bash
        run: |
          set -euo pipefail
          git apply --check /tmp/logical-append.patch
          git apply /tmp/logical-append.patch
          git diff --check

      - name: Install complete integration dependencies
        working-directory: ai-space-generator
        run: >-
          python -m pip install --upgrade pytest
          -r requirements.txt
          -r requirements-control.txt

      - name: Focused logical append tests
        working-directory: ai-space-generator
        run: python -m pytest tests/test_google_workspace_adapter.py -q

      - name: Prior relevant adapter regressions
        working-directory: ai-space-generator
        run: >-
          python -m pytest
          tests/test_google_workspace_adapter.py
          tests/test_controlled_runner.py
          tests/test_reconciliation.py -q

      - name: Broader deployment and reconciliation surface
        working-directory: ai-space-generator
        run: >-
          python -m pytest
          tests/test_google_workspace_adapter.py
          tests/test_runtime_deployment.py
          tests/test_controlled_runner.py
          tests/test_provider_reconciliation.py
          tests/test_reconciliation.py -q

      - name: Compile and diff checks
        working-directory: ai-space-generator
        run: |
          python -m compileall -q src tests
          git diff --check

      - name: Commit exact candidate and remove one-shot workflow
        shell: bash
        env:
          PARENT: a2f52a34115dc5f9367a005e7f1982e0b9058c55
        run: |
          set -euo pipefail
          git rm .github/workflows/runtime-v2-logical-append-materialize.yml
          actual=$(git diff --name-only "$PARENT" | sort)
          expected=$(printf '%s\n' \
            ai-space-generator/src/google_workspace_adapter.py \
            ai-space-generator/src/runtime_deployment.py \
            ai-space-generator/tests/test_google_workspace_adapter.py | sort)
          test "$actual" = "$expected" || {
            echo "::error::NET_DIFF_SCOPE_MISMATCH"
            printf 'actual:\n%s\nexpected:\n%s\n' "$actual" "$expected"
            exit 3
          }
          git diff --check "$PARENT"
          git config user.name 'hao-runtime-v2-bot'
          git config user.email 'hao-runtime-v2-bot@users.noreply.github.com'
          git add \
            ai-space-generator/src/google_workspace_adapter.py \
            ai-space-generator/src/runtime_deployment.py \
            ai-space-generator/tests/test_google_workspace_adapter.py
          git commit -m 'EXP: materialize trusted Sheets logical append [logical-append-materialized]'
          git push origin HEAD:exp/runtime-v2-logical-append-materialization
