name: Contract Validation

on:
  push:
    branches:
      - fam/contracts-v0.1
      - codex/success-validation-20261018-0557
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  runtime-promotion-gate:
    name: runtime-promotion-gate
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ai-space-generator
    steps:
      - uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: ai-space-generator/requirements-control.txt
      - name: Install Runtime v2 dependencies
        run: python -m pip install --upgrade pytest -r requirements-control.txt
      - name: Run complete Runtime v2 regression surface
        run: >-
          python -m pytest tests -q
          --ignore=tests/test_core.py
          --ignore=tests/test_validation.py

  legacy-app-gate:
    name: legacy-app-gate
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ai-space-generator
    steps:
      - uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: ai-space-generator/requirements.txt
      - name: Install legacy application dependencies
        run: python -m pip install --upgrade pytest -r requirements.txt
      - name: Run legacy application regression surface
        run: python -m pytest tests/test_core.py tests/test_validation.py -q


  durable-receipt:
    name: durable-receipt
    if: ${{ always() }}
    needs:
      - runtime-promotion-gate
      - legacy-app-gate
    runs-on: ubuntu-latest
    steps:
      - name: Write durable execution receipt
        shell: bash
        env:
          RUNTIME_RESULT: ${{ needs.runtime-promotion-gate.result }}
          LEGACY_RESULT: ${{ needs.legacy-app-gate.result }}
        run: |
          set -euo pipefail
          mkdir -p durable-receipt
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          receipt = {
              "schema": "hao-github-durable-receipt-v1",
              "workflow": os.environ["GITHUB_WORKFLOW"],
              "run_id": os.environ["GITHUB_RUN_ID"],
              "run_attempt": os.environ["GITHUB_RUN_ATTEMPT"],
              "sha": os.environ["GITHUB_SHA"],
              "ref": os.environ["GITHUB_REF"],
              "repository": os.environ["GITHUB_REPOSITORY"],
              "jobs": {
                  "runtime-promotion-gate": os.environ["RUNTIME_RESULT"],
                  "legacy-app-gate": os.environ["LEGACY_RESULT"],
              },
          }
          Path("durable-receipt/receipt.json").write_text(
              json.dumps(receipt, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8",
          )
          print(json.dumps(receipt, sort_keys=True))
          PY
      - name: Upload durable execution receipt
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: durable-receipt-${{ github.run_id }}-${{ github.run_attempt }}
          path: durable-receipt/receipt.json
          if-no-files-found: error
          retention-days: 30
          overwrite: false

  fetch-dcshadownet-srd-weight:
    name: fetch-dcshadownet-srd-weight
    runs-on: ubuntu-latest
    steps:
      - name: Download official DC-ShadowNet SRD public checkpoint
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dcshadownet-weight
          python - <<'PY'
          import hashlib, json, urllib.request
          from pathlib import Path

          url = "https://www.dropbox.com/scl/fi/icj273vu98w1l9zzwjxt7/SRD_params_0500000.pt?dl=1&rlkey=6jzx33gwat7t4fv30spw3c0za"
          out = Path("dcshadownet-weight/SRD_params_0500000.pt")
          req = urllib.request.Request(url, headers={"User-Agent": "Mozilla/5.0"})
          with urllib.request.urlopen(req, timeout=120) as r, out.open("wb") as f:
              while True:
                  chunk = r.read(1024 * 1024)
                  if not chunk:
                      break
                  f.write(chunk)
              final_url = r.geturl()
              content_type = r.headers.get("Content-Type")
          got = hashlib.sha256(out.read_bytes()).hexdigest()
          manifest = {
              "source_repository": "jinyeying/DC-ShadowNet-Hard-and-Soft-Shadow-Removal",
              "source_readme_path": "README.md",
              "model": "SRD_params_0500000.pt",
              "url": url,
              "final_url": final_url,
              "sha256": got,
              "bytes": out.stat().st_size,
              "content_type": content_type,
              "private_385_bytes_uploaded": False,
          }
          if out.stat().st_size < 1024 * 1024:
              raise SystemExit(f"checkpoint too small: {out.stat().st_size}")
          if "text/html" in (content_type or "").lower():
              raise SystemExit(f"unexpected HTML content-type: {content_type}")
          Path("dcshadownet-weight/manifest.json").write_text(
              json.dumps(manifest, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          print(json.dumps(manifest, sort_keys=True))
          PY
      - name: Split checkpoint into materializable chunks
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dcshadownet-chunks
          split -b 64M -d -a 2 dcshadownet-weight/SRD_params_0500000.pt dcshadownet-chunks/part-
          python - <<'PY'
          import hashlib, json
          from pathlib import Path
          root = Path('dcshadownet-chunks')
          parts = []
          for p in sorted(root.glob('part-*')):
              parts.append({'name': p.name, 'bytes': p.stat().st_size, 'sha256': hashlib.sha256(p.read_bytes()).hexdigest()})
          if len(parts) != 9:
              raise SystemExit(f'unexpected part count: {len(parts)}')
          m = json.loads(Path('dcshadownet-weight/manifest.json').read_text(encoding='utf-8'))
          m['parts'] = parts
          root.joinpath('chunk_manifest.json').write_text(json.dumps(m, indent=2, sort_keys=True) + '\n', encoding='utf-8')
          print(json.dumps({'checkpoint_sha256': m['sha256'], 'checkpoint_bytes': m['bytes'], 'parts': parts}, sort_keys=True))
          PY
      - name: Upload DC-ShadowNet chunk manifest
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: dcshadownet-srd-manifest-${{ github.run_id }}-${{ github.run_attempt }}
          path: dcshadownet-chunks/chunk_manifest.json
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
          overwrite: false
      - name: Upload DC-ShadowNet chunk 00
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: dcshadownet-srd-part-00-${{ github.run_id }}-${{ github.run_attempt }}
          path: dcshadownet-chunks/part-00
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
          overwrite: false
      - name: Upload DC-ShadowNet chunk 01
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: dcshadownet-srd-part-01-${{ github.run_id }}-${{ github.run_attempt }}
          path: dcshadownet-chunks/part-01
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
          overwrite: false
      - name: Upload DC-ShadowNet chunk 02
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: dcshadownet-srd-part-02-${{ github.run_id }}-${{ github.run_attempt }}
          path: dcshadownet-chunks/part-02
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
          overwrite: false
      - name: Upload DC-ShadowNet chunk 03
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: dcshadownet-srd-part-03-${{ github.run_id }}-${{ github.run_attempt }}
          path: dcshadownet-chunks/part-03
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
          overwrite: false
      - name: Upload DC-ShadowNet chunk 04
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: dcshadownet-srd-part-04-${{ github.run_id }}-${{ github.run_attempt }}
          path: dcshadownet-chunks/part-04
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
          overwrite: false
      - name: Upload DC-ShadowNet chunk 05
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: dcshadownet-srd-part-05-${{ github.run_id }}-${{ github.run_attempt }}
          path: dcshadownet-chunks/part-05
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
          overwrite: false
      - name: Upload DC-ShadowNet chunk 06
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: dcshadownet-srd-part-06-${{ github.run_id }}-${{ github.run_attempt }}
          path: dcshadownet-chunks/part-06
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
          overwrite: false
      - name: Upload DC-ShadowNet chunk 07
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: dcshadownet-srd-part-07-${{ github.run_id }}-${{ github.run_attempt }}
          path: dcshadownet-chunks/part-07
          if-no-files-found: error
