name: Contract Validation

on:
  push:
    branches:
      - fam/contracts-v0.1
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  runtime-promotion-gate:
    name: runtime-promotion-gate
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ai-space-generator
    steps:
      - uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: ai-space-generator/requirements-control.txt
      - name: Install Runtime v2 dependencies
        run: python -m pip install --upgrade pytest -r requirements-control.txt
      - name: Run complete Runtime v2 regression surface
        run: >-
          python -m pytest tests -q
          --ignore=tests/test_core.py
          --ignore=tests/test_validation.py

  legacy-app-gate:
    name: legacy-app-gate
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ai-space-generator
    steps:
      - uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: ai-space-generator/requirements.txt
      - name: Install legacy application dependencies
        run: python -m pip install --upgrade pytest -r requirements.txt
      - name: Run legacy application regression surface
        run: python -m pytest tests/test_core.py tests/test_validation.py -q


  durable-receipt:
    name: durable-receipt
    if: ${{ always() }}
    needs:
      - runtime-promotion-gate
      - legacy-app-gate
    runs-on: ubuntu-latest
    steps:
      - name: Write durable execution receipt
        shell: bash
        env:
          RUNTIME_RESULT: ${{ needs.runtime-promotion-gate.result }}
          LEGACY_RESULT: ${{ needs.legacy-app-gate.result }}
        run: |
          set -euo pipefail
          mkdir -p durable-receipt
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          receipt = {
              "schema": "hao-github-durable-receipt-v1",
              "workflow": os.environ["GITHUB_WORKFLOW"],
              "run_id": os.environ["GITHUB_RUN_ID"],
              "run_attempt": os.environ["GITHUB_RUN_ATTEMPT"],
              "sha": os.environ["GITHUB_SHA"],
              "ref": os.environ["GITHUB_REF"],
              "repository": os.environ["GITHUB_REPOSITORY"],
              "jobs": {
                  "runtime-promotion-gate": os.environ["RUNTIME_RESULT"],
                  "legacy-app-gate": os.environ["LEGACY_RESULT"],
              },
          }
          Path("durable-receipt/receipt.json").write_text(
              json.dumps(receipt, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8",
          )
          print(json.dumps(receipt, sort_keys=True))
          PY
      - name: Upload durable execution receipt
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: durable-receipt-${{ github.run_id }}-${{ github.run_attempt }}
          path: durable-receipt/receipt.json
          if-no-files-found: error
          retention-days: 30
          overwrite: false
