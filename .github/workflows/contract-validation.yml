name: Contract Validation

on:
  push:
    branches:
      - fam/contracts-v0.1
      - codex/success-validation-20261018-0557
      - codex/success-validation-20261018-0557
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  runtime-promotion-gate:
    name: runtime-promotion-gate
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ai-space-generator
    steps:
      - uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: ai-space-generator/requirements-control.txt
      - name: Install Runtime v2 dependencies
        run: python -m pip install --upgrade pytest -r requirements-control.txt
      - name: Run complete Runtime v2 regression surface
        run: >-
          python -m pytest tests -q
          --ignore=tests/test_core.py
          --ignore=tests/test_validation.py

  legacy-app-gate:
    name: legacy-app-gate
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ai-space-generator
    steps:
      - uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: ai-space-generator/requirements.txt
      - name: Install legacy application dependencies
        run: python -m pip install --upgrade pytest -r requirements.txt
      - name: Run legacy application regression surface
        run: python -m pytest tests/test_core.py tests/test_validation.py -q


  arniqa-weight-fetch:
    name: arniqa-weight-fetch
    runs-on: ubuntu-latest
    steps:
      - name: Download official ARNIQA weights
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p arniqa-weights
          curl --fail --location --retry 3 --retry-delay 2 \
            https://github.com/miccunifi/ARNIQA/releases/download/weights/ARNIQA.pth \
            -o arniqa-weights/ARNIQA.pth
          curl --fail --location --retry 3 --retry-delay 2 \
            https://github.com/miccunifi/ARNIQA/releases/download/weights/regressor_koniq10k.pth \
            -o arniqa-weights/regressor_koniq10k.pth
          sha256sum arniqa-weights/ARNIQA.pth arniqa-weights/regressor_koniq10k.pth | tee arniqa-weights/SHA256SUMS
          python - <<'PY'
          import json
          from pathlib import Path
          files = {}
          for name in ["ARNIQA.pth", "regressor_koniq10k.pth"]:
              p = Path("arniqa-weights") / name
              files[name] = {"size_bytes": p.stat().st_size}
          manifest = {
              "schema": "hao-arniqa-weight-bundle-v1",
              "source_repo": "https://github.com/miccunifi/ARNIQA",
              "release_tag": "weights",
              "assets": {
                  "ARNIQA.pth": {
                      "url": "https://github.com/miccunifi/ARNIQA/releases/download/weights/ARNIQA.pth",
                      **files["ARNIQA.pth"],
                  },
                  "regressor_koniq10k.pth": {
                      "url": "https://github.com/miccunifi/ARNIQA/releases/download/weights/regressor_koniq10k.pth",
                      **files["regressor_koniq10k.pth"],
                  },
              },
          }
          Path("arniqa-weights/manifest.json").write_text(
              json.dumps(manifest, indent=2) + "\n", encoding="utf-8"
          )
          PY
      - name: Upload ARNIQA weight bundle
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: arniqa-weight-bundle-${{ github.run_id }}-${{ github.run_attempt }}
          path: arniqa-weights/
          if-no-files-found: error
          retention-days: 3
          overwrite: false

  durable-receipt:
    name: durable-receipt
    if: ${{ always() }}
    needs:
      - runtime-promotion-gate
      - legacy-app-gate
    runs-on: ubuntu-latest
    steps:
      - name: Write durable execution receipt
        shell: bash
        env:
          RUNTIME_RESULT: ${{ needs.runtime-promotion-gate.result }}
          LEGACY_RESULT: ${{ needs.legacy-app-gate.result }}
        run: |
          set -euo pipefail
          mkdir -p durable-receipt
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          receipt = {
              "schema": "hao-github-durable-receipt-v1",
              "workflow": os.environ["GITHUB_WORKFLOW"],
              "run_id": os.environ["GITHUB_RUN_ID"],
              "run_attempt": os.environ["GITHUB_RUN_ATTEMPT"],
              "sha": os.environ["GITHUB_SHA"],
              "ref": os.environ["GITHUB_REF"],
              "repository": os.environ["GITHUB_REPOSITORY"],
              "jobs": {
                  "runtime-promotion-gate": os.environ["RUNTIME_RESULT"],
                  "legacy-app-gate": os.environ["LEGACY_RESULT"],
              },
          }
          Path("durable-receipt/receipt.json").write_text(
              json.dumps(receipt, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8",
          )
          print(json.dumps(receipt, sort_keys=True))
          PY
      - name: Upload durable execution receipt
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: durable-receipt-${{ github.run_id }}-${{ github.run_attempt }}
          path: durable-receipt/receipt.json
          if-no-files-found: error
          retention-days: 30
          overwrite: false
