name: Hao Hair ZITS++ Feasibility Probe

on:
  push:
    branches:
      - hao-hair-sr-test-20260817
    paths:
      - '.github/workflows/hair-umbrella-zitspp-feasibility.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  zitspp-feasibility:
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - name: Checkout Hao test branch
        uses: actions/checkout@v4

      - name: Set up Python 3.8
        uses: actions/setup-python@v5
        with:
          python-version: '3.8'

      - name: Download verified 2x SR source
        uses: actions/download-artifact@v4
        with:
          name: hao-hair-realesr-general-x2-dn020
          path: work/source_artifact
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: 32003834720

      - name: Clone official ZITS++ source
        run: |
          git clone --depth 1 https://github.com/ewrfcas/ZITS-PlusPlus.git work/ZITS-PlusPlus
          cd work/ZITS-PlusPlus
          git rev-parse HEAD | tee ../zitspp_commit.txt

      - name: Prepare deterministic 512 ROI and umbrella mask
        run: |
          python -m pip install --quiet pillow==10.4.0 numpy==1.24.4 requests==2.31.0
          python - <<'PY'
          from pathlib import Path
          from PIL import Image, ImageDraw
          import numpy as np, json

          files=list(Path('work/source_artifact').rglob('*.png'))
          assert files, 'verified SR source missing'
          src=Image.open(files[0]).convert('RGB')
          assert src.size==(2360,4192), src.size

          box=(1336, 2860, 2360, 3884)
          crop=src.crop(box)
          roi=crop.resize((512,512), Image.Resampling.LANCZOS)
          Path('work/zits_input/images').mkdir(parents=True,exist_ok=True)
          Path('work/zits_input/masks').mkdir(parents=True,exist_ok=True)
          roi.save('work/zits_input/images/umbrella_roi.png')

          mask=Image.new('L',(512,512),0)
          d=ImageDraw.Draw(mask)
          poly=[(300,118),(354,110),(397,126),(434,115),(478,132),(511,153),
                (511,511),(305,511),(282,472),(276,422),(286,370),(300,320),
                (305,278),(298,238),(288,196)]
          d.polygon(poly,fill=255)
          d.polygon([(253,322),(288,322),(292,472),(260,472)],fill=255)
          mask.save('work/zits_input/masks/umbrella_roi.png')

          report={
            'source_size':src.size,
            'source_crop_box':box,
            'test_size':[512,512],
            'mask_pixels':int(np.count_nonzero(np.asarray(mask))),
            'mask_fraction':float(np.count_nonzero(np.asarray(mask))/512**2)
          }
          Path('work/roi_report.json').write_text(json.dumps(report,indent=2),encoding='utf-8')
          print(json.dumps(report,indent=2))
          PY

      - name: Probe official checkpoint endpoints without downloading model bodies
        continue-on-error: true
        run: |
          python - <<'PY'
          import requests, json, base64
          base={
            'model_256_share':'https://1drv.ms/u/s!AqmYPmoRZryegR1XjcmbjLV2OTk1?e=ToOT2d',
            'model_512_share':'https://1drv.ms/u/s!AqmYPmoRZryegR9OPEgqq7LvgqJR?e=4Erzvr',
            'lsm_hawp_folder':'https://drive.google.com/drive/folders/1yg4Nc20D34sON0Ni_IOezjJCFHXKGWUW'
          }
          probes=dict(base)
          probes['model_256_download']=base['model_256_share']+'&download=1'
          probes['model_512_download']=base['model_512_share']+'&download=1'
          for key in ('model_256_share','model_512_share'):
              u=base[key]
              sid='u!'+base64.urlsafe_b64encode(u.encode()).decode().rstrip('=')
              probes[key.replace('_share','_onedrive_api')]=f'https://api.onedrive.com/v1.0/shares/{sid}/root/content'

          out={}
          for k,u in probes.items():
              try:
                  r=requests.get(u,allow_redirects=True,stream=True,timeout=30,headers={'Range':'bytes=0-0','User-Agent':'Mozilla/5.0'})
                  ctype=r.headers.get('content-type')
                  out[k]={
                    'status':r.status_code,
                    'content_type':ctype,
                    'content_length':r.headers.get('content-length'),
                    'accept_ranges':r.headers.get('accept-ranges'),
                    'content_disposition':r.headers.get('content-disposition'),
                    'looks_binary':bool(ctype and 'text/html' not in ctype.lower()),
                    'final_url':r.url[:600]
                  }
                  r.close()
              except Exception as e:
                  out[k]={'error':repr(e)}
          open('work/checkpoint_probe.json','w').write(json.dumps(out,indent=2))
          print(json.dumps(out,indent=2))
          PY

      - name: Audit CUDA and native-extension coupling
        if: always()
        run: |
          cd work/ZITS-PlusPlus
          {
            echo '=== CUDA call sites ==='
            grep -RIn --exclude-dir=.git -E '\.cuda\(|cuda:' . || true
            echo '=== CUDA/C++ custom op files ==='
            find torch_utils -type f \( -name '*.cu' -o -name '*.cpp' \) -print || true
            echo '=== NMS build script ==='
            cat nms/cxx/src/build.sh || true
          } > ../cuda_native_audit.txt
          cat ../cuda_native_audit.txt

      - name: Probe legacy CPU dependency environment
        if: always()
        continue-on-error: true
        run: |
          set -o pipefail
          {
            echo "PYTHON=$(python --version 2>&1)"
            python -m pip install --upgrade 'pip<25'
            python -m pip install numpy==1.20.3
            python -m pip install torch==1.9.1+cpu torchvision==0.10.1+cpu -f https://download.pytorch.org/whl/torch_stable.html
            python -m pip install pytorch-lightning==1.2.9 PyYAML==6.0 yacs==0.1.8 tqdm==4.59.0 timm==0.3.2 opencv-python-headless==4.5.5.64 scipy==1.7.3 scikit-image==0.19.3 lpips==0.1.4
            python - <<'PY'
          import torch, cv2, scipy, skimage, pytorch_lightning, numpy
          print('NUMPY',numpy.__version__)
          print('TORCH',torch.__version__)
          print('CUDA_AVAILABLE',torch.cuda.is_available())
          print('CV2',cv2.__version__)
          print('SCIPY',scipy.__version__)
          print('SKIMAGE',skimage.__version__)
          print('PL',pytorch_lightning.__version__)
          PY
          } 2>&1 | tee work/dependency_probe.log

      - name: Probe NMS native build on standard GitHub runner
        if: always()
        continue-on-error: true
        run: |
          set -o pipefail
          cd work/ZITS-PlusPlus/nms/cxx/src
          bash build.sh 2>&1 | tee ../../../../nms_build.log
          file ../lib/solve_csa.so | tee -a ../../../../nms_build.log

      - name: Probe import graph after CPU patch
        if: always()
        continue-on-error: true
        run: |
          set -o pipefail
          cd work/ZITS-PlusPlus
          cp test.py test_cpu_probe.py
          python - <<'PY'
          from pathlib import Path
          p=Path('test_cpu_probe.py')
          s=p.read_text()
          s=s.replace('model.cuda()', "device = torch.device('cpu')\n    model.to(device)")
          s=s.replace("batch[k] = batch[k].cuda()", "batch[k] = batch[k].to(device)")
          p.write_text(s)
          PY
          python -m py_compile test_cpu_probe.py
          python - <<'PY' 2>&1 | tee ../import_probe.log
          import sys
          sys.path.insert(0,'.')
          import torch
          print('torch',torch.__version__,'cuda',torch.cuda.is_available())
          import dataset.dataloader
          import networks.tsr
          import networks.upsample
          import trainers.pl_trainers
          import trainers.nms_temp
          print('CORE_IMPORTS_OK')
          PY

      - name: Build feasibility verdict
        if: always()
        run: |
          python - <<'PY'
          from pathlib import Path
          import json, re
          root=Path('work')
          cp={}
          try: cp=json.loads((root/'checkpoint_probe.json').read_text())
          except: pass
          dep=(root/'dependency_probe.log').read_text(errors='ignore') if (root/'dependency_probe.log').exists() else ''
          imp=(root/'import_probe.log').read_text(errors='ignore') if (root/'import_probe.log').exists() else ''
          nms=(Path('nms_build.log').read_text(errors='ignore') if Path('nms_build.log').exists() else '')
          audit=(root/'cuda_native_audit.txt').read_text(errors='ignore') if (root/'cuda_native_audit.txt').exists() else ''

          cuda_calls=len(re.findall(r'\.cuda\(',audit))
          custom_cuda=len(re.findall(r'\.cu$',audit,re.M))
          dependency_ok='TORCH 1.9.1+cpu' in dep and 'PL 1.2.9' in dep
          import_ok='CORE_IMPORTS_OK' in imp
          nms_ok=('solve_csa.so' in nms and ('shared object' in nms or 'ELF' in nms))
          model_keys=['model_512_download','model_512_onedrive_api','model_512_share']
          model512_binary=any(isinstance(cp.get(k),dict) and cp[k].get('status') in (200,206) and cp[k].get('looks_binary') for k in model_keys)
          probe_complete=bool(audit) and bool(dep) and bool(imp) and bool(nms) and bool(cp)
          full_cpu_candidate=probe_complete and dependency_ok and import_ok and nms_ok and model512_binary
          if not probe_complete:
              status='PROBE_INCOMPLETE'
          elif full_cpu_candidate:
              status='CANDIDATE_FOR_FULL_CPU_TEST'
          else:
              status='BLOCKED_ON_STANDARD_GITHUB_RUNNER'
          verdict={
            'method':'ZITS++ official TPAMI2023 codebase',
            'standard_runner_gpu':False,
            'probe_complete':probe_complete,
            'cuda_call_sites_detected':cuda_calls,
            'custom_cuda_sources_detected':custom_cuda,
            'legacy_cpu_dependencies_ok':dependency_ok,
            'core_imports_after_minimal_cpu_patch_ok':import_ok,
            'nms_native_build_ok':nms_ok,
            'model_512_binary_endpoint_found':model512_binary,
            'full_cpu_inference_candidate':full_cpu_candidate,
            'status':status,
            'policy':'Do not promote or reconnect to production retouch chain without actual visual inference + source regression QA.'
          }
          Path('work/zitspp_feasibility_verdict.json').write_text(json.dumps(verdict,indent=2),encoding='utf-8')
          print(json.dumps(verdict,indent=2))
          PY

      - name: Upload feasibility evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hao-hair-zitspp-feasibility-v02
          path: |
            work/zitspp_commit.txt
            work/roi_report.json
            work/zits_input/images/umbrella_roi.png
            work/zits_input/masks/umbrella_roi.png
            work/checkpoint_probe.json
            work/cuda_native_audit.txt
            work/dependency_probe.log
            work/import_probe.log
            nms_build.log
            work/zitspp_feasibility_verdict.json
          if-no-files-found: warn
          retention-days: 7
