name: Runtime v2 Logical Append Review Fixes

on:
  push:
    branches:
      - exp/runtime-v2-logical-append-review-fixes

permissions:
  contents: write

jobs:
  materialize-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 2

      - name: Guard exact parent
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "ef1d6f9a5254f935723cb67912e81861ae747346"
          test "$(git diff --name-only HEAD^ HEAD)" = ".github/workflows/runtime-v2-logical-append-review-fixes.yml"

      - name: Materialize bounded review fixes
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              file = Path(path)
              text = file.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"SOURCE_GUARD_FAILED:{path}:{count}")
              file.write_text(text.replace(old, new, 1))

          adapter = "ai-space-generator/src/google_workspace_adapter.py"

          replace_once(
              adapter,
              "from dataclasses import dataclass\nfrom hashlib import sha256",
              "from dataclasses import dataclass\nfrom decimal import Decimal\nfrom hashlib import sha256",
          )

          replace_once(
              adapter,
              '''def canonical_values_digest(values: object) -> str:\n    normalized = _normalized_sheet_values(values)\n    payload = json.dumps(normalized, ensure_ascii=False, sort_keys=True, separators=(",", ":"))\n    return "sha256:" + sha256(payload.encode("utf-8")).hexdigest()\n\n\ndef _argument_map''',
              '''def canonical_values_digest(values: object) -> str:\n    normalized = _normalized_sheet_values(values)\n    payload = json.dumps(normalized, ensure_ascii=False, sort_keys=True, separators=(",", ":"))\n    return "sha256:" + sha256(payload.encode("utf-8")).hexdigest()\n\n\ndef _canonical_logical_key(value: Any) -> str:\n    if isinstance(value, bool):\n        payload: object = ["bool", value]\n    elif isinstance(value, (int, float)):\n        number = Decimal(str(value))\n        if not number.is_finite():\n            raise ValueError("SHEETS_LOGICAL_APPEND_NUMERIC_KEY_INVALID")\n        canonical_number = "0" if number == 0 else format(number.normalize(), "f")\n        payload = ["number", canonical_number]\n    elif isinstance(value, str):\n        payload = ["string", value]\n    else:\n        raise ValueError("SHEETS_LOGICAL_APPEND_KEY_TYPE_INVALID")\n    return json.dumps(payload, ensure_ascii=False, separators=(",", ":"))\n\n\ndef _argument_map''',
          )

          replace_once(
              adapter,
              '''def _logical_append_columns(range_a1: str, unique_key_column: str) -> tuple[str, int, int, int]:\n    match = _FULL_COLUMN_RANGE.fullmatch(range_a1)\n    if match is None:\n        raise ValueError("SHEETS_LOGICAL_APPEND_RANGE_INVALID")\n    start = _column_index(match.group("start"))\n    end = _column_index(match.group("end"))\n    key = _column_index(unique_key_column)\n    if end < start or not start <= key <= end:\n        raise ValueError("SHEETS_UNIQUE_KEY_COLUMN_OUTSIDE_RANGE")\n    return match.group("sheet"), start, end, key - start\n''',
              '''def _logical_append_columns(range_a1: str, unique_key_column: str) -> tuple[str, int, int, int]:\n    match = _FULL_COLUMN_RANGE.fullmatch(range_a1)\n    if match is None:\n        raise ValueError("SHEETS_LOGICAL_APPEND_RANGE_INVALID")\n    start = _column_index(match.group("start"))\n    end = _column_index(match.group("end"))\n    key = _column_index(unique_key_column)\n    if end < start or not start <= key <= end:\n        raise ValueError("SHEETS_UNIQUE_KEY_COLUMN_OUTSIDE_RANGE")\n    return match.group("sheet"), start, end, key - start\n\n\ndef _sheet_title_from_a1(sheet: str) -> str:\n    if len(sheet) >= 2 and sheet.startswith("'") and sheet.endswith("'"):\n        return sheet[1:-1].replace("''", "'")\n    return sheet\n''',
          )

          replace_once(
              adapter,
              '''                "unique_key_column": target.unique_key_column.strip(),\n                "key": key,\n            },''',
              '''                "unique_key_column": target.unique_key_column.strip(),\n                "key": _canonical_logical_key(key),\n            },''',
          )

          replace_once(
              adapter,
              '''    def _sheet_values(self, spreadsheet_id: str, range_a1: str) -> list[list[Any]]:\n        result = (\n            self._sheets.spreadsheets()\n            .values()\n            .get(\n                spreadsheetId=spreadsheet_id,\n                range=range_a1,\n                valueRenderOption="UNFORMATTED_VALUE",\n                dateTimeRenderOption="SERIAL_NUMBER",\n            )\n            .execute()\n        )\n        values = result.get("values", [])\n        if not isinstance(values, list) or any(not isinstance(row, list) for row in values):\n            raise ValueError("GOOGLE_SHEETS_VALUES_INVALID")\n        return values\n''',
              '''    def _sheet_values(self, spreadsheet_id: str, range_a1: str) -> list[list[Any]]:\n        result = (\n            self._sheets.spreadsheets()\n            .values()\n            .get(\n                spreadsheetId=spreadsheet_id,\n                range=range_a1,\n                valueRenderOption="UNFORMATTED_VALUE",\n                dateTimeRenderOption="SERIAL_NUMBER",\n            )\n            .execute()\n        )\n        values = result.get("values", [])\n        if not isinstance(values, list) or any(not isinstance(row, list) for row in values):\n            raise ValueError("GOOGLE_SHEETS_VALUES_INVALID")\n        return values\n\n    def _logical_append_sheet_identity_matches(\n        self,\n        spreadsheet_id: str,\n        *,\n        sheet_id: int,\n        sheet_a1: str,\n    ) -> bool:\n        result = (\n            self._sheets.spreadsheets()\n            .get(\n                spreadsheetId=spreadsheet_id,\n                fields="sheets(properties(sheetId,title))",\n            )\n            .execute()\n        )\n        sheets = result.get("sheets", [])\n        if not isinstance(sheets, list):\n            raise ValueError("GOOGLE_SHEETS_METADATA_INVALID")\n        expected_title = _sheet_title_from_a1(sheet_a1)\n        matches = []\n        for item in sheets:\n            if not isinstance(item, Mapping):\n                continue\n            properties = item.get("properties")\n            if not isinstance(properties, Mapping):\n                continue\n            if properties.get("sheetId") == sheet_id:\n                matches.append(str(properties.get("title", "")))\n        return matches == [expected_title]\n''',
          )

          replace_once(
              adapter,
              '''        spreadsheet_id, range_a1, sheet_id, _, start_column, _, key_offset, row = mutation\n        key = row[key_offset] if key_offset < len(row) else None\n        if key is None or (isinstance(key, str) and not key.strip()):\n            return DriveMutationReceipt(\n                False, error_code="SHEETS_LOGICAL_APPEND_KEY_REQUIRED", no_effect_confirmed=True\n            )\n        try:\n            current_values = self._sheet_values(spreadsheet_id, range_a1)\n        except Exception as exc:\n            return DriveMutationReceipt(\n                False,\n                error_code=f"GOOGLE_SHEETS_APPEND_PREFLIGHT_FAILED:{type(exc).__name__}",\n                no_effect_confirmed=True,\n            )\n        existing_keys = [\n            existing[key_offset]\n            for existing in current_values\n            if key_offset < len(existing)\n        ]\n        if key in existing_keys:\n            return DriveMutationReceipt(\n                False, error_code="SHEETS_LOGICAL_APPEND_KEY_DUPLICATE", no_effect_confirmed=True\n            )''',
              '''        spreadsheet_id, range_a1, sheet_id, sheet, start_column, _, key_offset, row = mutation\n        key = row[key_offset] if key_offset < len(row) else None\n        if key is None or (isinstance(key, str) and not key.strip()):\n            return DriveMutationReceipt(\n                False, error_code="SHEETS_LOGICAL_APPEND_KEY_REQUIRED", no_effect_confirmed=True\n            )\n        try:\n            key_token = _canonical_logical_key(key)\n        except ValueError as exc:\n            return DriveMutationReceipt(\n                False, error_code=str(exc), no_effect_confirmed=True\n            )\n        try:\n            if not self._logical_append_sheet_identity_matches(\n                spreadsheet_id, sheet_id=sheet_id, sheet_a1=sheet\n            ):\n                return DriveMutationReceipt(\n                    False,\n                    error_code="SHEETS_LOGICAL_APPEND_SHEET_ID_MISMATCH",\n                    no_effect_confirmed=True,\n                )\n            current_values = self._sheet_values(spreadsheet_id, range_a1)\n        except Exception as exc:\n            return DriveMutationReceipt(\n                False,\n                error_code=f"GOOGLE_SHEETS_APPEND_PREFLIGHT_FAILED:{type(exc).__name__}",\n                no_effect_confirmed=True,\n            )\n        existing_key_tokens = [\n            _canonical_logical_key(existing[key_offset])\n            for existing in current_values\n            if key_offset < len(existing)\n        ]\n        if key_token in existing_key_tokens:\n            return DriveMutationReceipt(\n                False, error_code="SHEETS_LOGICAL_APPEND_KEY_DUPLICATE", no_effect_confirmed=True\n            )''',
          )

          replace_once(
              adapter,
              '''        spreadsheet_id, range_a1, _, sheet, start_column, end_column, key_offset, expected_row = mutation\n        key = expected_row[key_offset] if key_offset < len(expected_row) else None\n        values = self._sheet_values(spreadsheet_id, range_a1)\n        matching_rows = [\n            index\n            for index, row in enumerate(values)\n            if key_offset < len(row) and row[key_offset] == key\n        ]\n        if len(matching_rows) != 1:\n            return DriveStateReadback(\n                "",\n                "google-sheets:spreadsheets.values.get",\n                False,\n                "GOOGLE_SHEETS_APPEND_KEY_NOT_EXACTLY_ONCE",\n            )\n        row_number = matching_rows[0] + 1\n        start_name = _payload(command)["range_a1"].split("!", 1)[1].split(":", 1)[0]\n        end_name = _payload(command)["range_a1"].rsplit(":", 1)[1]\n        exact_range = f"{sheet}!{start_name}{row_number}:{end_name}{row_number}"\n        exact_values = self._sheet_values(spreadsheet_id, exact_range)\n        digest = canonical_values_digest(exact_values)''',
              '''        spreadsheet_id, range_a1, _, _, _, _, key_offset, expected_row = mutation\n        key = expected_row[key_offset] if key_offset < len(expected_row) else None\n        try:\n            key_token = _canonical_logical_key(key)\n        except ValueError:\n            return DriveStateReadback(\n                "",\n                "google-sheets:spreadsheets.values.get",\n                False,\n                "SHEETS_LOGICAL_APPEND_KEY_INVALID",\n            )\n        values = self._sheet_values(spreadsheet_id, range_a1)\n        matching_rows = [\n            row\n            for row in values\n            if key_offset < len(row)\n            and _canonical_logical_key(row[key_offset]) == key_token\n        ]\n        if len(matching_rows) != 1:\n            return DriveStateReadback(\n                "",\n                "google-sheets:spreadsheets.values.get",\n                False,\n                "GOOGLE_SHEETS_APPEND_KEY_NOT_EXACTLY_ONCE",\n            )\n        digest = canonical_values_digest([matching_rows[0]])''',
          )

          tests = "ai-space-generator/tests/test_google_workspace_adapter.py"
          replace_once(
              tests,
              '''class SpreadsheetsAPI:\n    def __init__(self, values_api):\n        self.values_api = values_api\n        self.batch_update_calls = []\n\n    def values(self):\n        return self.values_api\n\n    def batchUpdate(self, **kwargs):\n        self.batch_update_calls.append(kwargs)\n        return Request({"replies": [{}, {}]})''',
              '''class SpreadsheetsAPI:\n    def __init__(self, values_api):\n        self.values_api = values_api\n        self.batch_update_calls = []\n        self.get_calls = []\n        self.sheets = [{"properties": {"sheetId": 123, "title": "01_Intake"}}]\n\n    def values(self):\n        return self.values_api\n\n    def get(self, **kwargs):\n        self.get_calls.append(kwargs)\n        return Request({"sheets": self.sheets})\n\n    def batchUpdate(self, **kwargs):\n        self.batch_update_calls.append(kwargs)\n        return Request({"replies": [{}, {}]})''',
          )

          replace_once(
              tests,
              '''def test_logical_append_readback_requires_one_key_and_exact_canonical_row():\n    command = logical_append_command()\n    client = client_with_fakes()\n    responses = iter(\n        [\n            [["record_id", "value"], ["REC-2", "new"]],\n            [["REC-2", "new"]],\n        ]\n    )\n\n    def get(**kwargs):\n        client._sheets.values_api.get_calls.append(kwargs)\n        return Request({"range": kwargs["range"], "values": next(responses)})\n\n    client._sheets.values_api.get = get\n    readback = asyncio.run(client.readback(command))\n    assert readback.matched is True\n    assert client._sheets.values_api.get_calls[1]["range"] == "01_Intake!A2:B2"\n\n    client = client_with_fakes()\n    client._sheets.values_api.values = [["REC-2", "new"], ["REC-2", "new"]]\n    duplicate = asyncio.run(client.readback(command))\n    assert duplicate.matched is False\n    assert duplicate.error_code == "GOOGLE_SHEETS_APPEND_KEY_NOT_EXACTLY_ONCE"\n\n    client = client_with_fakes()\n    responses = iter([[["REC-2", "wrong"]], [["REC-2", "wrong"]]])\n    client._sheets.values_api.get = lambda **kwargs: Request(\n        {"range": kwargs["range"], "values": next(responses)}\n    )\n    mismatch = asyncio.run(client.readback(command))\n    assert mismatch.matched is False\n    assert mismatch.error_code == "GOOGLE_SHEETS_READBACK_MISMATCH"''',
              '''def test_logical_append_readback_requires_one_key_and_exact_canonical_row_from_one_snapshot():\n    command = logical_append_command()\n    client = client_with_fakes()\n    client._sheets.values_api.values = [["record_id", "value"], ["REC-2", "new"]]\n\n    readback = asyncio.run(client.readback(command))\n    assert readback.matched is True\n    assert len(client._sheets.values_api.get_calls) == 1\n    assert client._sheets.values_api.get_calls[0]["range"] == "01_Intake!A:B"\n\n    client = client_with_fakes()\n    client._sheets.values_api.values = [["REC-2", "new"], ["REC-2", "new"]]\n    duplicate = asyncio.run(client.readback(command))\n    assert duplicate.matched is False\n    assert duplicate.error_code == "GOOGLE_SHEETS_APPEND_KEY_NOT_EXACTLY_ONCE"\n\n    client = client_with_fakes()\n    client._sheets.values_api.values = [["REC-2", "wrong"]]\n    mismatch = asyncio.run(client.readback(command))\n    assert mismatch.matched is False\n    assert mismatch.error_code == "GOOGLE_SHEETS_READBACK_MISMATCH"''',
          )

          test_path = Path(tests)
          text = test_path.read_text()
          marker = "test_logical_append_rejects_sheet_id_title_mismatch_before_mutation"
          if marker in text:
              raise SystemExit("TEST_ALREADY_PRESENT")
          test_path.write_text(
              text
              + '''\n\n\ndef test_logical_append_rejects_sheet_id_title_mismatch_before_mutation():\n    command = logical_append_command()\n    client = client_with_fakes()\n    client._sheets.spreadsheets_api.sheets = [\n        {"properties": {"sheetId": 123, "title": "Wrong_Tab"}},\n        {"properties": {"sheetId": 999, "title": "01_Intake"}},\n    ]\n    client._sheets.values_api.values = [["record_id", "value"]]\n\n    mutation = asyncio.run(client.mutate(command))\n\n    assert mutation.success is False\n    assert mutation.error_code == "SHEETS_LOGICAL_APPEND_SHEET_ID_MISMATCH"\n    assert mutation.no_effect_confirmed is True\n    assert len(client._sheets.spreadsheets_api.get_calls) == 1\n    assert client._sheets.values_api.get_calls == []\n    assert client._sheets.spreadsheets_api.batch_update_calls == []\n\n\ndef test_logical_append_numeric_keys_share_one_canonical_uniqueness_identity():\n    resolver = ConfiguredSheetsCommandResolver(\n        (\n            SheetsMutationTarget(\n                binding_id="drive.formal_cells.update",\n                spreadsheet_id="trusted-sheet",\n                range_a1="01_Intake!A:B",\n                mutation_mode="logical_append",\n                sheet_id=123,\n                unique_key_column="A",\n            ),\n        )\n    )\n    base = proposal()\n\n    def for_run(run_id, values_json):\n        return type(base)(\n            **{\n                **base.__dict__,\n                "action_id": f"{run_id}:A0001:drive.formal_cells.update",\n                "idempotency_key": f"{run_id}:A0001:drive.formal_cells.update",\n                "arguments": (("values_json", values_json),),\n            }\n        )\n\n    integer_key = resolver.logical_append_uniqueness_key(for_run("RUN-I", '[[1,"one"]]'))\n    float_key = resolver.logical_append_uniqueness_key(for_run("RUN-F", '[[1.0,"two"]]'))\n    bool_key = resolver.logical_append_uniqueness_key(for_run("RUN-B", '[[true,"three"]]'))\n\n    assert integer_key == float_key\n    assert bool_key != integer_key\n\n\ndef test_logical_append_numeric_duplicate_preflight_uses_canonical_key_semantics():\n    command = logical_append_command('[[1,"new"]]')\n    client = client_with_fakes()\n    client._sheets.values_api.values = [["record_id", "value"], [1.0, "old"]]\n\n    duplicate = asyncio.run(client.mutate(command))\n\n    assert duplicate.success is False\n    assert duplicate.error_code == "SHEETS_LOGICAL_APPEND_KEY_DUPLICATE"\n    assert duplicate.no_effect_confirmed is True\n    assert client._sheets.spreadsheets_api.batch_update_calls == []\n'''
          )
          PY

      - name: Install Runtime dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install -q -r ai-space-generator/requirements-control.txt

      - name: Run focused review-fix tests
        working-directory: ai-space-generator
        shell: bash
        run: |
          set -euo pipefail
          pytest -q \
            tests/test_google_workspace_adapter.py \
            tests/test_idempotent_broker.py \
            tests/test_runtime_deployment.py \
            tests/test_provider_reconciliation.py \
            tests/test_reconciliation.py
          python -m compileall -q src tests
          git diff --check

      - name: Commit tested candidate and self-remove workflow
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/runtime-v2-logical-append-review-fixes.yml
          git config user.name "hao-runtime-v2-bot"
          git config user.email "hao-runtime-v2-bot@users.noreply.github.com"
          git add ai-space-generator/src/google_workspace_adapter.py \
                  ai-space-generator/tests/test_google_workspace_adapter.py \
                  .github/workflows/runtime-v2-logical-append-review-fixes.yml
          git commit -m "EXP: close trusted Sheets append review findings"
          git push origin HEAD:exp/runtime-v2-logical-append-review-fixes
