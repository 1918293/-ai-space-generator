name: Runtime v2 Decision Provenance Candidate Materializer

on:
  push:
    branches:
      - exp/runtime-v2-integration-current

permissions:
  contents: write

concurrency:
  group: runtime-v2-decision-provenance-candidate
  cancel-in-progress: false

jobs:
  materialize:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ai-space-generator
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: ai-space-generator/requirements-control.txt
      - name: Materialize bounded decision provenance delta
        working-directory: .
        run: python .github/runtime-v2-decision-provenance-materialize.py
      - name: Compile affected control files
        run: python -m py_compile src/execution_control.py src/control_gateway.py
      - name: Install focused Runtime dependencies
        run: python -m pip install --upgrade pytest -r requirements-control.txt
      - name: Run focused control gateway regressions
        run: python -m pytest tests/test_control_gateway.py -q
      - name: Commit verified source delta when present
        working-directory: .
        run: |
          if git diff --quiet -- ai-space-generator/src/execution_control.py ai-space-generator/src/control_gateway.py ai-space-generator/tests/test_control_gateway.py; then
            echo "No source delta to commit."
            exit 0
          fi
          git config user.name "Hao"
          git config user.email "133175353+1918293@users.noreply.github.com"
          git add ai-space-generator/src/execution_control.py ai-space-generator/src/control_gateway.py ai-space-generator/tests/test_control_gateway.py
          git commit -m "EXP: bind Runtime decisions to exact policy provenance"
          git push origin HEAD:exp/runtime-v2-integration-current
