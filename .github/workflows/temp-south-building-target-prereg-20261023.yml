name: TEMP South Building Exact Sparse Export 2026-10-23

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/temp-south-building-target-prereg-20261023.yml
  push:
    branches:
      - temp/south-building-target-prereg-20261023

permissions:
  contents: read

jobs:
  exact-sparse-export:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Read exact first-party sparse members by HTTP range
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence/sparse
          python - <<'PY'
          import hashlib, io, json, pathlib, subprocess, zipfile
          URL="https://github.com/colmap/colmap/releases/download/3.11.1/south-building.zip"
          TOTAL=419421847
          EXPECTED={
            "south-building/sparse/cameras.txt":"2193006c1390caa227b6713951cebdfe4e7fc9805c980d91d4125d43f8ede660",
            "south-building/sparse/images.txt":"a9dca725dcbd197ccdaa5fe5c51a8567ade99b0bfbd477f1df080b11f4de8086",
            "south-building/sparse/points3D.txt":"5afb847913a9e141cd025dad70db1da9acbab8523f18890f4676b3c384907923",
          }
          class RF(io.RawIOBase):
            def __init__(self): self.pos=0
            def readable(self): return True
            def seekable(self): return True
            def tell(self): return self.pos
            def seek(self,o,w=io.SEEK_SET):
              self.pos={io.SEEK_SET:o,io.SEEK_CUR:self.pos+o,io.SEEK_END:TOTAL+o}[w]; return self.pos
            def read(self,n=-1):
              if self.pos>=TOTAL:return b""
              if n<0:n=TOTAL-self.pos
              n=min(n,TOTAL-self.pos)
              if n==0:return b""
              a=self.pos;b=a+n-1
              p=subprocess.run(["curl","-fsSL","--retry","3","--range",f"{a}-{b}",URL],capture_output=True,check=True)
              if len(p.stdout)!=n: raise RuntimeError((a,b,len(p.stdout),n))
              self.pos+=n;return p.stdout
          receipts={}
          with zipfile.ZipFile(RF()) as z:
            for member,expected in EXPECTED.items():
              data=z.read(member); sha=hashlib.sha256(data).hexdigest()
              if sha!=expected: raise SystemExit(f"SHA mismatch {member}: {sha}")
              info=z.getinfo(member)
              out=pathlib.Path("evidence/sparse")/pathlib.Path(member).name
              out.write_bytes(data)
              receipts[member]={"bytes":len(data),"crc32":f"{info.CRC:08x}","sha256":sha}
          pathlib.Path("evidence/sparse-receipt.json").write_text(json.dumps({
            "schema":"hao.south-building-exact-sparse-export.v1",
            "asset_id":213120796,
            "published_bytes":TOTAL,
            "full_archive_downloaded":False,
            "members":receipts
          },sort_keys=True,indent=2)+"\n")
          print(json.dumps(receipts,sort_keys=True))
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: south-building-exact-sparse-20261023
          path: evidence
          retention-days: 2
          if-no-files-found: error
