name: IMG7009 MIGAN Multipass Ephemeral

on:
  push:
    branches:
      - tmp/img7009-lama-20261018
    paths:
      - .github/workflows/img7009-lama-ephemeral.yml

permissions:
  contents: read

jobs:
  inpaint:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Download canonical source and LaMa model
        shell: bash
        env:
          SOURCE_URL: https://at.adobe.com/qHXvwbRKlMI1pFDM
          SOURCE_SHA256: 48ffd0b05fd39e233a14ce58cb6c7c5e23f65de7a9942c26833839a71e9bf5dc
          MODEL_URL: https://github.com/Sanster/models/releases/download/migan/migan_traced.pt
        run: |
          set -euo pipefail
          mkdir -p /tmp/img7009
          curl -fL --retry 4 --retry-all-errors --connect-timeout 20 "$SOURCE_URL" -o /tmp/img7009/source.jpeg
          echo "$SOURCE_SHA256  /tmp/img7009/source.jpeg" | sha256sum -c -
          curl -fL --retry 4 --retry-all-errors --connect-timeout 20 "$MODEL_URL" -o /tmp/img7009/migan_traced.pt
          test "$(stat -c%s /tmp/img7009/big-lama.pt)" -gt 1000000
          sha256sum /tmp/img7009/big-lama.pt > /tmp/img7009/model.sha256

      - name: Install CPU inference dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --quiet --upgrade pip
          python -m pip install --quiet numpy pillow
          python -m pip install --quiet torch --index-url https://download.pytorch.org/whl/cpu

      - name: Run MIGAN and hard-lock outside mask
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/img7009/run.py <<'PY'
          import hashlib, json
          from pathlib import Path
          import numpy as np
          import torch
          from PIL import Image, ImageDraw
          
          root=Path('/tmp/img7009')
          src_path=root/'source.jpeg'
          model_path=root/'migan_traced.pt'
          out_path=root/'IMG7009_MIGAN_multipass_v3.png'
          overlay_path=root/'IMG7009_mask_overlay.png'
          mask_path=root/'mask.png'
          qa_path=root/'qa.json'
          
          src_pil=Image.open(src_path)
          icc=src_pil.info.get('icc_profile')
          src=np.array(src_pil.convert('RGB'),dtype=np.uint8)
          H,W=src.shape[:2]
          if (W,H)!=(1152,1536):
              raise SystemExit(f'unexpected source size {(W,H)}')
          
          # Five bounded target masks. Coordinates are from the canonical 1152x1536 source.
          # They intentionally overlap slightly so object edges are not left behind.
          pass_polygons=[
            # A: leaning plywood + narrow left-side strips
            [[0,785],[38,785],[45,855],[48,855],[55,860],[300,858],[308,1248],[332,1255],[330,1295],[0,1308]],
            # B: loose bags/buckets/cables/baskets on bottom-left floor
            [[0,1185],[335,1185],[392,1260],[415,1395],[395,1535],[0,1535]],
            # C: portable aluminium ladder + loose red item beside it
            [[568,880],[690,880],[700,1220],[560,1225]],
            # D: stacked sacks / loose bags in right foreground
            [[720,1015],[890,1005],[985,1100],[1075,1535],[690,1535],[685,1225]],
            # E: dark portable ladder + temporary table + loose cleaning supplies far right
            [[880,920],[1151,920],[1151,1385],[850,1385],[855,1045]]
          ]
          
          def make_mask(poly):
              m=Image.new('L',(W,H),0)
              d=ImageDraw.Draw(m)
              d.polygon([tuple(p) for p in poly],fill=255)
              return np.array(m,dtype=np.uint8)>0
          
          masks=[make_mask(p) for p in pass_polygons]
          union=np.zeros((H,W),dtype=bool)
          for m in masks: union|=m
          
          # Load once; run crop-triggered inference so each pass sees nearby structure instead of one 26% hole.
          model=torch.jit.load(str(model_path),map_location='cpu').eval()
          
          def round_crop(lo,hi,limit,pad=128):
              return max(0,lo-pad), min(limit,hi+pad)

          def infer_region(cur,mask,idx):
              ys,xs=np.where(mask)
              if not len(xs): return cur
              x1,x2=round_crop(int(xs.min()),int(xs.max())+1,W)
              y1,y2=round_crop(int(ys.min()),int(ys.max())+1,H)
              crop=cur[y1:y2,x1:x2]
              cm=mask[y1:y2,x1:x2]
              ch,cw=crop.shape[:2]

              # IOPaint MIGAN semantics: local crop, max-size 512, square pad, 4-channel [0.5-mask, erased RGB].
              side=max(ch,cw)
              pt=(side-ch)//2; pb=side-ch-pt
              pl=(side-cw)//2; pr=side-cw-pl
              padded=np.pad(crop,((pt,pb),(pl,pr),(0,0)),mode='reflect')
              pm=np.pad(cm.astype(np.uint8),((pt,pb),(pl,pr)),mode='constant')
              pi=np.array(Image.fromarray(padded,'RGB').resize((512,512),Image.Resampling.LANCZOS),dtype=np.uint8)
              pmi=np.array(Image.fromarray(pm*255,'L').resize((512,512),Image.Resampling.NEAREST),dtype=np.uint8)>127

              image=torch.from_numpy(pi.astype(np.float32)/255.0*2.0-1.0).permute(2,0,1).unsqueeze(0)
              mt=torch.from_numpy(pmi.astype(np.float32)).unsqueeze(0).unsqueeze(0)
              erased=image*(1.0-mt)
              inp=torch.cat([0.5-mt,erased],dim=1)
              with torch.inference_mode():
                  pred=model(inp)
              if isinstance(pred,(tuple,list)): pred=pred[0]
              pred=((pred.permute(0,2,3,1)*127.5+127.5).round().clamp(0,255).to(torch.uint8))[0].cpu().numpy()

              # Back to the exact crop geometry, then accept model pixels only under the original mask.
              pred_sq=np.array(Image.fromarray(pred,'RGB').resize((side,side),Image.Resampling.BICUBIC),dtype=np.uint8)
              pred_crop=pred_sq[pt:pt+ch,pl:pl+cw]
              out=cur.copy()
              region=out[y1:y2,x1:x2]
              region[cm]=pred_crop[cm]
              out[y1:y2,x1:x2]=region
              Image.fromarray(out,'RGB').save(root/f'pass_{idx}.png',compress_level=6,icc_profile=icc)
              return out

          cur=src.copy()
          for idx,m in enumerate(masks,1):
              cur=infer_region(cur,m,idx)
          
          # Absolute hard lock: regardless of model behavior, bytes outside the union return to canonical source pixels.
          final=cur.copy()
          final[~union]=src[~union]
          Image.fromarray(final,'RGB').save(out_path,compress_level=6,icc_profile=icc)
          Image.fromarray((union*255).astype(np.uint8),'L').save(mask_path)
          
          decoded=np.array(Image.open(out_path).convert('RGB'),dtype=np.uint8)
          changed=np.any(decoded!=src,axis=2)
          outside=~union
          diff=np.abs(decoded.astype(np.int16)-src.astype(np.int16))
          qa={
            'source_sha256':hashlib.sha256(src_path.read_bytes()).hexdigest(),
            'mask_sha256':hashlib.sha256(mask_path.read_bytes()).hexdigest(),
            'model_sha256':hashlib.sha256(model_path.read_bytes()).hexdigest(),
            'final_sha256':hashlib.sha256(out_path.read_bytes()).hexdigest(),
            'width':W,'height':H,'passes':len(masks),
            'mask_pixels':int(union.sum()),
            'changed_pixels':int(changed.sum()),
            'inside_changed_pixels':int((changed&union).sum()),
            'outside_changed_pixels':int((changed&outside).sum()),
            'outside_max_channel_difference':int(diff[outside].max(initial=0)),
            'icc_source_bytes':len(icc or b''),
            'icc_final_bytes':len(Image.open(out_path).info.get('icc_profile') or b''),
          }
          qa['technical_preservation_pass']=(
            qa['outside_changed_pixels']==0 and qa['outside_max_channel_difference']==0
            and qa['width']==1152 and qa['height']==1536
            and qa['icc_source_bytes']==qa['icc_final_bytes']
            and qa['inside_changed_pixels']>0
          )
          qa_path.write_text(json.dumps(qa,indent=2),encoding='utf-8')
          if not qa['technical_preservation_pass']:
              raise SystemExit(json.dumps(qa))
          
          overlay=src.astype(np.float32)
          red=np.zeros_like(overlay); red[...,0]=255
          overlay[union]=overlay[union]*0.55+red[union]*0.45
          Image.fromarray(np.clip(overlay,0,255).astype(np.uint8),'RGB').save(overlay_path,compress_level=6)
          print(json.dumps(qa,indent=2))
          
          PY
          python /tmp/img7009/run.py

      - name: Upload bounded result
        uses: actions/upload-artifact@v4
        with:
          name: img7009-lama-bounded
          path: |
            /tmp/img7009/IMG7009_MIGAN_multipass_v3.png
            /tmp/img7009/IMG7009_mask_overlay.png
            /tmp/img7009/mask.png
            /tmp/img7009/qa.json
            /tmp/img7009/model.sha256
          if-no-files-found: error
          retention-days: 1
