name: IMG7009 LaMa Ephemeral

on:
  push:
    branches:
      - tmp/img7009-lama-20261018
    paths:
      - .github/workflows/img7009-lama-ephemeral.yml

permissions:
  contents: read

jobs:
  inpaint:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Download canonical source and LaMa model
        shell: bash
        env:
          SOURCE_URL: https://at.adobe.com/qHXvwbRKlMI1pFDM
          SOURCE_SHA256: 48ffd0b05fd39e233a14ce58cb6c7c5e23f65de7a9942c26833839a71e9bf5dc
          MODEL_URL: https://github.com/Sanster/models/releases/download/add_big_lama/big-lama.pt
        run: |
          set -euo pipefail
          mkdir -p /tmp/img7009
          curl -fL --retry 4 --retry-all-errors --connect-timeout 20 "$SOURCE_URL" -o /tmp/img7009/source.jpeg
          echo "$SOURCE_SHA256  /tmp/img7009/source.jpeg" | sha256sum -c -
          curl -fL --retry 4 --retry-all-errors --connect-timeout 20 "$MODEL_URL" -o /tmp/img7009/big-lama.pt
          test "$(stat -c%s /tmp/img7009/big-lama.pt)" -gt 1000000
          sha256sum /tmp/img7009/big-lama.pt > /tmp/img7009/model.sha256

      - name: Install CPU inference dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --quiet --upgrade pip
          python -m pip install --quiet numpy pillow
          python -m pip install --quiet torch --index-url https://download.pytorch.org/whl/cpu

      - name: Run LaMa and hard-lock outside mask
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/img7009/run.py <<'PY'
          import hashlib, json
          from pathlib import Path
          import numpy as np
          import torch
          from PIL import Image, ImageDraw

          root=Path('/tmp/img7009')
          src_path=root/'source.jpeg'
          mask_path=root/'mask.png'
          model_path=root/'big-lama.pt'
          out_path=root/'IMG7009_LaMa_masked_v1.png'
          overlay_path=root/'IMG7009_mask_overlay.png'
          qa_path=root/'qa.json'

          src_pil=Image.open(src_path)
          icc=src_pil.info.get('icc_profile')
          src=np.array(src_pil.convert('RGB'),dtype=np.uint8)

          # Vectorized from IMG7009_mask_precise_v7.png (4 contours, 58 points).
          # The vector form avoids storing the source photo or a large binary mask in Git history.
          polygons=[[[433,1008],[420,1069],[499,1069],[484,1008]],[[748,1023],[705,1138],[705,1175],[699,1176],[708,1303],[753,1457],[877,1493],[879,1496],[873,1535],[1151,1535],[1151,1038],[1020,1043],[1010,953],[923,948],[915,1046],[912,1047],[910,1042],[907,1003],[901,1003],[861,1012],[861,1190],[844,1191],[843,1017],[837,1013],[829,1013]],[[598,903],[582,1202],[678,1194],[652,903]],[[0,791],[0,1535],[367,1535],[372,1465],[373,1464],[388,1472],[392,1472],[407,1365],[407,1355],[391,1258],[390,1281],[340,1281],[339,1256],[317,1255],[317,1208],[311,1208],[294,1212],[291,1211],[281,878],[53,873],[43,1206],[40,1208],[34,1208],[32,1199],[29,791]]]
          mask_pil=Image.new('L',src_pil.size,0)
          draw=ImageDraw.Draw(mask_pil)
          for p in polygons:
              draw.polygon([tuple(x) for x in p],fill=255)
          mask_pil.save(mask_path)
          mask=np.array(mask_pil,dtype=np.uint8)>0
          if src.shape[:2] != mask.shape:
              raise SystemExit(f'size mismatch: {src.shape[:2]} vs {mask.shape}')
          h,w=mask.shape
          if h%8 or w%8:
              raise SystemExit('LaMa input dimensions must be divisible by 8 for this bounded run')

          image=torch.from_numpy(src.astype(np.float32)/255.0).permute(2,0,1).unsqueeze(0)
          m=torch.from_numpy(mask.astype(np.float32)).unsqueeze(0).unsqueeze(0)

          model=torch.jit.load(str(model_path),map_location='cpu').eval()
          with torch.inference_mode():
              pred=model(image,m)
          if isinstance(pred,(tuple,list)):
              pred=pred[0]
          pred=pred[0].permute(1,2,0).detach().cpu().numpy()
          pred=np.clip(pred*255.0,0,255).round().astype(np.uint8)

          final=src.copy()
          final[mask]=pred[mask]
          save_kw={'compress_level':6}
          if icc:
              save_kw['icc_profile']=icc
          Image.fromarray(final,'RGB').save(out_path,**save_kw)

          decoded=np.array(Image.open(out_path).convert('RGB'),dtype=np.uint8)
          changed=np.any(decoded!=src,axis=2)
          outside=~mask
          diff=np.abs(decoded.astype(np.int16)-src.astype(np.int16))
          qa={
              'source_sha256':hashlib.sha256(src_path.read_bytes()).hexdigest(),
              'mask_sha256':hashlib.sha256(mask_path.read_bytes()).hexdigest(),
              'model_sha256':hashlib.sha256(model_path.read_bytes()).hexdigest(),
              'final_sha256':hashlib.sha256(out_path.read_bytes()).hexdigest(),
              'width':w,'height':h,
              'mask_pixels':int(mask.sum()),
              'changed_pixels':int(changed.sum()),
              'inside_changed_pixels':int((changed&mask).sum()),
              'outside_changed_pixels':int((changed&outside).sum()),
              'outside_max_channel_difference':int(diff[outside].max(initial=0)),
              'icc_source_bytes':len(icc or b''),
              'icc_final_bytes':len(Image.open(out_path).info.get('icc_profile') or b''),
          }
          qa['technical_preservation_pass']=(
              qa['outside_changed_pixels']==0
              and qa['outside_max_channel_difference']==0
              and qa['width']==1152 and qa['height']==1536
              and qa['icc_source_bytes']==qa['icc_final_bytes']
              and qa['inside_changed_pixels']>0
          )
          qa_path.write_text(json.dumps(qa,indent=2),encoding='utf-8')
          if not qa['technical_preservation_pass']:
              raise SystemExit(json.dumps(qa))

          overlay=src.astype(np.float32)
          red=np.zeros_like(overlay); red[...,0]=255
          overlay[mask]=(overlay[mask]*0.55+red[mask]*0.45)
          Image.fromarray(np.clip(overlay,0,255).astype(np.uint8),'RGB').save(overlay_path,compress_level=6)
          print(json.dumps(qa,indent=2))
          PY
          python /tmp/img7009/run.py

      - name: Upload bounded result
        uses: actions/upload-artifact@v4
        with:
          name: img7009-lama-bounded
          path: |
            /tmp/img7009/IMG7009_LaMa_masked_v1.png
            /tmp/img7009/IMG7009_mask_overlay.png
            /tmp/img7009/mask.png
            /tmp/img7009/qa.json
            /tmp/img7009/model.sha256
          if-no-files-found: error
          retention-days: 1
