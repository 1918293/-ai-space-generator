name: Hao Hair Salon Safe SR Executor v01

on:
  workflow_dispatch:
  push:
    branches: [hao-hair-sr-test-20260817]
    paths:
      - '.github/workflows/hair-salon-safe-sr-executor-v01.yml'
      - 'tools/hair_salon_pipeline/orchestrator.py'

permissions:
  contents: read
  actions: read

jobs:
  safe-sr-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Fetch verified source and approved SR reference
        run: |
          mkdir -p work/input work/output work/approved work/reports
          curl -L --fail --retry 3 -o work/input/source.jpg 'https://at.adobe.com/Rk6GAssWozJREKvk'
      - uses: actions/download-artifact@v4
        with:
          name: hao-hair-realesr-general-x2-dn020
          path: work/approved
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: '32003834720'
      - name: Install pinned CPU stack
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y libgl1 libglib2.0-0 >/dev/null
          python -m pip install --upgrade pip -q
          pip install numpy==1.26.4 pillow==10.4.0 opencv-python-headless==4.10.0.84
          pip install torch==2.1.2 torchvision==0.16.2 --index-url https://download.pytorch.org/whl/cpu
          pip install basicsr==1.4.2 --no-deps
          pip install tqdm pyyaml scipy==1.11.4 scikit-image==0.22.0 lmdb requests==2.31.0 tb-nightly yapf future addict
          git clone --depth 1 --branch v0.3.0 https://github.com/xinntao/Real-ESRGAN.git /tmp/Real-ESRGAN
          cd /tmp/Real-ESRGAN && test "$(git rev-parse HEAD)" = 'fa4c8a03ae3dbc9ea6ed471a6ab5da94ac15c2ea' && pip install -e . --no-deps
      - name: Preflight and execution permission contract
        run: |
          python tools/hair_salon_pipeline/preflight.py --source work/input/source.jpg --output work/reports/preflight.json --short-edge-target 1600
          python tools/hair_salon_pipeline/orchestrator.py --preflight work/reports/preflight.json --allow-safe-sr --output work/reports/orchestration_plan.json
          python - <<'PY'
          import json
          p=json.load(open('work/reports/orchestration_plan.json'))
          sr=next(x for x in p['plan'] if x['stage']=='SR')
          assert sr['action']=='AUTO_EXECUTE_CONSERVATIVE_SR',sr
          assert sr['auto_execute_eligible'] is True,sr
          PY
      - name: Execute pinned conservative SR into new output
        run: |
          cd /tmp/Real-ESRGAN
          python inference_realesrgan.py -n realesr-general-x4v3 -dn 0.20 -i "$GITHUB_WORKSPACE/work/input/source.jpg" -o "$GITHUB_WORKSPACE/work/output" -s 2 --tile 128 --tile_pad 16 --fp32 --suffix safe_sr_v01 --ext png
      - name: Regression against approved SR and record provenance
        run: |
          python - <<'PY'
          from pathlib import Path
          from PIL import Image
          import hashlib,json,cv2,numpy as np
          from skimage.metrics import structural_similarity as ssim
          new=max(Path('work/output').glob('*.png'),key=lambda p:p.stat().st_size)
          ref=max(Path('work/approved').glob('*.png'),key=lambda p:p.stat().st_size)
          src=Path('work/input/source.jpg')
          a=np.asarray(Image.open(ref).convert('RGB')); b=np.asarray(Image.open(new).convert('RGB'))
          assert a.shape==b.shape==(4192,2360,3),(a.shape,b.shape)
          mae=float(np.mean(np.abs(a.astype(np.int16)-b.astype(np.int16))))
          mse=float(np.mean((a.astype(np.float32)-b.astype(np.float32))**2)); psnr=99.0 if mse==0 else float(20*np.log10(255/np.sqrt(mse)))
          s=float(ssim(a,b,channel_axis=2,data_range=255))
          # New executor must be materially equivalent to the already verified SR reference.
          assert psnr>=45.0,(psnr,s,mae); assert s>=0.995,(psnr,s,mae)
          def sha(p): return hashlib.sha256(Path(p).read_bytes()).hexdigest()
          weights={p.name:sha(p) for p in Path('/tmp/Real-ESRGAN/weights').glob('*.pth')}
          report={'status':'PASS_SAFE_SR_EXECUTOR_REGRESSION','source_sha256':sha(src),'new_output':str(new),'new_output_sha256':sha(new),'approved_reference':str(ref),'approved_reference_sha256':sha(ref),'comparison':{'psnr_db':psnr,'ssim':s,'mae_8bit':mae,'pixel_identical':bool(np.array_equal(a,b))},'executor':{'realesrgan_tag':'v0.3.0','realesrgan_commit':'fa4c8a03ae3dbc9ea6ed471a6ab5da94ac15c2ea','model':'realesr-general-x4v3','denoise_strength':0.20,'scale':2,'fp32':True,'tile':128,'tile_pad':16,'face_enhance':False},'weight_sha256':weights,'policy':{'new_output_only':True,'source_overwrite':False,'pending_downstream_hair_qa':True,'no_auto_promotion':True}}
          Path('work/reports/safe_sr_executor_report.json').write_text(json.dumps(report,indent=2))
          print(json.dumps(report,indent=2))
          PY
      - name: Upload executor evidence
        uses: actions/upload-artifact@v4
        with:
          name: hao-hair-salon-safe-sr-executor-v01
          path: |
            work/output/*.png
            work/reports/*.json
          retention-days: 14
