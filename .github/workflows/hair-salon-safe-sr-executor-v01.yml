name: Hao Hair Salon Safe SR Executor v01

on:
  workflow_dispatch:
  push:
    branches: [hao-hair-sr-test-20260817]
    paths:
      - '.github/workflows/hair-salon-safe-sr-executor-v01.yml'
      - 'tools/hair_salon_pipeline/orchestrator.py'

permissions:
  contents: read

jobs:
  safe-sr-mechanics:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install pinned CPU stack and official Real-ESRGAN tag
        run: |
          mkdir -p work/input work/output work/reports
          sudo apt-get update -qq
          sudo apt-get install -y libgl1 libglib2.0-0 >/dev/null
          python -m pip install --upgrade pip -q
          pip install numpy==1.26.4 pillow==10.4.0 opencv-python-headless==4.10.0.84
          pip install torch==2.1.2 torchvision==0.16.2 --index-url https://download.pytorch.org/whl/cpu
          pip install basicsr==1.4.2 --no-deps
          pip install tqdm pyyaml scipy==1.11.4 scikit-image==0.22.0 lmdb requests==2.31.0 tb-nightly yapf future addict
          git clone --depth 1 --branch v0.3.0 https://github.com/xinntao/Real-ESRGAN.git /tmp/Real-ESRGAN
          cd /tmp/Real-ESRGAN
          test "$(git rev-parse HEAD)" = 'fa4c8a03ae3dbc9ea6ed471a6ab5da94ac15c2ea'
          pip install -e . --no-deps
          cp inputs/0014.jpg "$GITHUB_WORKSPACE/work/input/source.jpg"
      - name: Preflight and explicit execution permission
        run: |
          python tools/hair_salon_pipeline/preflight.py --source work/input/source.jpg --output work/reports/preflight.json --short-edge-target 1600
          python tools/hair_salon_pipeline/orchestrator.py --preflight work/reports/preflight.json --allow-safe-sr --output work/reports/orchestration_plan.json
          python - <<'PY'
          import json
          p=json.load(open('work/reports/orchestration_plan.json'))
          sr=next(x for x in p['plan'] if x['stage']=='SR')
          assert sr['action']=='AUTO_EXECUTE_CONSERVATIVE_SR',sr
          assert sr['auto_execute_eligible'] is True,sr
          PY
      - name: Execute pinned conservative SR into new output
        run: |
          cd /tmp/Real-ESRGAN
          python inference_realesrgan.py -n realesr-general-x4v3 -dn 0.20 -i "$GITHUB_WORKSPACE/work/input/source.jpg" -o "$GITHUB_WORKSPACE/work/output" -s 2 --tile 128 --tile_pad 16 --fp32 --suffix safe_sr_v01 --ext png
      - name: Verify geometry and record provenance
        run: |
          python - <<'PY'
          from pathlib import Path
          from PIL import Image
          import hashlib,json,cv2,numpy as np
          src=Path('work/input/source.jpg'); new=max(Path('work/output').glob('*.png'),key=lambda p:p.stat().st_size)
          a=np.asarray(Image.open(src).convert('RGB')); b=np.asarray(Image.open(new).convert('RGB'))
          h,w=a.shape[:2]; assert b.shape[:2]==(h*2,w*2),(a.shape,b.shape)
          down=cv2.resize(b,(w,h),interpolation=cv2.INTER_AREA)
          mae=float(np.mean(np.abs(down.astype(np.int16)-a.astype(np.int16))))
          mse=float(np.mean((down.astype(np.float32)-a.astype(np.float32))**2)); psnr=99.0 if mse==0 else float(20*np.log10(255/np.sqrt(mse)))
          def sha(p): return hashlib.sha256(Path(p).read_bytes()).hexdigest()
          weights={p.name:sha(p) for p in Path('/tmp/Real-ESRGAN/weights').glob('*.pth')}
          assert weights,'model weights were not materialized'
          report={'status':'PASS_SAFE_SR_EXECUTOR_MECHANICS','source_kind':'official Real-ESRGAN v0.3.0 test asset','source_repo_path':'inputs/0014.jpg','source_size':[w,h],'output_size':[w*2,h*2],'source_sha256':sha(src),'output_sha256':sha(new),'roundtrip_diagnostic':{'downsample_mae_8bit':mae,'downsample_psnr_db':psnr,'hard_gate':False},'executor':{'realesrgan_tag':'v0.3.0','realesrgan_commit':'fa4c8a03ae3dbc9ea6ed471a6ab5da94ac15c2ea','model':'realesr-general-x4v3','denoise_strength':0.20,'scale':2,'fp32':True,'tile':128,'tile_pad':16,'face_enhance':False},'weight_sha256':weights,'policy':{'new_output_only':True,'source_overwrite':False,'salon_fidelity_revalidated_here':False,'real_salon_fidelity_authority':'existing verified salon SR + Production Gate v03','pending_downstream_hair_qa_for_new_real_sources':True,'no_auto_promotion':True}}
          Path('work/reports/safe_sr_executor_report.json').write_text(json.dumps(report,indent=2))
          print(json.dumps(report,indent=2))
          PY
      - name: Upload executor evidence
        uses: actions/upload-artifact@v4
        with:
          name: hao-hair-salon-safe-sr-executor-v01
          path: |
            work/output/*.png
            work/reports/*.json
          retention-days: 14
