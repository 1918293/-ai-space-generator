name: Hao Hair Salon Safe SR Executor v01

on:
  workflow_dispatch:
  push:
    branches: [hao-hair-sr-test-20260817]
    paths:
      - '.github/workflows/hair-salon-safe-sr-executor-v01.yml'
      - 'tools/hair_salon_pipeline/orchestrator.py'
      - 'tools/hair_salon_pipeline/safe_sr.py'

permissions:
  contents: read

jobs:
  safe-sr-mechanics:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install pinned CPU stack and official Real-ESRGAN tag
        run: |
          mkdir -p work/input work/output work/reports
          sudo apt-get update -qq
          sudo apt-get install -y libgl1 libglib2.0-0 >/dev/null
          python -m pip install --upgrade pip -q
          pip install numpy==1.26.4 pillow==10.4.0 opencv-python-headless==4.10.0.84
          pip install torch==2.1.2 torchvision==0.16.2 --index-url https://download.pytorch.org/whl/cpu
          pip install basicsr==1.4.2 --no-deps
          pip install tqdm pyyaml scipy==1.11.4 scikit-image==0.22.0 lmdb requests==2.31.0 tb-nightly yapf future addict
          git clone --depth 1 --branch v0.3.0 https://github.com/xinntao/Real-ESRGAN.git /tmp/Real-ESRGAN
          cd /tmp/Real-ESRGAN
          test "$(git rev-parse HEAD)" = 'fa4c8a03ae3dbc9ea6ed471a6ab5da94ac15c2ea'
          pip install -e . --no-deps
          cp inputs/0014.jpg "$GITHUB_WORKSPACE/work/input/source.jpg"
      - name: Preflight and orchestration permission contract
        run: |
          python tools/hair_salon_pipeline/preflight.py --source work/input/source.jpg --output work/reports/preflight.json --short-edge-target 1600
          python tools/hair_salon_pipeline/orchestrator.py --preflight work/reports/preflight.json --allow-safe-sr --output work/reports/orchestration_plan.json
          python - <<'PY'
          import json
          p=json.load(open('work/reports/orchestration_plan.json')); sr=next(x for x in p['plan'] if x['stage']=='SR')
          assert sr['action']=='AUTO_EXECUTE_CONSERVATIVE_SR' and sr['auto_execute_eligible'] is True,sr
          q=json.load(open('work/reports/preflight.json')); q['decisions']['sr']='SKIP'; open('work/reports/preflight_skip.json','w').write(json.dumps(q,indent=2))
          PY
      - name: Fail-closed refusal tests
        run: |
          if python tools/hair_salon_pipeline/safe_sr.py --source work/input/source.jpg --preflight work/reports/preflight.json --output-dir work/refuse_no_permission --realesrgan-root /tmp/Real-ESRGAN --report work/reports/should_not_exist1.json; then exit 1; fi
          if python tools/hair_salon_pipeline/safe_sr.py --source work/input/source.jpg --preflight work/reports/preflight_skip.json --output-dir work/refuse_skip --realesrgan-root /tmp/Real-ESRGAN --report work/reports/should_not_exist2.json --allow-safe-sr; then exit 1; fi
          test ! -e work/reports/should_not_exist1.json
          test ! -e work/reports/should_not_exist2.json
      - name: Execute reusable pinned conservative SR
        run: |
          python tools/hair_salon_pipeline/safe_sr.py --source work/input/source.jpg --preflight work/reports/preflight.json --output-dir work/output --realesrgan-root /tmp/Real-ESRGAN --report work/reports/safe_sr_execution.json --allow-safe-sr
      - name: Record mechanics diagnostics
        run: |
          python - <<'PY'
          from pathlib import Path
          from PIL import Image
          import json,cv2,numpy as np
          r=json.load(open('work/reports/safe_sr_execution.json')); a=np.asarray(Image.open(r['source']).convert('RGB')); b=np.asarray(Image.open(r['output']).convert('RGB')); h,w=a.shape[:2]
          down=cv2.resize(b,(w,h),interpolation=cv2.INTER_AREA); mae=float(np.mean(np.abs(down.astype(np.int16)-a.astype(np.int16)))); mse=float(np.mean((down.astype(np.float32)-a.astype(np.float32))**2)); psnr=99.0 if mse==0 else float(20*np.log10(255/np.sqrt(mse)))
          r['status']='PASS_SAFE_SR_EXECUTOR_MECHANICS'; r['source_kind']='official Real-ESRGAN v0.3.0 test asset'; r['source_repo_path']='inputs/0014.jpg'; r['roundtrip_diagnostic']={'downsample_mae_8bit':mae,'downsample_psnr_db':psnr,'hard_gate':False}; r['policy']['salon_fidelity_revalidated_here']=False; r['policy']['real_salon_fidelity_authority']='existing verified salon SR + Production Gate v03'; r['policy']['no_auto_promotion']=True
          Path('work/reports/safe_sr_executor_report.json').write_text(json.dumps(r,indent=2)); print(json.dumps(r,indent=2))
          PY
      - name: Upload executor evidence
        uses: actions/upload-artifact@v4
        with:
          name: hao-hair-salon-safe-sr-executor-v01
          path: |
            work/output/*.png
            work/reports/*.json
          retention-days: 14
