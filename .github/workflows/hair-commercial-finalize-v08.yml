name: Hao Hair Commercial Fast Finalizer v09

on:
  push:
    branches:
      - hao-hair-sr-test-20260817
    paths:
      - '.github/workflows/hair-commercial-finalize-v08.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Download verified baseline SR
        uses: actions/download-artifact@v4
        with:
          name: hao-hair-realesr-general-x2-dn020
          path: work/baseline
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: 32003834720

      - name: Download LeftRefill v06 primary candidate
        uses: actions/download-artifact@v4
        with:
          name: hao-hair-leftrefill-probe-v06
          path: work/leftrefill
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: 32021100743

      - name: Download verified MODNet matte
        uses: actions/download-artifact@v4
        with:
          name: hao-hair-commercial-modnet-hairsafe-bokeh-v02
          path: work/modnet
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: 32009172839

      - name: Install minimal deterministic image stack
        run: |
          python -m pip install --disable-pip-version-check --quiet pillow==10.4.0 numpy==1.26.4 opencv-python-headless==4.10.0.84

      - name: Finalize, package, and regression-QA in one pass
        run: |
          python - <<'PY'
          from pathlib import Path
          from PIL import Image
          import numpy as np
          import cv2, json, hashlib

          ROOT=Path('work'); OUT=ROOT/'final'; OUT.mkdir(parents=True,exist_ok=True)
          def sha256(p): return hashlib.sha256(Path(p).read_bytes()).hexdigest()
          def load_rgb(p): return np.asarray(Image.open(p).convert('RGB'))
          def fullres(root):
              hits=[]
              for p in Path(root).rglob('*.png'):
                  try:
                      if Image.open(p).size==(2360,4192) and all(k not in p.name.lower() for k in ['mask','matte','protect']): hits.append(p)
                  except Exception: pass
              assert hits,root
              return max(hits,key=lambda p:p.stat().st_size)
          def boxmask(shape,xyxy):
              m=np.zeros(shape,dtype=bool); x0,y0,x1,y1=xyxy; m[y0:y1,x0:x1]=True; return m

          baseline_p=fullres(ROOT/'baseline')
          crop_p=next((ROOT/'leftrefill').rglob('source_safe_leftrefill_256.png'))
          target_p=next((ROOT/'leftrefill').rglob('leftrefill_inputs/target.png'))
          mask_p=next((ROOT/'leftrefill').rglob('leftrefill_inputs/model_mask.png'))
          protect_p=next((ROOT/'leftrefill').rglob('leftrefill_inputs/person_protect_modnet.png'))
          matte_p=next((ROOT/'modnet').rglob('modnet_matte_768_v02.png'))

          baseline=load_rgb(baseline_p); candidate=load_rgb(crop_p); target=load_rgb(target_p)
          local_mask=np.asarray(Image.open(mask_p).convert('L'))>0
          local_protect=np.asarray(Image.open(protect_p).convert('L'))>0
          matte=np.asarray(Image.open(matte_p).convert('L')).astype(np.float32)/255.0
          assert baseline.shape==(4192,2360,3) and candidate.shape==target.shape==(2048,2048,3)
          assert matte.shape==(4192,2360) and not np.any(local_mask&local_protect)

          tx0,ty0,tx1,ty1=(312,2144,2360,4192)
          assert np.array_equal(target,baseline[ty0:ty1,tx0:tx1])

          # v06 source-safe composite with inward-only feather.
          m8=(local_mask.astype(np.uint8)*255)
          dist=cv2.distanceTransform(m8,cv2.DIST_L2,5)
          alpha=np.zeros_like(dist,dtype=np.float32)
          alpha[local_mask]=np.clip(0.70+0.30*np.minimum(dist[local_mask]/8.0,1.0),0,1)
          hsv_t=cv2.cvtColor(target,cv2.COLOR_RGB2HSV)
          red_t=(((hsv_t[:,:,0]<12)|(hsv_t[:,:,0]>170))&(hsv_t[:,:,1]>100)&(hsv_t[:,:,2]>65)&local_mask)
          dark_t=((hsv_t[:,:,2]<42)&local_mask)
          alpha[red_t|dark_t]=1.0
          a=alpha[...,None]
          refined=np.clip(target.astype(np.float32)*(1-a)+candidate.astype(np.float32)*a+0.5,0,255).astype(np.uint8)
          refined[~local_mask]=target[~local_mask]
          clean=baseline.copy(); clean[ty0:ty1,tx0:tx1]=refined

          global_mask=np.zeros((4192,2360),dtype=bool); global_mask[ty0:ty1,tx0:tx1]=local_mask
          global_protect=np.zeros((4192,2360),dtype=bool); global_protect[ty0:ty1,tx0:tx1]=local_protect

          # Visual-readback correction: v08 revealed three tiny umbrella red/black remnants just outside the v06 mask.
          # Reuse only neighboring pixels from this same source image; no model inference and no subject-core edits.
          cleanup_base=clean.copy(); H,W=matte.shape
          hsv=cv2.cvtColor(cleanup_base,cv2.COLOR_RGB2HSV)
          red=((hsv[:,:,0]<12)|(hsv[:,:,0]>170))&(hsv[:,:,1]>110)&(hsv[:,:,2]>80)
          upper_box=boxmask((H,W),(2015,3150,2115,3300))
          lower_box=boxmask((H,W),(1780,3280,2000,3470))

          def dilate_seed(seed,k):
              return cv2.dilate((seed.astype(np.uint8)*255),cv2.getStructuringElement(cv2.MORPH_ELLIPSE,(k,k)))>0
          upper_seed=red&upper_box&(matte<0.65)
          lower_seed=red&lower_box&(matte<0.65)
          upper_mask=dilate_seed(upper_seed,25)&upper_box&(matte<0.65)
          lower_mask=dilate_seed(lower_seed,35)&lower_box&(matte<0.65)

          def shift_blend(out,mask,dx,dy,source,red_authority):
              ys,xs=np.where(mask)
              sx=np.clip(xs+dx,0,W-1); sy=np.clip(ys+dy,0,H-1)
              donor=source[sy,sx].astype(np.float32)
              dt=cv2.distanceTransform((mask.astype(np.uint8)*255),cv2.DIST_L2,5)
              aa=0.60+0.40*np.clip(dt[ys,xs]/8.0,0,1)
              aa[red_authority[ys,xs]]=1.0
              cur=out[ys,xs].astype(np.float32)
              out[ys,xs]=np.clip(cur*(1-aa[:,None])+donor*aa[:,None]+0.5,0,255).astype(np.uint8)
              return out

          clean=shift_blend(clean,upper_mask,-30,0,cleanup_base,red)
          clean=shift_blend(clean,lower_mask,0,50,cleanup_base,red)

          # Second tiny residual pass, driven by what remains after the first correction.
          hsv2=cv2.cvtColor(clean,cv2.COLOR_RGB2HSV)
          red2=((hsv2[:,:,0]<12)|(hsv2[:,:,0]>170))&(hsv2[:,:,1]>110)&(hsv2[:,:,2]>80)
          residual_box=boxmask((H,W),(1780,3120,2115,3470))
          residual=red2&residual_box&(matte<0.65)
          upper_res=residual&boxmask((H,W),(2000,3120,2115,3300))
          lower_res=residual&boxmask((H,W),(1780,3280,2000,3470))

          def exact_shift(out,seed,dx,dy):
              m=dilate_seed(seed,11)&(matte<0.65)
              ys,xs=np.where(m); sx=np.clip(xs+dx,0,W-1); sy=np.clip(ys+dy,0,H-1)
              out[ys,xs]=cleanup_base[sy,sx]
              return out,m
          clean,upper2=exact_shift(clean,upper_res,-50,0)
          clean,lower2=exact_shift(clean,lower_res,0,80)
          clean[matte>=0.65]=baseline[matte>=0.65]

          combined_edit=global_mask|upper_mask|lower_mask|upper2|lower2
          clean_p=OUT/'Hao_Hair_UmbrellaClean_LeftRefill_v09.png'; Image.fromarray(clean,'RGB').save(clean_p)

          # Hair-safe bokeh from already-verified matte; no MODNet rerun.
          t=np.clip((0.65-matte)/(0.65-0.05),0,1); bg_mix=(t*t*(3-2*t))[...,None].astype(np.float32)
          core=matte>=0.65
          blurred=cv2.GaussianBlur(clean,(0,0),sigmaX=12.0,sigmaY=12.0,borderType=cv2.BORDER_REFLECT101).astype(np.float32)
          bokeh=np.clip(clean.astype(np.float32)*(1-bg_mix)+blurred*bg_mix+0.5,0,255).astype(np.uint8); bokeh[core]=clean[core]
          bokeh_p=OUT/'Hao_Hair_Commercial_HairSafe_Bokeh_Final_v09.png'; Image.fromarray(bokeh,'RGB').save(bokeh_p)

          # One selected studio-tone pass.
          arr=bokeh.astype(np.float32)/255.0
          def s2l(x): return np.where(x<=0.04045,x/12.92,((x+0.055)/1.055)**2.4)
          def l2s(x):
              x=np.clip(x,0,1); return np.where(x<=0.0031308,12.92*x,1.055*np.power(x,1/2.4)-0.055)
          def smooth(e0,e1,x):
              z=np.clip((x-e0)/(e1-e0),0,1); return z*z*(3-2*z)
          yy,xx=np.indices((H,W),dtype=np.float32); xn=xx/(W-1); yn=yy/(H-1)
          subject=smooth(0.20,0.80,matte); background=1-subject
          key=np.exp(-0.5*(((xn-0.50)/0.30)**2+((yn-0.39)/0.24)**2))*subject
          rr=((xn-0.50)/0.72)**2+((yn-0.43)/0.78)**2; vignette=np.clip(rr-0.55,0,1)*background
          stops=(-0.10*background)+(0.08*key)+(-0.03*vignette)
          tone=np.clip(l2s(np.clip(s2l(arr)*np.exp2(stops)[...,None],0,1))*255.0+0.5,0,255).astype(np.uint8)
          primary_p=OUT/'Hao_Hair_Commercial_PrimaryCandidate_v09.png'; Image.fromarray(tone,'RGB').save(primary_p)

          crop_box=(280,560,2080,2810)
          portfolio=Image.fromarray(tone,'RGB').crop(crop_box)
          portfolio_p=OUT/'Hao_Hair_Commercial_Portfolio4x5_v09.png'; portfolio.save(portfolio_p)
          assert portfolio.size==(1800,2250) and np.array_equal(np.asarray(portfolio),tone[560:2810,280:2080])

          # Regression gates now include the previously missed residual area.
          outside_ok=bool(np.array_equal(clean[~combined_edit],baseline[~combined_edit]))
          subject_ok=bool(np.array_equal(clean[core],baseline[core]))
          bokeh_core_ok=bool(np.array_equal(bokeh[core],clean[core]))
          hsv_clean=cv2.cvtColor(clean,cv2.COLOR_RGB2HSV)
          red_clean=((hsv_clean[:,:,0]<12)|(hsv_clean[:,:,0]>170))&(hsv_clean[:,:,1]>110)&(hsv_clean[:,:,2]>80)
          residual_red=int(np.count_nonzero(red_clean&residual_box&(matte<0.65)))
          edited_red=int(np.count_nonzero(red_clean&combined_edit&(matte<0.65)))

          rx0,ry0,rx1,ry1=(350,800,1900,2600); rb=bokeh[ry0:ry1,rx0:rx1]; rt=tone[ry0:ry1,rx0:rx1]; rm=matte[ry0:ry1,rx0:rx1]
          evalm=rm>=0.20; core_roi=rm>=0.65
          def grad(a):
              g=cv2.cvtColor(a,cv2.COLOR_RGB2GRAY).astype(np.float32); gx=cv2.Sobel(g,cv2.CV_32F,1,0,3); gy=cv2.Sobel(g,cv2.CV_32F,0,1,3); return np.sqrt(gx*gx+gy*gy)
          g0=grad(rb)[evalm]; g1=grad(rt)[evalm]; gc=1.0 if g0.size<100 else float(np.corrcoef(g0,g1)[0,1])
          hb=cv2.cvtColor(rb,cv2.COLOR_RGB2HSV).astype(np.float32); ht=cv2.cvtColor(rt,cv2.COLOR_RGB2HSV).astype(np.float32)
          chroma=core_roi&(hb[:,:,1]>=35)&(hb[:,:,2]>=25)
          if np.any(chroma):
              hd=np.abs(ht[:,:,0]-hb[:,:,0]); hd=np.minimum(hd,180-hd)*2.0
              hue_med=float(np.median(hd[chroma])); hue_p95=float(np.percentile(hd[chroma],95)); sat_med=float(np.median(np.abs(ht[:,:,1]-hb[:,:,1])[chroma]))
          else: hue_med=hue_p95=sat_med=0.0
          tone_ok=bool(gc>0.995 and hue_med<=2 and hue_p95<=6 and sat_med<=4)
          hard_pass=bool(outside_ok and subject_ok and bokeh_core_ok and residual_red==0 and edited_red==0 and tone_ok)

          # QA: original vs clean vs final, plus full/4:5.
          roi=(1750,2950,2250,3500)
          ims=[Image.fromarray(x,'RGB').crop(roi) for x in [baseline,clean,tone]]
          sheet=Image.new('RGB',(500*3,550),(255,255,255)); [sheet.paste(im,(i*500,0)) for i,im in enumerate(ims)]; sheet.save(OUT/'QA_Residual_Original_Clean_Final_v09.jpg',quality=95)
          p1=Image.fromarray(tone,'RGB'); p1.thumbnail((700,1240)); p2=portfolio.copy(); p2.thumbnail((700,1240))
          fs=Image.new('RGB',(p1.width+p2.width,max(p1.height,p2.height)),(255,255,255)); fs.paste(p1,(0,0)); fs.paste(p2,(p1.width,0)); fs.save(OUT/'QA_Final_Full_4x5_v09.jpg',quality=95)

          report={
            'status':'TECHNICAL_PASS_PRIMARY_CANDIDATE' if hard_pass else 'TECHNICAL_FAIL',
            'efficiency':{'generative_inference_rerun':False,'modnet_inference_rerun':False,'heavy_model_download':False,'finalization_workflows':1},
            'authority':{'baseline_run':32003834720,'leftrefill_v06_run':32021100743,'modnet_matte_run':32009172839},
            'hard_gates':{'outside_combined_edit_bit_identical':outside_ok,'subject_core_bit_identical_to_baseline':subject_ok,'bokeh_core_bit_identical_to_clean':bokeh_core_ok,'entire_residual_background_red_zero':residual_red==0,'combined_edit_background_red_zero':edited_red==0,'studio_tone_fidelity':tone_ok},
            'metrics':{'residual_background_red_pixels':residual_red,'edited_background_red_pixels':edited_red,'tone_subject_gradient_correlation':gc,'median_hue_shift_degrees':hue_med,'p95_hue_shift_degrees':hue_p95,'median_saturation_shift_8bit':sat_med,'highlight_clip_fraction':float(np.mean(np.any(tone>=255,axis=2))),'black_clip_fraction':float(np.mean(np.all(tone<=0,axis=2)))},
            'outputs':{'clean':{'name':clean_p.name,'sha256':sha256(clean_p)},'bokeh':{'name':bokeh_p.name,'sha256':sha256(bokeh_p)},'primary':{'name':primary_p.name,'sha256':sha256(primary_p),'size':[2360,4192]},'portfolio_4x5':{'name':portfolio_p.name,'sha256':sha256(portfolio_p),'size':[1800,2250]}},
            'promotion':'PRIMARY_CANDIDATE_TECHNICALLY_VERIFIED_NOT_USER_ACCEPTED' if hard_pass else 'NOT_PROMOTED'
          }
          (OUT/'verification_final_v09.json').write_text(json.dumps(report,indent=2),encoding='utf-8'); print(json.dumps(report,indent=2))
          if not hard_pass: raise SystemExit('Hard regression gate failed')
          PY

      - name: Upload final package
        uses: actions/upload-artifact@v4
        with:
          name: hao-hair-commercial-final-v09
          path: work/final/*
          if-no-files-found: error
          retention-days: 7
