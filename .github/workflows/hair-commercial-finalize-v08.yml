name: Hao Hair Commercial Fast Finalizer v08

on:
  push:
    branches:
      - hao-hair-sr-test-20260817
    paths:
      - '.github/workflows/hair-commercial-finalize-v08.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Download verified baseline SR
        uses: actions/download-artifact@v4
        with:
          name: hao-hair-realesr-general-x2-dn020
          path: work/baseline
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: 32003834720

      - name: Download LeftRefill v06 primary candidate
        uses: actions/download-artifact@v4
        with:
          name: hao-hair-leftrefill-probe-v06
          path: work/leftrefill
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: 32021100743

      - name: Download verified MODNet matte
        uses: actions/download-artifact@v4
        with:
          name: hao-hair-commercial-modnet-hairsafe-bokeh-v02
          path: work/modnet
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: 32009172839

      - name: Install minimal deterministic image stack
        run: |
          python -m pip install --disable-pip-version-check --quiet pillow==10.4.0 numpy==1.26.4 opencv-python-headless==4.10.0.84

      - name: Finalize, package, and regression-QA in one pass
        run: |
          python - <<'PY'
          from pathlib import Path
          from PIL import Image
          import numpy as np
          import cv2, json, hashlib, shutil

          ROOT=Path('work'); OUT=ROOT/'final'; OUT.mkdir(parents=True,exist_ok=True)

          def sha256(p): return hashlib.sha256(Path(p).read_bytes()).hexdigest()
          def load_rgb(p): return np.asarray(Image.open(p).convert('RGB'))
          def fullres(root):
              hits=[]
              for p in Path(root).rglob('*.png'):
                  try:
                      if Image.open(p).size==(2360,4192) and all(k not in p.name.lower() for k in ['mask','matte','protect']): hits.append(p)
                  except Exception: pass
              assert hits,root
              return max(hits,key=lambda p:p.stat().st_size)

          baseline_p=fullres(ROOT/'baseline')
          crop_p=next((ROOT/'leftrefill').rglob('source_safe_leftrefill_256.png'))
          target_p=next((ROOT/'leftrefill').rglob('leftrefill_inputs/target.png'))
          mask_p=next((ROOT/'leftrefill').rglob('leftrefill_inputs/model_mask.png'))
          protect_p=next((ROOT/'leftrefill').rglob('leftrefill_inputs/person_protect_modnet.png'))
          matte_p=next((ROOT/'modnet').rglob('modnet_matte_768_v02.png'))

          baseline=load_rgb(baseline_p); assert baseline.shape==(4192,2360,3)
          candidate=load_rgb(crop_p); target=load_rgb(target_p)
          local_mask=np.asarray(Image.open(mask_p).convert('L'))>0
          local_protect=np.asarray(Image.open(protect_p).convert('L'))>0
          matte=np.asarray(Image.open(matte_p).convert('L')).astype(np.float32)/255.0
          assert candidate.shape==target.shape==(2048,2048,3)
          assert local_mask.shape==local_protect.shape==(2048,2048)
          assert matte.shape==(4192,2360)
          assert not np.any(local_mask & local_protect)

          # Authority check: v06 target must be the exact corresponding baseline crop.
          x0,y0,x1,y1=(312,2144,2360,4192)
          assert np.array_equal(target,baseline[y0:y1,x0:x1]),'v06 target no longer matches verified baseline'

          # Inward-only seam refinement. No pixel outside the already-verified v06 mask can change.
          # Keep umbrella-colored source pixels fully replaced so feathering cannot reintroduce red/black umbrella edges.
          m8=(local_mask.astype(np.uint8)*255)
          dist=cv2.distanceTransform(m8,cv2.DIST_L2,5)
          alpha=np.zeros_like(dist,dtype=np.float32)
          alpha[local_mask]=np.clip(0.70 + 0.30*np.minimum(dist[local_mask]/8.0,1.0),0,1)
          hsv_t=cv2.cvtColor(target,cv2.COLOR_RGB2HSV)
          umbrella_red=(((hsv_t[:,:,0]<12)|(hsv_t[:,:,0]>170))&(hsv_t[:,:,1]>100)&(hsv_t[:,:,2]>65)&local_mask)
          very_dark=((hsv_t[:,:,2]<42)&local_mask)
          alpha[umbrella_red|very_dark]=1.0

          refined=target.copy().astype(np.float32)
          a=alpha[...,None]
          refined=target.astype(np.float32)*(1-a)+candidate.astype(np.float32)*a
          refined=np.clip(refined+0.5,0,255).astype(np.uint8)
          refined[~local_mask]=target[~local_mask]

          clean=baseline.copy(); clean[y0:y1,x0:x1]=refined
          global_mask=np.zeros((4192,2360),dtype=bool); global_mask[y0:y1,x0:x1]=local_mask
          global_protect=np.zeros((4192,2360),dtype=bool); global_protect[y0:y1,x0:x1]=local_protect

          clean_p=OUT/'Hao_Hair_UmbrellaClean_LeftRefill_v06f.png'
          Image.fromarray(clean,'RGB').save(clean_p)

          # Hair-safe background bokeh, reusing the already-verified MODNet matte; no model inference.
          protect_threshold=0.65; background_threshold=0.05
          t=np.clip((protect_threshold-matte)/(protect_threshold-background_threshold),0,1)
          bg_mix=(t*t*(3-2*t))[...,None].astype(np.float32)
          core=matte>=protect_threshold
          blurred=cv2.GaussianBlur(clean,(0,0),sigmaX=12.0,sigmaY=12.0,borderType=cv2.BORDER_REFLECT101).astype(np.float32)
          bokeh=np.clip(clean.astype(np.float32)*(1-bg_mix)+blurred*bg_mix+0.5,0,255).astype(np.uint8)
          bokeh[core]=clean[core]
          bokeh_p=OUT/'Hao_Hair_Commercial_HairSafe_Bokeh_Final_v08.png'
          Image.fromarray(bokeh,'RGB').save(bokeh_p)

          # Single selected studio-tone pass in linear light; replaces the previous 3-variant workflow.
          arr=bokeh.astype(np.float32)/255.0
          def srgb_to_linear(x): return np.where(x<=0.04045,x/12.92,((x+0.055)/1.055)**2.4)
          def linear_to_srgb(x):
              x=np.clip(x,0,1); return np.where(x<=0.0031308,12.92*x,1.055*np.power(x,1/2.4)-0.055)
          def smoothstep(e0,e1,x):
              z=np.clip((x-e0)/(e1-e0),0,1); return z*z*(3-2*z)
          H,W=matte.shape; yy,xx=np.indices((H,W),dtype=np.float32); xn=xx/(W-1); yn=yy/(H-1)
          subject=smoothstep(0.20,0.80,matte); background=1-subject
          key=np.exp(-0.5*(((xn-0.50)/0.30)**2+((yn-0.39)/0.24)**2))*subject
          rr=((xn-0.50)/0.72)**2+((yn-0.43)/0.78)**2
          vignette=np.clip(rr-0.55,0,1)*background
          stops=(-0.10*background)+(0.08*key)+(-0.03*vignette)
          tone=np.clip(linear_to_srgb(np.clip(srgb_to_linear(arr)*np.exp2(stops)[...,None],0,1))*255.0+0.5,0,255).astype(np.uint8)
          tone_p=OUT/'Hao_Hair_Commercial_PrimaryCandidate_v08.png'
          Image.fromarray(tone,'RGB').save(tone_p)

          # Native-pixel 4:5 derivative; no interpolation.
          crop_box=(280,560,2080,2810)
          portfolio=Image.fromarray(tone,'RGB').crop(crop_box)
          portfolio_p=OUT/'Hao_Hair_Commercial_Portfolio4x5_v08.png'; portfolio.save(portfolio_p)
          assert portfolio.size==(1800,2250)
          assert np.array_equal(np.asarray(portfolio),tone[crop_box[1]:crop_box[3],crop_box[0]:crop_box[2]])

          # Hard QA gates.
          outside_unchanged=bool(np.array_equal(clean[~global_mask],baseline[~global_mask]))
          protected_unchanged=bool(np.array_equal(clean[global_protect],baseline[global_protect]))
          core_clean_unchanged=bool(np.array_equal(clean[core],baseline[core]))
          bokeh_core_exact=bool(np.array_equal(bokeh[core],clean[core]))

          hsv0=cv2.cvtColor(baseline,cv2.COLOR_RGB2HSV); hsv1=cv2.cvtColor(clean,cv2.COLOR_RGB2HSV)
          red0=(((hsv0[:,:,0]<12)|(hsv0[:,:,0]>170))&(hsv0[:,:,1]>110)&(hsv0[:,:,2]>80)&global_mask)
          red1=(((hsv1[:,:,0]<12)|(hsv1[:,:,0]>170))&(hsv1[:,:,1]>110)&(hsv1[:,:,2]>80)&global_mask)
          red_before=int(red0.sum()); red_after=int(red1.sum()); red_ratio=float(1-red_after/max(1,red_before))

          # Tone structure and hue fidelity on subject ROI.
          rx0,ry0,rx1,ry1=(350,800,1900,2600)
          rb=bokeh[ry0:ry1,rx0:rx1]; rt=tone[ry0:ry1,rx0:rx1]; rm=matte[ry0:ry1,rx0:rx1]
          evalmask=rm>=0.20; core_roi=rm>=0.65
          def grad(a):
              g=cv2.cvtColor(a,cv2.COLOR_RGB2GRAY).astype(np.float32)
              gx=cv2.Sobel(g,cv2.CV_32F,1,0,ksize=3); gy=cv2.Sobel(g,cv2.CV_32F,0,1,ksize=3)
              return np.sqrt(gx*gx+gy*gy)
          g0=grad(rb)[evalmask]; g1=grad(rt)[evalmask]
          grad_corr=1.0 if g0.size<100 else float(np.corrcoef(g0,g1)[0,1])
          hb=cv2.cvtColor(rb,cv2.COLOR_RGB2HSV).astype(np.float32); ht=cv2.cvtColor(rt,cv2.COLOR_RGB2HSV).astype(np.float32)
          chroma=core_roi&(hb[:,:,1]>=35)&(hb[:,:,2]>=25)
          if np.any(chroma):
              hd=np.abs(ht[:,:,0]-hb[:,:,0]); hd=np.minimum(hd,180-hd)*2.0
              hue_med=float(np.median(hd[chroma])); hue_p95=float(np.percentile(hd[chroma],95)); sat_med=float(np.median(np.abs(ht[:,:,1]-hb[:,:,1])[chroma]))
          else: hue_med=hue_p95=sat_med=0.0
          tone_pass=bool(grad_corr>0.995 and hue_med<=2.0 and hue_p95<=6.0 and sat_med<=4.0)

          hard_pass=bool(outside_unchanged and protected_unchanged and core_clean_unchanged and bokeh_core_exact and red_after==0 and tone_pass)

          # Visual QA sheets.
          roi_box=(1200,2300,2360,4192)
          before=Image.fromarray(baseline,'RGB').crop(roi_box); after=Image.fromarray(clean,'RGB').crop(roi_box)
          before.thumbnail((650,1050)); after.thumbnail((650,1050))
          sheet=Image.new('RGB',(before.width+after.width,max(before.height,after.height)),(255,255,255)); sheet.paste(before,(0,0)); sheet.paste(after,(before.width,0)); sheet.save(OUT/'QA_Umbrella_BeforeAfter_v08.jpg',quality=94)
          p1=Image.fromarray(tone,'RGB'); p1.thumbnail((700,1240)); p2=portfolio.copy(); p2.thumbnail((700,1240))
          finals=Image.new('RGB',(p1.width+p2.width,max(p1.height,p2.height)),(255,255,255)); finals.paste(p1,(0,0)); finals.paste(p2,(p1.width,0)); finals.save(OUT/'QA_Final_Full_4x5_v08.jpg',quality=94)

          report={
            'status':'TECHNICAL_PASS_PRIMARY_CANDIDATE' if hard_pass else 'TECHNICAL_FAIL',
            'method':'reuse LeftRefill v06 + inward-only deterministic seam blend + verified MODNet matte + one-pass studio tone + package + regression',
            'efficiency':{'generative_inference_rerun':False,'modnet_inference_rerun':False,'workflow_count_for_finalization':1,'heavy_model_download':False},
            'authority':{'baseline_run':32003834720,'leftrefill_v06_run':32021100743,'modnet_matte_run':32009172839,'target_box':[x0,y0,x1,y1]},
            'hard_gates':{
              'outside_edit_mask_bit_identical':outside_unchanged,
              'protected_person_bit_identical':protected_unchanged,
              'modnet_core_clean_plate_bit_identical_to_baseline':core_clean_unchanged,
              'modnet_core_bokeh_bit_identical_to_clean_plate':bokeh_core_exact,
              'umbrella_red_after_zero':red_after==0,
              'studio_tone_fidelity':tone_pass
            },
            'metrics':{'red_before':red_before,'red_after':red_after,'red_removal_ratio':red_ratio,'tone_subject_gradient_correlation':grad_corr,'median_hue_shift_degrees':hue_med,'p95_hue_shift_degrees':hue_p95,'median_saturation_shift_8bit':sat_med,'highlight_clip_fraction':float(np.mean(np.any(tone>=255,axis=2))),'black_clip_fraction':float(np.mean(np.all(tone<=0,axis=2)))},
            'outputs':{
              'umbrella_clean':{'name':clean_p.name,'sha256':sha256(clean_p),'size':[2360,4192]},
              'bokeh':{'name':bokeh_p.name,'sha256':sha256(bokeh_p),'size':[2360,4192]},
              'primary':{'name':tone_p.name,'sha256':sha256(tone_p),'size':[2360,4192]},
              'portfolio_4x5':{'name':portfolio_p.name,'sha256':sha256(portfolio_p),'size':[1800,2250]}
            },
            'promotion':'PRIMARY_CANDIDATE_TECHNICALLY_VERIFIED_NOT_USER_ACCEPTED' if hard_pass else 'NOT_PROMOTED'
          }
          (OUT/'verification_final_v08.json').write_text(json.dumps(report,indent=2),encoding='utf-8')
          print(json.dumps(report,indent=2))
          if not hard_pass: raise SystemExit('Hard regression gate failed')
          PY

      - name: Upload final package
        uses: actions/upload-artifact@v4
        with:
          name: hao-hair-commercial-final-v08
          path: work/final/*
          if-no-files-found: error
          retention-days: 7
