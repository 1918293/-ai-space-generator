name: Hao Hair Commercial Tone Refinement v10

on:
  push:
    branches:
      - hao-hair-sr-test-20260817
    paths:
      - '.github/workflows/hair-commercial-tone-v10.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  tone-refine:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Download verified v09 final package
        uses: actions/download-artifact@v4
        with:
          name: hao-hair-commercial-final-v09
          path: work/v09
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: 32031627343

      - name: Download verified MODNet matte
        uses: actions/download-artifact@v4
        with:
          name: hao-hair-commercial-modnet-hairsafe-bokeh-v02
          path: work/modnet
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: 32009172839

      - name: Install minimal image stack
        run: |
          python -m pip install --disable-pip-version-check --quiet pillow==10.4.0 numpy==1.26.4 opencv-python-headless==4.10.0.84

      - name: Build lower-clipping studio tone and QA
        run: |
          python - <<'PY'
          from pathlib import Path
          from PIL import Image
          import numpy as np, cv2, json, hashlib, shutil

          ROOT=Path('work'); OUT=ROOT/'final'; OUT.mkdir(parents=True,exist_ok=True)
          def exact(root,name):
              hits=list(Path(root).rglob(name)); assert len(hits)==1,(name,hits); return hits[0]
          def sha(p): return hashlib.sha256(Path(p).read_bytes()).hexdigest()

          bokeh_p=exact(ROOT/'v09','Hao_Hair_Commercial_HairSafe_Bokeh_Final_v09.png')
          old_p=exact(ROOT/'v09','Hao_Hair_Commercial_PrimaryCandidate_v09.png')
          clean_p=exact(ROOT/'v09','Hao_Hair_UmbrellaClean_LeftRefill_v09.png')
          matte_p=exact(ROOT/'modnet','modnet_matte_768_v02.png')

          bokeh=np.asarray(Image.open(bokeh_p).convert('RGB')); old=np.asarray(Image.open(old_p).convert('RGB'))
          matte=np.asarray(Image.open(matte_p).convert('L')).astype(np.float32)/255.0
          assert bokeh.shape==old.shape==(4192,2360,3) and matte.shape==(4192,2360)

          arr=bokeh.astype(np.float32)/255.0
          def s2l(x): return np.where(x<=0.04045,x/12.92,((x+0.055)/1.055)**2.4)
          def l2s(x):
              x=np.clip(x,0,1); return np.where(x<=0.0031308,12.92*x,1.055*np.power(x,1/2.4)-0.055)
          def smooth(e0,e1,x):
              z=np.clip((x-e0)/(e1-e0),0,1); return z*z*(3-2*z)

          H,W=matte.shape; yy,xx=np.indices((H,W),dtype=np.float32); xn=xx/(W-1); yn=yy/(H-1)
          subject=smooth(0.20,0.80,matte); background=1-subject
          key=np.exp(-0.5*(((xn-0.50)/0.30)**2+((yn-0.39)/0.24)**2))*subject
          rr=((xn-0.50)/0.72)**2+((yn-0.43)/0.78)**2; vignette=np.clip(rr-0.55,0,1)*background

          # v09 used +0.08 stop key. v10 reduces only that key to +0.05 stop.
          # Background exposure and vignette remain unchanged.
          stops=(-0.10*background)+(0.05*key)+(-0.03*vignette)
          tone=np.clip(l2s(np.clip(s2l(arr)*np.exp2(stops)[...,None],0,1))*255.0+0.5,0,255).astype(np.uint8)

          primary=OUT/'Hao_Hair_Commercial_PrimaryCandidate_v10.png'; Image.fromarray(tone,'RGB').save(primary)
          portfolio=Image.fromarray(tone,'RGB').crop((280,560,2080,2810))
          portfolio_p=OUT/'Hao_Hair_Commercial_Portfolio4x5_v10.png'; portfolio.save(portfolio_p)
          shutil.copyfile(clean_p,OUT/'Hao_Hair_UmbrellaClean_LeftRefill_v10.png')
          shutil.copyfile(bokeh_p,OUT/'Hao_Hair_Commercial_HairSafe_Bokeh_Final_v10.png')

          old_clip=float(np.mean(np.any(old>=255,axis=2))); new_clip=float(np.mean(np.any(tone>=255,axis=2)))
          core=matte>=0.65
          old_core_clip=float(np.mean(np.any(old>=255,axis=2)[core])); new_core_clip=float(np.mean(np.any(tone>=255,axis=2)[core]))

          x0,y0,x1,y1=(350,800,1900,2600); rb=bokeh[y0:y1,x0:x1]; rt=tone[y0:y1,x0:x1]; rm=matte[y0:y1,x0:x1]
          evalm=rm>=0.20; core_roi=rm>=0.65
          def grad(a):
              g=cv2.cvtColor(a,cv2.COLOR_RGB2GRAY).astype(np.float32)
              gx=cv2.Sobel(g,cv2.CV_32F,1,0,ksize=3); gy=cv2.Sobel(g,cv2.CV_32F,0,1,ksize=3)
              return np.sqrt(gx*gx+gy*gy)
          g0=grad(rb)[evalm]; g1=grad(rt)[evalm]; gc=float(np.corrcoef(g0,g1)[0,1])
          hb=cv2.cvtColor(rb,cv2.COLOR_RGB2HSV).astype(np.float32); ht=cv2.cvtColor(rt,cv2.COLOR_RGB2HSV).astype(np.float32)
          chroma=core_roi&(hb[:,:,1]>=35)&(hb[:,:,2]>=25)
          hd=np.abs(ht[:,:,0]-hb[:,:,0]); hd=np.minimum(hd,180-hd)*2.0
          hue_med=float(np.median(hd[chroma])); hue_p95=float(np.percentile(hd[chroma],95)); sat_med=float(np.median(np.abs(ht[:,:,1]-hb[:,:,1])[chroma]))

          clip_reduction=float(1-new_clip/max(old_clip,1e-12))
          core_clip_reduction=float(1-new_core_clip/max(old_core_clip,1e-12))
          hard_pass=bool(new_clip<old_clip and clip_reduction>=0.20 and new_core_clip<old_core_clip and gc>0.995 and hue_med<=2 and hue_p95<=6 and sat_med<=4)

          # Full-size source structure before tone is byte-identical to v09 by direct copy.
          assert (OUT/'Hao_Hair_Commercial_HairSafe_Bokeh_Final_v10.png').read_bytes()==Path(bokeh_p).read_bytes()
          assert portfolio.size==(1800,2250)

          # QA sheet: v09 vs v10 plus clipping overlays.
          def thumb(a,w=520,h=930):
              im=Image.fromarray(a,'RGB'); im.thumbnail((w,h)); return im
          def clip_overlay(a):
              m=np.any(a>=255,axis=2); q=a.astype(np.float32); q[m]=0.35*q[m]+0.65*np.array([255,0,255],np.float32); return np.clip(q,0,255).astype(np.uint8)
          ims=[thumb(old),thumb(tone),thumb(clip_overlay(old)),thumb(clip_overlay(tone))]
          sheet=Image.new('RGB',(sum(i.width for i in ims),max(i.height for i in ims)),(255,255,255)); px=0
          for im in ims: sheet.paste(im,(px,0)); px+=im.width
          sheet.save(OUT/'QA_v09_v10_and_clipping.jpg',quality=95)

          report={
            'status':'TECHNICAL_PASS_PRIMARY_CANDIDATE' if hard_pass else 'TECHNICAL_FAIL',
            'change':'studio key +0.08 stop -> +0.05 stop only; no background/inpainting/matting rerun',
            'authority':{'v09_final_run':32031627343,'modnet_run':32009172839},
            'hard_gates':{'highlight_clip_reduced_ge20pct':clip_reduction>=0.20,'subject_core_clip_reduced':new_core_clip<old_core_clip,'tone_structure_fidelity':gc>0.995,'tone_color_fidelity':hue_med<=2 and hue_p95<=6 and sat_med<=4},
            'metrics':{'v09_highlight_clip_fraction':old_clip,'v10_highlight_clip_fraction':new_clip,'highlight_clip_reduction':clip_reduction,'v09_core_highlight_clip_fraction':old_core_clip,'v10_core_highlight_clip_fraction':new_core_clip,'core_highlight_clip_reduction':core_clip_reduction,'subject_gradient_correlation':gc,'median_hue_shift_degrees':hue_med,'p95_hue_shift_degrees':hue_p95,'median_saturation_shift_8bit':sat_med},
            'outputs':{'primary':{'name':primary.name,'size':[2360,4192],'sha256':sha(primary)},'portfolio':{'name':portfolio_p.name,'size':[1800,2250],'sha256':sha(portfolio_p)}},
            'promotion':'PRIMARY_CANDIDATE_PENDING_VISUAL_QA' if hard_pass else 'NOT_PROMOTED'
          }
          (OUT/'verification_final_v10.json').write_text(json.dumps(report,indent=2))
          print(json.dumps(report,indent=2))
          if not hard_pass: raise SystemExit('v10 tone gate failed')
          PY

      - name: Upload v10 candidate
        uses: actions/upload-artifact@v4
        with:
          name: hao-hair-commercial-final-v10
          path: work/final/*
          if-no-files-found: error
          retention-days: 7
