name: Hao Maintenance Preflight

on:
  push:
    branches:
      - exp/hao-system-control-render
      - exp/hao-maintenance-preflight-gate
      - exp/hao-active-work-awareness
    paths:
      - 'hao-cloud-runtime/maintenance-preflight.mjs'
      - 'hao-cloud-runtime/maintenance-preflight.test.mjs'
      - 'hao-cloud-runtime/task-router.mjs'
      - '.github/workflows/hao-maintenance-preflight.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-maintenance-preflight:
    runs-on: ubuntu-slim
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Validate shared maintenance preflight
        run: node hao-cloud-runtime/maintenance-preflight.test.mjs
      - name: Validate router consumes Current and active-work preflight before lane selection
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import { routeTask, ROUTER_POLICY } from './hao-cloud-runtime/task-router.mjs';

          const none = { checked: true, status: 'NONE', relation: 'NONE', source: 'PROVIDER_CURRENT' };
          const noOp = routeTask({
            deterministicCompute: true,
            maintenancePreflight: {
              provider: 'GITHUB',
              action: 'UPDATE_FILE',
              freshStateRead: true,
              currentStateResolved: true,
              targetIdentityVerified: true,
              mutating: true,
              necessityEstablished: true,
              activeWork: none,
              currentFingerprint: 'same',
              desiredFingerprint: 'same',
            }
          });
          if (noOp.lane !== null) process.exit(1);
          if (noOp.disposition !== 'NO_OP_NO_MATERIAL_DELTA') process.exit(1);

          const wait = routeTask({
            formalMutation: true,
            maintenancePreflight: {
              provider: 'DRIVE',
              action: 'FORMAL_WRITE',
              freshStateRead: true,
              currentStateResolved: true,
              targetIdentityVerified: true,
              formalMutation: true,
              necessityEstablished: true,
              activeWork: {
                checked: true,
                status: 'ACTIVE',
                relation: 'SAME_OBJECTIVE',
                source: 'FORMAL_LEASE',
                runKey: 'other-run'
              }
            }
          });
          if (wait.lane !== null) process.exit(1);
          if (wait.disposition !== 'WAIT_ACTIVE_WORK_SAME_OBJECTIVE') process.exit(1);

          const proceed = routeTask({
            deterministicCompute: true,
            maintenancePreflight: {
              provider: 'GITHUB',
              action: 'RUN_COMPUTE',
              freshStateRead: true,
              currentStateResolved: true,
              targetIdentityVerified: true,
              consequential: true,
              necessityEstablished: true,
              activeWork: none,
              currentFingerprint: 'old',
              desiredFingerprint: 'new',
            }
          });
          if (proceed.lane !== 'GITHUB_ACTIONS_PUBLIC') process.exit(1);
          if (ROUTER_POLICY.maintenancePreflight.noOpIsValidOutcome !== true) process.exit(1);
          if (ROUTER_POLICY.maintenancePreflight.waitIsValidOutcome !== true) process.exit(1);
          if (ROUTER_POLICY.maintenancePreflight.ruleOrder[3] !== 'ACTIVE_WORK_AWARENESS') process.exit(1);
          console.log('current_and_active_work_preflight_before_routing=PASS');
          NODE
