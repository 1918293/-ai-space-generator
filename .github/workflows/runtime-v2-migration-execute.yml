name: Runtime v2 Migration Execute

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: runtime-v2-migration-execute
  cancel-in-progress: false

jobs:
  execute-migration:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
      GCP_WIF_PROVIDER: ${{ vars.GCP_WIF_PROVIDER }}
      GCP_DEPLOY_SERVICE_ACCOUNT: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}
      GCP_REGION: asia-east1
      MIGRATION_JOB: hao-runtime-v2-migrate
    steps:
      - name: Fail closed on shared EXP ref and deployment identifiers
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF}" != "refs/heads/exp/execution-control-plane-v1" ]]; then
            echo "Migration execution is restricted to refs/heads/exp/execution-control-plane-v1" >&2
            exit 1
          fi
          for name in GCP_PROJECT_ID GCP_WIF_PROVIDER GCP_DEPLOY_SERVICE_ACCOUNT; do
            if [[ -z "${!name:-}" ]]; then
              echo "Missing required GitHub Actions variable: ${name}" >&2
              exit 1
            fi
          done

      - name: Authenticate with GitHub OIDC
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          project_id: ${{ env.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ env.GCP_WIF_PROVIDER }}
          service_account: ${{ env.GCP_DEPLOY_SERVICE_ACCOUNT }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3

      - name: Execute in-VPC migration Job and wait for success
        shell: bash
        run: |
          set -euo pipefail
          gcloud run jobs describe "${MIGRATION_JOB}" \
            --project "${GCP_PROJECT_ID}" \
            --region "${GCP_REGION}" \
            --format='value(name)' >/dev/null
          gcloud run jobs execute "${MIGRATION_JOB}" \
            --project "${GCP_PROJECT_ID}" \
            --region "${GCP_REGION}" \
            --wait
