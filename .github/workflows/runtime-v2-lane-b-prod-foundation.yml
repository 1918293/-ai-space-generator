name: Runtime v2 Lane B Production Foundation

on:
  push:
    branches:
      - exp/runtime-v2-lane-b-prod-foundation

permissions:
  contents: read

jobs:
  lane-b-production-foundation:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: ai-space-generator
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            ai-space-generator/requirements.txt
            ai-space-generator/requirements-control.txt
      - name: Install repository and Runtime v2 dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt -r requirements-control.txt pytest
      - name: Production foundation gate
        run: pytest -q tests/test_runtime_production_foundation.py tests/test_runtime_config.py tests/test_runtime_deployment.py tests/test_runtime_observability.py tests/test_postgres_persistence.py tests/test_reconciliation_persistence.py tests/test_parent_task_production.py
      - name: Runtime v2 regression
        run: pytest -q tests
