name: Runtime v2 Logical Append Blank Canonicalization

on: push

permissions:
  contents: write

jobs:
  materialize-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 2
      - name: Guard exact parent and source blobs
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^^)" = "20b9ba56ca779473940559f9622e0aa549b00633"
          test "$(git rev-parse HEAD:ai-space-generator/src/google_workspace_adapter.py)" = "14d8eee4c0a6016569c1515a52612ae8842cf4e0"
          test "$(git rev-parse HEAD:ai-space-generator/tests/test_google_workspace_adapter.py)" = "1287f6e92e8600aa99701f60878dbecb1ce816f9"
      - name: Materialize bounded blank-semantics fix
        shell: python
        run: |
          from pathlib import Path

          source = Path("ai-space-generator/src/google_workspace_adapter.py")
          text = source.read_text()
          old = '''        for item in raw_row:
            if isinstance(item, bool):
                row.append(item)
            elif isinstance(item, (int, float)):
                row.append(["__sheets_number__", _canonical_sheet_double(item)])
            else:
                row.append(item)
'''
          new = '''        for item in raw_row:
            # Sheets ValueRange does not preserve a distinction between an
            # absent/empty cell and the Python None/empty-string forms used to
            # express that blank in trusted input. Canonicalize both to the same
            # provider-state token for logical-append verification only.
            if item is None or item == "":
                row.append(None)
            elif isinstance(item, bool):
                row.append(item)
            elif isinstance(item, (int, float)):
                row.append(["__sheets_number__", _canonical_sheet_double(item)])
            else:
                row.append(item)
'''
          if text.count(old) != 1:
              raise SystemExit("source guard failed: expected digest loop exactly once")
          source.write_text(text.replace(old, new, 1))

          tests = Path("ai-space-generator/tests/test_google_workspace_adapter.py")
          test_text = tests.read_text()
          addition = r'''


def test_logical_append_readback_digest_normalizes_interior_blank_cells():
    current_proposal = proposal()
    current_proposal = type(current_proposal)(
        **{
            **current_proposal.__dict__,
            "arguments": (("values_json", '[["REC-B",null,"tail"]]'),),
        }
    )
    resolver = ConfiguredSheetsCommandResolver(
        (
            SheetsMutationTarget(
                binding_id="drive.formal_cells.update",
                spreadsheet_id="trusted-sheet",
                range_a1="01_Intake!A:C",
                authority_sources=(AuthorityFileSource("AUTH:MAIN", "trusted-sheet"),),
                mutation_mode="logical_append",
                sheet_id=123,
                unique_key_column="A",
            ),
        )
    )
    command = resolver.resolve(current_proposal)
    assert command is not None

    client = client_with_fakes()
    client._sheets.values_api.values = [["REC-B", "", "tail"]]
    readback = asyncio.run(client.readback(command))

    assert readback.matched is True
    assert readback.state_digest == command.expected_state_digest


def test_fixed_range_digest_still_distinguishes_interior_none_and_empty_string():
    assert canonical_values_digest([["REC-B", None, "tail"]]) != canonical_values_digest(
        [["REC-B", "", "tail"]]
    )
'''
          marker = "def test_fixed_range_digest_semantics_remain_unchanged():"
          if marker not in test_text:
              raise SystemExit("test guard failed: fixed-range digest marker missing")
          tests.write_text(test_text.rstrip() + addition + "\n")
      - name: Install Runtime dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r ai-space-generator/requirements-control.txt
      - name: Run focused and related tests
        working-directory: ai-space-generator
        run: |
          pytest -q tests/test_google_workspace_adapter.py tests/test_idempotent_broker.py tests/test_postgres_persistence.py tests/test_runtime_deployment.py
          python -m compileall -q src
          git diff --check
      - name: Commit tested candidate and self-remove workflow
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/runtime-v2-logical-append-blank-canonicalization.yml
          git config user.name "hao-runtime-v2-bot"
          git config user.email "hao-runtime-v2-bot@users.noreply.github.com"
          git add ai-space-generator/src/google_workspace_adapter.py ai-space-generator/tests/test_google_workspace_adapter.py .github/workflows/runtime-v2-logical-append-blank-canonicalization.yml
          git commit -m "EXP: align logical append blank-cell semantics"
          git push origin HEAD:exp/runtime-v2-logical-append-blank-canonicalization
