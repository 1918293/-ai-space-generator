name: Hao Hair Salon Production Gate v03

on:
  workflow_dispatch:
    inputs:
      source_run_id:
        description: GitHub Actions run containing the source/authority artifact
        required: false
        default: '32003834720'
      source_artifact:
        description: Source/authority artifact name
        required: false
        default: 'hao-hair-realesr-general-x2-dn020'
      candidate_run_id:
        description: GitHub Actions run containing the candidate artifact
        required: false
        default: '32038938614'
      candidate_artifact:
        description: Candidate artifact name
        required: false
        default: 'hao-hair-commercial-final-v11'
      matte_run_id:
        description: GitHub Actions run containing the matte authority
        required: false
        default: '32009172839'
      matte_artifact:
        description: Matte artifact name
        required: false
        default: 'hao-hair-commercial-modnet-hairsafe-bokeh-v02'
  push:
    branches:
      - hao-hair-sr-test-20260817
    paths:
      - '.github/workflows/hair-salon-production-gate-v01.yml'
      - 'tools/hair_salon_pipeline/**'

permissions:
  contents: read
  actions: read

jobs:
  production-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Download source authority
        uses: actions/download-artifact@v4
        with:
          name: ${{ github.event.inputs.source_artifact || 'hao-hair-realesr-general-x2-dn020' }}
          path: work/source
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ github.event.inputs.source_run_id || '32003834720' }}

      - name: Download candidate
        uses: actions/download-artifact@v4
        with:
          name: ${{ github.event.inputs.candidate_artifact || 'hao-hair-commercial-final-v11' }}
          path: work/candidate
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ github.event.inputs.candidate_run_id || '32038938614' }}

      - name: Download matte authority
        uses: actions/download-artifact@v4
        with:
          name: ${{ github.event.inputs.matte_artifact || 'hao-hair-commercial-modnet-hairsafe-bokeh-v02' }}
          path: work/matte
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ github.event.inputs.matte_run_id || '32009172839' }}

      - name: Install minimal QA stack
        run: |
          python -m pip install --disable-pip-version-check --quiet pillow==10.4.0 numpy==1.26.4 opencv-python-headless==4.10.0.84 onnxruntime==1.19.2
          python -m py_compile tools/hair_salon_pipeline/preflight.py tools/hair_salon_pipeline/hair_qa.py tools/hair_salon_pipeline/gate.py tools/hair_salon_pipeline/hair_segment_onnx.py

      - name: Resolve artifact inputs
        run: |
          python - <<'PY'
          from pathlib import Path
          import os
          from PIL import Image
          def largest_image(root):
              hits=[]
              for p in Path(root).rglob('*'):
                  if p.suffix.lower() not in {'.png','.jpg','.jpeg'}: continue
                  try:
                      im=Image.open(p)
                      if all(k not in p.name.lower() for k in ['mask','matte','protect','qa']):
                          hits.append((im.size[0]*im.size[1],p.stat().st_size,p))
                  except Exception: pass
              assert hits, root
              return max(hits)[2]
          source=largest_image('work/source')
          candidate_hits=list(Path('work/candidate').rglob('*PrimaryCandidate*.png'))
          candidate=max(candidate_hits,key=lambda p:p.stat().st_size) if candidate_hits else largest_image('work/candidate')
          matte_hits=list(Path('work/matte').rglob('modnet_matte_768_v02.png'))
          if not matte_hits:
              matte_hits=[p for p in Path('work/matte').rglob('*.png') if 'matte' in p.name.lower()]
          assert matte_hits,'matte not found'
          matte=matte_hits[0]
          with open(os.environ['GITHUB_ENV'],'a') as f:
              f.write(f'SOURCE_IMAGE={source}\nCANDIDATE_IMAGE={candidate}\nMATTE_IMAGE={matte}\n')
          print('SOURCE',source); print('CANDIDATE',candidate); print('MATTE',matte)
          PY

      - name: Generate dedicated source-derived hair mask
        id: hairseg
        continue-on-error: true
        run: |
          mkdir -p work/model work/reports
          curl -L --fail --retry 3 https://github.com/yakhyo/face-parsing/releases/download/weights/resnet18.onnx -o work/model/resnet18.onnx
          python tools/hair_salon_pipeline/hair_segment_onnx.py \
            --source "$SOURCE_IMAGE" \
            --matte "$MATTE_IMAGE" \
            --model work/model/resnet18.onnx \
            --output-mask work/reports/hair_mask_source_v03.png \
            --output-report work/reports/hair_segmentation_v03.json \
            --output-qa work/reports/QA_hair_segmentation_v03.jpg

      - name: Run single-command production gate
        id: gate
        continue-on-error: true
        run: |
          EXTRA=()
          if [ -s work/reports/hair_mask_source_v03.png ]; then
            EXTRA+=(--hair-mask work/reports/hair_mask_source_v03.png)
          fi
          python tools/hair_salon_pipeline/gate.py \
            --source "$SOURCE_IMAGE" \
            --candidate "$CANDIDATE_IMAGE" \
            --matte "$MATTE_IMAGE" \
            "${EXTRA[@]}" \
            --output-dir work/reports

      - name: Upload production gate evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hao-hair-salon-production-gate-v03
          path: work/reports/*
          if-no-files-found: error
          retention-days: 14

      - name: Enforce production gate
        if: always()
        env:
          GATE_OUTCOME: ${{ steps.gate.outcome }}
        run: |
          test "$GATE_OUTCOME" = "success"
