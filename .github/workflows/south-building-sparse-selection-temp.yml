name: South Building selected image fixity temp
run-name: south-building-selected-image-fixity-temp

on:
  push:
    branches:
      - temp/south-building-selection-20261023
    paths:
      - .github/workflows/south-building-sparse-selection-temp.yml

permissions:
  contents: write

jobs:
  fixity:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Range-extract frozen target and donors from official archive
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import binascii, hashlib, json, struct, urllib.request, zlib
          from pathlib import Path
          from urllib.parse import urlparse

          RELEASE_URL = "https://github.com/colmap/colmap/releases/download/3.11.1/south-building.zip"
          EXPECTED_ARCHIVE_BYTES = 419421847
          SELECTION_RECEIPT_BLOB_SHA = "91e27fae16515a295d050147899c3e0b4415b5f7"
          SELECTED = [
              {"role":"TARGET","image_id":102,"filename":"P1180211.JPG","tracked_observation_count":4721,"median_track_length":7,"median_point_error":0.442066},
              {"role":"DONOR_1","image_id":33,"filename":"P1180212.JPG","shared_point_count":3169},
              {"role":"DONOR_2","image_id":3,"filename":"P1180210.JPG","shared_point_count":3086},
          ]
          receipt = {
              "schema":"south-building-selected-image-fixity-v1",
              "source_authority":"COLMAP 3.11.1 south-building.zip asset_id=213120796",
              "selection_receipt_blob_sha":SELECTION_RECEIPT_BLOB_SHA,
              "transport":"HEAD_RESOLVE_FINAL_OBJECT_THEN_EXPLICIT_HTTP_RANGE_ONLY",
              "selected":SELECTED,
              "members":{},
          }
          transferred=0

          def head_final():
              req=urllib.request.Request(
                  RELEASE_URL, method="HEAD",
                  headers={"User-Agent":"hao-south-building-image-fixity/1","Accept-Encoding":"identity"}
              )
              resp=urllib.request.urlopen(req,timeout=90)
              final=resp.geturl()
              status=getattr(resp,"status",resp.getcode())
              length=resp.headers.get("Content-Length","")
              ar=resp.headers.get("Accept-Ranges","")
              resp.close()
              return final,status,length,ar

          try:
              selection=json.load(open("south-building-selection-result.json","r",encoding="utf-8"))
              if selection.get("status")!="PASS":
                  raise RuntimeError("SELECTION_RECEIPT_NOT_PASS")
              actual=[
                  (selection["target"]["image_id"],selection["target"]["filename"]),
                  *[(x["image_id"],x["filename"]) for x in selection["donors"]],
              ]
              expected=[(102,"P1180211.JPG"),(33,"P1180212.JPG"),(3,"P1180210.JPG")]
              if actual!=expected:
                  raise RuntimeError(f"SELECTION_BINDING_MISMATCH:{actual}")

              final_url,head_status,head_len,accept_ranges=head_final()
              receipt.update({
                  "resolved_asset_host":urlparse(final_url).hostname or "",
                  "head_status":head_status,
                  "head_content_length":head_len,
                  "head_accept_ranges":accept_ranges,
              })
              if int(head_len)!=EXPECTED_ARCHIVE_BYTES:
                  raise RuntimeError("ARCHIVE_SIZE_MISMATCH")

              def fetch_range(start,end):
                  global transferred
                  req=urllib.request.Request(
                      final_url,
                      headers={
                          "Range":f"bytes={start}-{end}",
                          "User-Agent":"hao-south-building-image-fixity/1",
                          "Accept-Encoding":"identity",
                      },
                  )
                  resp=urllib.request.urlopen(req,timeout=90)
                  status=getattr(resp,"status",resp.getcode())
                  cr=resp.headers.get("Content-Range","")
                  if status!=206:
                      resp.close()
                      raise RuntimeError(f"RANGE_REQUIRED_STATUS_{status}")
                  data=resp.read()
                  resp.close()
                  transferred+=len(data)
                  return data,cr

              tail_len=min(131072,EXPECTED_ARCHIVE_BYTES)
              tail_start=EXPECTED_ARCHIVE_BYTES-tail_len
              tail,cr=fetch_range(tail_start,EXPECTED_ARCHIVE_BYTES-1)
              if "/" not in cr or int(cr.rsplit("/",1)[1])!=EXPECTED_ARCHIVE_BYTES:
                  raise RuntimeError("CONTENT_RANGE_TOTAL_MISMATCH")
              pos=tail.rfind(b"PK\x05\x06")
              if pos<0:
                  raise RuntimeError("EOCD_NOT_FOUND")
              _,disk_no,cd_disk,n_disk,n_total,cd_size,cd_offset,_=struct.unpack_from("<4s4H2IH",tail,pos)
              if disk_no!=0 or cd_disk!=0 or n_disk!=n_total:
                  raise RuntimeError("MULTIDISK_ZIP_NOT_SUPPORTED")
              cd,_=fetch_range(cd_offset,cd_offset+cd_size-1)

              entries={}
              off=0
              while off<len(cd):
                  if cd[off:off+4]!=b"PK\x01\x02":
                      raise RuntimeError(f"BAD_CENTRAL_SIGNATURE_AT_{off}")
                  vals=struct.unpack_from("<4s6H3I5H2I",cd,off)
                  (sig,ver_made,ver_need,flags,method,mtime,mdate,crc32,comp_size,uncomp_size,
                   name_len,extra_len,comment_len,disk_start,int_attr,ext_attr,local_offset)=vals
                  nb=cd[off+46:off+46+name_len]
                  name=nb.decode("utf-8" if flags&0x800 else "cp437")
                  entries[name]={
                      "method":method,"crc32":crc32,"compressed_bytes":comp_size,
                      "uncompressed_bytes":uncomp_size,"local_offset":local_offset,
                  }
                  off+=46+name_len+extra_len+comment_len

              for sel in SELECTED:
                  suffix="/images/"+sel["filename"]
                  matches=[name for name in entries if name.endswith(suffix)]
                  if len(matches)!=1:
                      raise RuntimeError(f"IMAGE_MEMBER_UNIQUE_MATCH_REQUIRED:{sel['filename']}:{matches}")
                  name=matches[0]
                  e=entries[name]
                  lh,_=fetch_range(e["local_offset"],e["local_offset"]+29)
                  sig,ver_need,flags,method,mtime,mdate,lcrc,lcsize,lusize,name_len,extra_len=struct.unpack("<4s5H3I2H",lh)
                  if sig!=b"PK\x03\x04":
                      raise RuntimeError("BAD_LOCAL_HEADER:"+name)
                  start=e["local_offset"]+30+name_len+extra_len
                  comp,_=fetch_range(start,start+e["compressed_bytes"]-1)
                  if method==0:
                      raw=comp
                  elif method==8:
                      raw=zlib.decompress(comp,-15)
                  else:
                      raise RuntimeError(f"UNSUPPORTED_COMPRESSION_{method}:{name}")
                  crc=binascii.crc32(raw)&0xffffffff
                  if crc!=e["crc32"] or len(raw)!=e["uncompressed_bytes"]:
                      raise RuntimeError("ZIP_FIXITY_FAIL:"+name)
                  receipt["members"][sel["role"]]={
                      "archive_path":name,
                      "filename":sel["filename"],
                      "image_id":sel["image_id"],
                      "bytes":len(raw),
                      "sha256":hashlib.sha256(raw).hexdigest(),
                      "zip_crc32":f"{e['crc32']:08x}",
                      "computed_crc32":f"{crc:08x}",
                      "compressed_bytes_transferred":len(comp),
                      "fixity_pass":True,
                  }

              receipt.update({
                  "status":"PASS",
                  "range_bytes_transferred_total":transferred,
                  "full_archive_download_avoided":transferred<EXPECTED_ARCHIVE_BYTES//2,
                  "no_unselected_image_member_read":True,
                  "no_gate_outcome_read":True,
              })
          except Exception as exc:
              receipt.update({
                  "status":"FAIL",
                  "error":f"{type(exc).__name__}:{exc}",
                  "range_bytes_transferred_total":transferred,
                  "full_archive_download_avoided":transferred<EXPECTED_ARCHIVE_BYTES//2,
              })

          Path("south-building-selected-image-fixity-result.json").write_text(
              json.dumps(receipt,indent=2,sort_keys=True)+"\n",encoding="utf-8"
          )
          print(json.dumps(receipt,sort_keys=True))
          PY

      - name: Commit selected-member fixity receipt
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add south-building-selected-image-fixity-result.json
          git commit -m "temp: South Building selected image fixity receipt"
          git push origin "HEAD:$GITHUB_REF_NAME"

      - name: Fail if selected-member fixity did not pass
        shell: bash
        run: |
          python - <<'PY'
          import json
          data=json.load(open("south-building-selected-image-fixity-result.json","r",encoding="utf-8"))
          if data.get("status")!="PASS":
              raise SystemExit(data.get("error","selected-member fixity did not pass"))
          PY
