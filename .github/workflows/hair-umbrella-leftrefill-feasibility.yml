name: Hao Hair LeftRefill Reference Inpainting Probe

on:
  push:
    branches:
      - hao-hair-sr-test-20260817
    paths:
      - '.github/workflows/hair-umbrella-leftrefill-feasibility.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  leftrefill-probe:
    runs-on: ubuntu-22.04
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Download verified 2x SR source
        uses: actions/download-artifact@v4
        with:
          name: hao-hair-realesr-general-x2-dn020
          path: work/source_artifact
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: 32003834720

      - name: Clone simple LeftRefill wrapper and record source
        run: |
          git clone --depth 1 https://github.com/DavidXu-JJ/simple-leftrefill-inpainting.git work/simple-leftrefill
          cd work/simple-leftrefill
          git rev-parse HEAD | tee ../leftrefill_wrapper_commit.txt

      - name: Install CPU inference environment
        continue-on-error: true
        run: |
          set -o pipefail
          {
            python -m pip install --upgrade pip==23.3.2 'setuptools<70' wheel
            python -m pip install torch==2.2.2 torchvision==0.17.2 --index-url https://download.pytorch.org/whl/cpu
            python -m pip install numpy==1.23.5 pillow==9.5.0 opencv-python-headless==4.8.1.78 fire==0.5.0
            python -m pip install webdataset==0.2.86 transformers==4.39.3 huggingface_hub==0.20.2 easydict==1.13
            python -m pip install pytorch-lightning==1.5.0 torchmetrics==0.7.3 kornia==0.5.0 timm==0.4.12 einops==0.7.0 open_clip_torch==2.16.0 yacs==0.1.8 omegaconf==2.3.0 scikit-image==0.21.0 safetensors==0.4.3
            python -m pip install -e work/simple-leftrefill --no-deps
            python - <<'PY'
          import torch, numpy, PIL, transformers, pytorch_lightning, open_clip, kornia
          print('TORCH',torch.__version__,'CUDA',torch.cuda.is_available())
          print('NUMPY',numpy.__version__,'PIL',PIL.__version__)
          print('TRANSFORMERS',transformers.__version__,'PL',pytorch_lightning.__version__)
          print('OPEN_CLIP_OK',open_clip.__version__ if hasattr(open_clip,'__version__') else 'yes')
          print('KORNIA',kornia.__version__)
          PY
          } 2>&1 | tee work/environment.log

      - name: Patch wrapper for CPU-safe autocast and variable probe size
        if: always()
        run: |
          cd work/simple-leftrefill
          cp simple_leftrefill_inpainting/LeftRefill/wrapper.py ../wrapper_official.py
          python - <<'PY'
          from pathlib import Path
          p=Path('simple_leftrefill_inpainting/LeftRefill/wrapper.py')
          s=p.read_text()
          s=s.replace('import sys\n', 'import sys\nfrom contextlib import nullcontext\n')
          s=s.replace('with torch.no_grad(), torch.autocast("cuda"):', 'with torch.no_grad(), (torch.autocast("cuda") if torch.cuda.is_available() else nullcontext()):')
          s=s.replace('result = result[:, :, 512:]', 'result = result[:, :, w // 2:]')
          s=s.replace('torch.cuda.manual_seed(42)\n        torch.cuda.manual_seed_all(42)', 'if torch.cuda.is_available():\n            torch.cuda.manual_seed(42)\n            torch.cuda.manual_seed_all(42)')
          p.write_text(s)
          PY
          python -m py_compile simple_leftrefill_inpainting/LeftRefill/wrapper.py
          diff -u ../wrapper_official.py simple_leftrefill_inpainting/LeftRefill/wrapper.py > ../cpu_probe_patch.diff || true
          cat ../cpu_probe_patch.diff

      - name: Prepare target, broad umbrella mask, source-derived clean reference, and person protection
        if: always()
        run: |
          python - <<'PY'
          from pathlib import Path
          from PIL import Image, ImageDraw
          import numpy as np, json
          files=list(Path('work/source_artifact').rglob('*.png')); assert files
          src=Image.open(files[0]).convert('RGB'); assert src.size==(2360,4192)
          Path('work/leftrefill_inputs').mkdir(exist_ok=True)

          # Target: 2048 square with enough scene context, same as the ZITS++ diagnostic crop.
          target_box=(312,2144,2360,4192)
          target=src.crop(target_box)
          target.save('work/leftrefill_inputs/target.png')

          # Reference: an actually clean same-photo patch showing the same wood panel + dark trim + white wall transition.
          reference_box=(1500,900,2360,1760)
          ref=src.crop(reference_box)
          ref.save('work/leftrefill_inputs/reference.png')

          # Broad model mask in original target-crop coordinates, covering the full umbrella cluster.
          mask=Image.new('L',(2048,2048),0); d=ImageDraw.Draw(mask)
          poly=[(1110,580),(1320,540),(1540,560),(1760,550),(1960,590),(2047,640),
                (2047,2047),(1050,2047),(1010,1780),(1025,1500),(1060,1240),(1080,980),(1060,760)]
          d.polygon(poly,fill=255)
          d.polygon([(990,1200),(1160,1180),(1200,1900),(1000,1930)],fill=255)
          mask.save('work/leftrefill_inputs/model_mask.png')

          # Same audited person geometry projected to this target crop; final candidate must restore these pixels exactly.
          protect=Image.new('L',(2048,2048),0); dp=ImageDraw.Draw(protect)
          def T(pt): return (pt[0]-target_box[0],pt[1]-target_box[1])
          sleeve=[(1580,2250),(2030,2250),(2065,3040),(2060,3140),(2035,3185),(1990,3180),(1930,3140),(1840,3100),(1740,3060),(1650,3035),(1580,3000)]
          arm=[(1400,3045),(1530,3055),(1700,3065),(1870,3090),(1990,3140),(2045,3195),(2045,3215),(2010,3250),(1980,3290),(1940,3325),(1900,3355),(1860,3380),(1810,3402),(1750,3422),(1660,3442),(1530,3450),(1430,3430),(1380,3380),(1360,3300)]
          dp.polygon([T(p) for p in sleeve],fill=255)
          dp.polygon([T(p) for p in arm],fill=255)
          dp.rectangle((0,3100-target_box[1],1665-target_box[0],2047),fill=255)
          protect.save('work/leftrefill_inputs/person_protect.png')

          rep={'target_box':target_box,'reference_box':reference_box,'target_size':target.size,
               'mask_fraction':float((np.asarray(mask)>0).mean()),
               'protected_overlap_pixels':int(((np.asarray(mask)>0)&(np.asarray(protect)>0)).sum())}
          Path('work/leftrefill_input_report.json').write_text(json.dumps(rep,indent=2))
          print(json.dumps(rep,indent=2))
          PY

      - name: Run actual reference-guided LeftRefill CPU probe at 256
        id: inference
        continue-on-error: true
        run: |
          set -o pipefail
          cd work/simple-leftrefill
          /usr/bin/time -v timeout 1800s python - <<'PY' 2>&1 | tee ../leftrefill_inference.log
          from pathlib import Path
          from PIL import Image
          import torch, gc
          from simple_leftrefill_inpainting import LeftRefillGuidance

          root=Path('../leftrefill_inputs')
          print('START_INIT CPU',not torch.cuda.is_available())
          model=LeftRefillGuidance()
          model.target_image_size=256
          print('MODEL_READY target',model.target_image_size)
          result=model.predict(
              Image.open(root/'target.png').convert('RGB'),
              Image.open(root/'model_mask.png').convert('L'),
              Image.open(root/'reference.png').convert('RGB'),
              ddim_steps=6,
              scale=2.5,
              seed=42,
          )
          Path('../leftrefill_output').mkdir(exist_ok=True)
          result.save('../leftrefill_output/raw_leftrefill_256.png')
          print('OUTPUT_SIZE',result.size)
          del model; gc.collect()
          PY
          test -s work/leftrefill_output/raw_leftrefill_256.png

      - name: Build source-safe candidate and verdict
        if: always()
        run: |
          python - <<'PY'
          from pathlib import Path
          from PIL import Image
          import numpy as np, json, hashlib, re
          root=Path('work')
          target=Image.open(root/'leftrefill_inputs/target.png').convert('RGB')
          mask=Image.open(root/'leftrefill_inputs/model_mask.png').convert('L')
          protect=Image.open(root/'leftrefill_inputs/person_protect.png').convert('L')
          rawp=root/'leftrefill_output/raw_leftrefill_256.png'
          log=(root/'leftrefill_inference.log').read_text(errors='ignore') if (root/'leftrefill_inference.log').exists() else ''
          verdict={'raw_output_exists':rawp.exists() and rawp.stat().st_size>0,
                   'timed_out':'status 124' in log.lower() or 'Command exited with non-zero status 124' in log,
                   'oom_signal':'out of memory' in log.lower() or 'killed' in log.lower()}
          if verdict['raw_output_exists']:
              raw=Image.open(rawp).convert('RGB').resize(target.size,Image.Resampling.BICUBIC)
              a=np.asarray(target); g=np.asarray(raw)
              m=np.asarray(mask)>0; p=np.asarray(protect)>0; safe=m & ~p
              out=a.copy(); out[safe]=g[safe]
              outim=Image.fromarray(out); outp=root/'leftrefill_output/source_safe_leftrefill_256.png'; outim.save(outp)
              verdict.update({'output_size':raw.size,'safe_edit_pixels':int(safe.sum()),
                              'outside_safe_edit_changed_pixels':int(np.count_nonzero(np.any(out!=a,axis=2)&~safe)),
                              'inside_changed_pixels':int(np.count_nonzero(np.any(out!=a,axis=2)&safe)),
                              'sha256':hashlib.sha256(outp.read_bytes()).hexdigest(),
                              'status':'INFERENCE_OUTPUT_CANDIDATE'})
              qa=Image.new('RGB',(2048*3,2048)); qa.paste(target,(0,0)); qa.paste(raw,(2048,0)); qa.paste(outim,(4096,0))
              qa.thumbnail((1800,600)); qa.save(root/'leftrefill_output/qa_before_raw_safe.jpg',quality=92)
          else:
              verdict['status']='INFERENCE_BLOCKED'
          verdict['promotion']='NOT_PROMOTED_PENDING_VISUAL_QA'
          (root/'leftrefill_verdict.json').write_text(json.dumps(verdict,indent=2))
          print(json.dumps(verdict,indent=2))
          PY

      - name: Upload LeftRefill probe evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hao-hair-leftrefill-probe-v01
          path: |
            work/leftrefill_wrapper_commit.txt
            work/environment.log
            work/cpu_probe_patch.diff
            work/leftrefill_input_report.json
            work/leftrefill_inputs/*.png
            work/leftrefill_inference.log
            work/leftrefill_verdict.json
            work/leftrefill_output/*
          if-no-files-found: warn
          retention-days: 7
