name: Hao Hair LeftRefill Reference Inpainting Probe

on:
  push:
    branches:
      - hao-hair-sr-test-20260817
    paths:
      - '.github/workflows/hair-umbrella-leftrefill-feasibility.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  leftrefill-probe:
    runs-on: ubuntu-22.04
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Download verified 2x SR source
        uses: actions/download-artifact@v4
        with:
          name: hao-hair-realesr-general-x2-dn020
          path: work/source_artifact
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: 32003834720

      - name: Download verified MODNet subject matte
        uses: actions/download-artifact@v4
        with:
          name: hao-hair-commercial-modnet-hairsafe-bokeh-v02
          path: work/modnet_artifact
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: 32009172839

      - name: Download aligned source-plate reference v15
        uses: actions/download-artifact@v4
        with:
          name: hao-hair-umbrella-source-plate-v15
          path: work/source_plate_v15
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: 32008506857

      - name: Clone simple LeftRefill wrapper and record source
        run: |
          git clone --depth 1 https://github.com/DavidXu-JJ/simple-leftrefill-inpainting.git work/simple-leftrefill
          cd work/simple-leftrefill
          git rev-parse HEAD | tee ../leftrefill_wrapper_commit.txt

      - name: Install CPU inference environment
        run: |
          set -o pipefail
          {
            python -m pip install --upgrade pip==23.3.2 'setuptools<70' wheel
            python -m pip install torch==2.2.2 torchvision==0.17.2 --index-url https://download.pytorch.org/whl/cpu
            python -m pip install numpy==1.23.5 pillow==9.5.0 opencv-python-headless==4.8.1.78 fire==0.5.0
            python -m pip install webdataset==0.2.86 transformers==4.39.3 huggingface_hub==0.20.2 easydict==1.13
            python -m pip install pytorch-lightning==1.5.0 torchmetrics==0.7.3 kornia==0.5.0 timm==0.4.12 einops==0.7.0 open_clip_torch==2.16.0 yacs==0.1.8 omegaconf==2.3.0 scikit-image==0.21.0 safetensors==0.4.3
            python -m pip install -e work/simple-leftrefill --no-deps
            python - <<'PY'
          import torch, numpy, PIL
          print('TORCH',torch.__version__,'CUDA',torch.cuda.is_available())
          print('NUMPY',numpy.__version__,'PIL',PIL.__version__)
          PY
          } 2>&1 | tee work/environment.log

      - name: Patch wrapper and DDIM for CPU-safe execution
        run: |
          cd work/simple-leftrefill
          cp simple_leftrefill_inpainting/LeftRefill/wrapper.py ../wrapper_official.py
          cp simple_leftrefill_inpainting/LeftRefill/ldm/models/diffusion/ddim.py ../ddim_official.py
          python - <<'PY'
          from pathlib import Path
          p=Path('simple_leftrefill_inpainting/LeftRefill/wrapper.py'); s=p.read_text()
          s=s.replace('import sys\n','import sys\nfrom contextlib import nullcontext\n')
          s=s.replace('with torch.no_grad(), torch.autocast("cuda"):', 'with torch.no_grad(), (torch.autocast("cuda") if torch.cuda.is_available() else nullcontext()):')
          s=s.replace('result = result[:, :, 512:]', 'result = result[:, :, w // 2:]')
          s=s.replace('torch.cuda.manual_seed(42)\n        torch.cuda.manual_seed_all(42)', 'if torch.cuda.is_available():\n            torch.cuda.manual_seed(42)\n            torch.cuda.manual_seed_all(42)')
          old="im_padded = Image.fromarray(np.pad(np.array(input_image), ((0, pad_h), (0, pad_w), (0, 0)), mode='edge'))"
          new="arr = np.array(input_image)\n        pad_spec = ((0, pad_h), (0, pad_w), (0, 0)) if arr.ndim == 3 else ((0, pad_h), (0, pad_w))\n        im_padded = Image.fromarray(np.pad(arr, pad_spec, mode='edge'))"
          assert old in s; s=s.replace(old,new)
          old="model = model.to(device)\n        model.eval()"
          new="model = model.to(device)\n        if hasattr(model, 'cond_stage_model') and hasattr(model.cond_stage_model, 'device'):\n            model.cond_stage_model.device = device\n        model.eval()"
          assert old in s; p.write_text(s.replace(old,new))

          p=Path('simple_leftrefill_inpainting/LeftRefill/ldm/models/diffusion/ddim.py'); s=p.read_text()
          old='''    def register_buffer(self, name, attr):\n        if type(attr) == torch.Tensor:\n            if attr.device != torch.device("cuda"):\n                attr = attr.to(torch.device("cuda"))\n        setattr(self, name, attr)'''
          new='''    def register_buffer(self, name, attr):\n        if type(attr) == torch.Tensor:\n            device = self.model.betas.device\n            if attr.device != device:\n                attr = attr.to(device)\n        setattr(self, name, attr)'''
          assert old in s; p.write_text(s.replace(old,new))
          PY
          python -m py_compile simple_leftrefill_inpainting/LeftRefill/wrapper.py simple_leftrefill_inpainting/LeftRefill/ldm/models/diffusion/ddim.py
          diff -u ../wrapper_official.py simple_leftrefill_inpainting/LeftRefill/wrapper.py > ../cpu_probe_patch.diff || true
          diff -u ../ddim_official.py simple_leftrefill_inpainting/LeftRefill/ldm/models/diffusion/ddim.py > ../ddim_cpu_patch.diff || true

      - name: Prepare unchanged MODNet-safe mask and aligned structural reference
        run: |
          python - <<'PY'
          from pathlib import Path
          from PIL import Image, ImageDraw, ImageFilter
          import numpy as np, json

          srcfiles=list(Path('work/source_artifact').rglob('*.png')); assert srcfiles
          src=Image.open(srcfiles[0]).convert('RGB'); assert src.size==(2360,4192)
          mattefiles=list(Path('work/modnet_artifact').rglob('modnet_matte_768_v02.png')); assert mattefiles
          matte=Image.open(mattefiles[0]).convert('L'); assert matte.size==(2360,4192)
          reffiles=list(Path('work/source_plate_v15').rglob('Hao_Hair_SR_x2_umbrella_source_plate_v15.png')); assert reffiles
          ref_full=Image.open(reffiles[0]).convert('RGB'); assert ref_full.size==(2360,4192)
          outdir=Path('work/leftrefill_inputs'); outdir.mkdir(exist_ok=True)

          target_box=(312,2144,2360,4192)
          target=src.crop(target_box); target.save(outdir/'target.png')
          ref_full.crop(target_box).save(outdir/'reference_aligned_v15.png')

          matte_crop=matte.crop(target_box)
          protect=np.where(np.asarray(matte_crop)>=13,255,0).astype(np.uint8)
          protect_img=Image.fromarray(protect,'L').filter(ImageFilter.MaxFilter(17))
          protect=np.asarray(protect_img)>0; protect_img.save(outdir/'person_protect_modnet.png')

          geom=Image.new('L',(2048,2048),0); d=ImageDraw.Draw(geom)
          d.polygon([(1430,940),(1530,910),(1650,930),(1770,920),(1900,950),(2047,970),
                     (2047,2047),(1380,2047),(1360,1900),(1370,1710),(1390,1510),(1420,1310),(1410,1110)],fill=255)
          d.polygon([(1320,1160),(1455,1140),(1500,1930),(1325,1960)],fill=255)
          geom_arr=np.asarray(geom)>0; safe_model=geom_arr & ~protect
          Image.fromarray((safe_model.astype(np.uint8)*255),'L').save(outdir/'model_mask.png')
          geom.save(outdir/'umbrella_geometry_mask.png')

          overlay=np.asarray(target).copy(); overlay[safe_model]=(0.55*overlay[safe_model]+0.45*np.array([255,0,0])).astype(np.uint8)
          Image.fromarray(overlay).save(outdir/'model_mask_overlay.jpg',quality=92)

          rep={'target_box':target_box,'reference':'v15 aligned same-coordinate crop','reference_source_run':32008506857,
               'modnet_source_run':32009172839,'modnet_protect_threshold_u8':13,'modnet_dilation_px':8,
               'geometry_mask_pixels':int(geom_arr.sum()),'protected_pixels':int(protect.sum()),
               'final_model_mask_pixels':int(safe_model.sum()),'final_model_mask_fraction':float(safe_model.mean()),
               'geometry_removed_by_subject_protection':int((geom_arr&protect).sum()),
               'internal_inference_size':512,'ddim_steps':8,'scale':2.5,'seed':42}
          Path('work/leftrefill_input_report.json').write_text(json.dumps(rep,indent=2)); print(json.dumps(rep,indent=2))
          PY

      - name: Restore Hugging Face model cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface/hub
          key: hao-leftrefill-sd2-openclip-v1

      - name: Run aligned-reference LeftRefill CPU validation at 512
        id: inference
        continue-on-error: true
        run: |
          set -o pipefail
          cd work/simple-leftrefill
          /usr/bin/time -v timeout 1800s python - <<'PY' 2>&1 | tee ../leftrefill_inference.log
          from pathlib import Path
          from PIL import Image
          import torch, gc
          from simple_leftrefill_inpainting import LeftRefillGuidance
          root=Path('../leftrefill_inputs')
          model=LeftRefillGuidance(); model.target_image_size=512
          print('MODEL_READY target',model.target_image_size,'DEVICE',model.sampler.model.betas.device)
          result=model.predict(Image.open(root/'target.png').convert('RGB'),Image.open(root/'model_mask.png').convert('L'),Image.open(root/'reference_aligned_v15.png').convert('RGB'),ddim_steps=8,scale=2.5,seed=42)
          Path('../leftrefill_output').mkdir(exist_ok=True)
          result.save('../leftrefill_output/raw_leftrefill_512.png'); print('OUTPUT_SIZE',result.size)
          del model; gc.collect()
          PY
          test -s work/leftrefill_output/raw_leftrefill_512.png

      - name: Build source-safe 512 candidate and diagnostic metrics
        if: always()
        run: |
          python - <<'PY'
          from pathlib import Path
          from PIL import Image
          import numpy as np, json, hashlib, cv2
          root=Path('work'); inp=root/'leftrefill_inputs'; outdir=root/'leftrefill_output'; outdir.mkdir(exist_ok=True)
          target=Image.open(inp/'target.png').convert('RGB'); mask=Image.open(inp/'model_mask.png').convert('L'); protect=Image.open(inp/'person_protect_modnet.png').convert('L'); rawp=outdir/'raw_leftrefill_512.png'
          log=(root/'leftrefill_inference.log').read_text(errors='ignore') if (root/'leftrefill_inference.log').exists() else ''
          verdict={'raw_output_exists':rawp.exists() and rawp.stat().st_size>0,
                   'timed_out':'status 124' in log.lower() or 'Command exited with non-zero status 124' in log,
                   'oom_signal':'out of memory' in log.lower() or 'killed' in log.lower(),
                   'internal_inference_size':512,'ddim_steps':8,'scale':2.5,'seed':42}
          if verdict['raw_output_exists']:
              raw=Image.open(rawp).convert('RGB').resize(target.size,Image.Resampling.BICUBIC)
              a=np.asarray(target); g=np.asarray(raw); safe=np.asarray(mask)>0; p=np.asarray(protect)>0
              assert not np.any(safe&p)
              out=a.copy(); out[safe]=g[safe]
              outim=Image.fromarray(out); outp=outdir/'source_safe_leftrefill_512.png'; outim.save(outp)
              hsv0=cv2.cvtColor(a,cv2.COLOR_RGB2HSV); hsv1=cv2.cvtColor(out,cv2.COLOR_RGB2HSV)
              red0=(((hsv0[:,:,0]<12)|(hsv0[:,:,0]>170))&(hsv0[:,:,1]>110)&(hsv0[:,:,2]>80)&safe)
              red1=(((hsv1[:,:,0]<12)|(hsv1[:,:,0]>170))&(hsv1[:,:,1]>110)&(hsv1[:,:,2]>80)&safe)
              gray=((hsv1[:,:,1]<45)&(hsv1[:,:,2]>35)&(hsv1[:,:,2]<190)&safe)
              outside=int(np.count_nonzero(np.any(out!=a,axis=2)&~safe)); protected_changes=int(np.count_nonzero(np.any(out!=a,axis=2)&p))
              verdict.update({'output_size':raw.size,'safe_edit_pixels':int(safe.sum()),'outside_safe_edit_changed_pixels':outside,
                              'protected_subject_changed_pixels':protected_changes,'inside_changed_pixels':int(np.count_nonzero(np.any(out!=a,axis=2)&safe)),
                              'red_before':int(red0.sum()),'red_after':int(red1.sum()),
                              'red_removal_ratio':float(1-red1.sum()/max(1,red0.sum())),
                              'gray_fraction_in_safe_edit':float(gray.sum()/max(1,safe.sum())),
                              'sha256':hashlib.sha256(outp.read_bytes()).hexdigest(),'status':'INFERENCE_OUTPUT_CANDIDATE'})
              qa=Image.new('RGB',(2048*4,2048)); qa.paste(target,(0,0)); qa.paste(Image.open(inp/'reference_aligned_v15.png').convert('RGB'),(2048,0)); qa.paste(raw,(4096,0)); qa.paste(outim,(6144,0)); qa.thumbnail((2000,500)); qa.save(outdir/'qa_target_reference_raw_safe_512.jpg',quality=94)
              assert outside==0 and protected_changes==0
          else:
              verdict['status']='INFERENCE_BLOCKED'
          verdict['promotion']='NOT_PROMOTED_PENDING_VISUAL_QA_AND_FULL_IMAGE_REGRESSION'
          (root/'leftrefill_verdict.json').write_text(json.dumps(verdict,indent=2)); print(json.dumps(verdict,indent=2))
          PY

      - name: Upload LeftRefill 512 validation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hao-hair-leftrefill-probe-v07
          path: |
            work/leftrefill_wrapper_commit.txt
            work/environment.log
            work/cpu_probe_patch.diff
            work/ddim_cpu_patch.diff
            work/leftrefill_input_report.json
            work/leftrefill_inputs/*
            work/leftrefill_inference.log
            work/leftrefill_verdict.json
            work/leftrefill_output/*
          if-no-files-found: warn
          retention-days: 7
