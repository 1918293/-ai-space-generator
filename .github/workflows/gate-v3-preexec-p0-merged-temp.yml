name: Gate v3 Pre-Execution P0 Merged Stack Temp

on:
  push:
    branches:
      - temp/gate-v3-preexec-interface-p0-merged-20261023
    paths:
      - ai-space-generator/src/execution_control.py
      - ai-space-generator/src/control_gateway.py
      - ai-space-generator/src/controlled_runner.py
      - ai-space-generator/tests/test_controlled_runner.py
      - ai-space-generator/tests/test_control_gateway.py
      - .github/workflows/gate-v3-preexec-p0-merged-temp.yml

permissions:
  contents: read

jobs:
  runtime-promotion-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: ai-space-generator
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: ai-space-generator/requirements-control.txt
      - name: Install Runtime v2 dependencies
        run: python -m pip install --upgrade pytest -r requirements-control.txt
      - name: Compile changed control modules
        run: python -m py_compile src/execution_control.py src/control_gateway.py src/controlled_runner.py
      - name: Run complete Runtime v2 regression surface
        run: >-
          python -m pytest tests -q
          --ignore=tests/test_core.py
          --ignore=tests/test_validation.py
          --ignore=tests/test_multiview_donor_admission.py

  legacy-app-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: ai-space-generator
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: ai-space-generator/requirements.txt
      - name: Install legacy application dependencies
        run: python -m pip install --upgrade pytest -r requirements.txt
      - name: Run legacy + merged Gate-v3 regression surface
        run: python -m pytest tests/test_core.py tests/test_validation.py tests/test_multiview_donor_admission.py -q
