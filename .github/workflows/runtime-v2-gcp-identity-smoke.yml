name: Runtime v2 GCP Identity Smoke

on:
  push:
    branches:
      - exp/execution-control-plane-v1
    paths:
      - .github/workflows/runtime-v2-gcp-identity-smoke.yml
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: runtime-v2-gcp-identity-smoke
  cancel-in-progress: false

jobs:
  identity-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Fail closed on trusted shared ref
        shell: bash
        run: |
          set -euo pipefail
          test "${GITHUB_REF}" = "refs/heads/exp/execution-control-plane-v1"

      - name: Authenticate with Google Workload Identity Federation
        id: auth
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          project_id: oceanic-toolbox-386903
          workload_identity_provider: projects/786667867165/locations/global/workloadIdentityPools/hao-runtime-v2-github/providers/shared-exp
          service_account: hao-runtime-v2-deployer@oceanic-toolbox-386903.iam.gserviceaccount.com
          token_format: access_token
          create_credentials_file: false

      - name: Verify short-lived token without project mutation
        env:
          ACCESS_TOKEN: ${{ steps.auth.outputs.access_token }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "${ACCESS_TOKEN}"
          python - <<'PY'
          import json, os, urllib.parse, urllib.request
          token = os.environ["ACCESS_TOKEN"]
          url = "https://oauth2.googleapis.com/tokeninfo?" + urllib.parse.urlencode({"access_token": token})
          with urllib.request.urlopen(url, timeout=20) as response:
              data = json.load(response)
          expires = int(data.get("expires_in", "0"))
          if expires <= 0:
              raise SystemExit("token is not live")
          print("WIF_TOKEN_VALID=true")
          print(f"TOKEN_EXPIRES_IN_SECONDS={expires}")
          print("PROJECT_ID=oceanic-toolbox-386903")
          print("PROJECT_NUMBER=786667867165")
          print("RESULT=GITHUB_GCP_IDENTITY_SMOKE_PASS")
          PY

      - name: Verify zero-cost bridge has no project mutation authority
        env:
          ACCESS_TOKEN: ${{ steps.auth.outputs.access_token }}
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os, urllib.request

          requested = [
              "resourcemanager.projects.get",
              "resourcemanager.projects.getIamPolicy",
              "resourcemanager.projects.setIamPolicy",
              "serviceusage.services.enable",
              "storage.buckets.create",
              "iam.serviceAccounts.create",
              "iam.serviceAccounts.setIamPolicy",
              "iam.workloadIdentityPools.create",
              "artifactregistry.repositories.create",
              "run.services.create",
              "cloudsql.instances.create",
              "compute.networks.create",
              "secretmanager.secrets.create",
          ]

          req = urllib.request.Request(
              "https://cloudresourcemanager.googleapis.com/v1/projects/oceanic-toolbox-386903:testIamPermissions",
              data=json.dumps({"permissions": requested}).encode(),
              headers={
                  "Authorization": "Bearer " + os.environ["ACCESS_TOKEN"],
                  "Content-Type": "application/json",
              },
              method="POST",
          )
          with urllib.request.urlopen(req, timeout=20) as response:
              data = json.load(response)

          granted = sorted(data.get("permissions", []))
          print("GRANTED_PROJECT_PERMISSIONS=" + json.dumps(granted))
          if granted:
              raise SystemExit(
                  "unexpected project authority on identity-only deployer: "
                  + ",".join(granted)
              )
          print("PROJECT_MUTATION_AUTHORITY=NONE")
          print("RESULT=ZERO_COST_IDENTITY_BOUNDARY_PASS")
          PY
