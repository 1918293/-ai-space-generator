name: Runtime v2 R062 second blockers candidate

on:
  push:
    branches:
      - exp/runtime-v2-r062-second-blockers

permissions:
  contents: write

concurrency:
  group: runtime-v2-r062-second-blockers-candidate
  cancel-in-progress: false

jobs:
  materialize-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Materialize bounded R-062 corrections when absent
        run: |
          set -euo pipefail
          if grep -q 'resource "google_cloud_run_v2_job" "migration"' ai-space-generator/deploy/terraform/runtime-v2/cloud_run.tf; then
            echo "R-062 source already materialized on this commit; reuse it."
          else
            python .github/scripts/materialize_r062_second_blockers.py
            python .github/scripts/fix_r062_worker_otel.py
          fi

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4
        with:
          terraform_version: "1.14.9"
          terraform_wrapper: false

      - name: Format and validate affected Terraform surface
        working-directory: ai-space-generator/deploy/terraform/runtime-v2
        run: |
          set -euo pipefail
          terraform fmt -recursive
          terraform fmt -check -recursive
          terraform init -backend=false -input=false
          terraform validate -no-color
          terraform test -no-color

      - name: Run focused migration regression
        working-directory: ai-space-generator
        run: |
          set -euo pipefail
          python -m pip install --upgrade pytest
          python -m pytest tests/test_runtime_migrations.py -q

      - name: Verify retired and added seams
        run: |
          set -euo pipefail
          ! grep -R "otel_exporter_otlp_endpoint\|OTEL_EXPORTER_OTLP_ENDPOINT" ai-space-generator/deploy/terraform/runtime-v2 ai-space-generator/deploy/otel-collector.yaml
          grep -q "telemetry.googleapis.com:443" ai-space-generator/deploy/otel-collector.yaml
          grep -q 'resource "google_cloud_run_v2_job" "migration"' ai-space-generator/deploy/terraform/runtime-v2/cloud_run.tf
          grep -q 'output "cloud_sql_private_ip"' ai-space-generator/deploy/terraform/runtime-v2/outputs.tf
          grep -q "HAO_RUNTIME_MIGRATION_VERIFIED" ai-space-generator/src/runtime_migrations.py

      - name: Commit verified non-workflow source only
        run: |
          set -euo pipefail
          rm -f .github/workflows/runtime-v2-image-publish.yml .github/workflows/runtime-v2-migration-execute.yml
          rm -f ai-space-generator/deploy/terraform/runtime-v2/.terraform.lock.hcl
          rm -rf ai-space-generator/src/__pycache__ ai-space-generator/tests/__pycache__
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            ai-space-generator/deploy/otel-collector.yaml \
            ai-space-generator/deploy/terraform/runtime-v2/variables.tf \
            ai-space-generator/deploy/terraform/runtime-v2/main.tf \
            ai-space-generator/deploy/terraform/runtime-v2/cloud_run.tf \
            ai-space-generator/deploy/terraform/runtime-v2/outputs.tf \
            ai-space-generator/deploy/terraform/runtime-v2/staged_inputs.tftest.hcl \
            ai-space-generator/deploy/terraform/runtime-v2/cloud_run_rollout.tftest.hcl \
            ai-space-generator/deploy/terraform/runtime-v2/cloud_sql_edition.tftest.hcl \
            ai-space-generator/deploy/terraform/runtime-v2/README.md \
            ai-space-generator/src/runtime_migrations.py \
            ai-space-generator/tests/test_runtime_migrations.py
          git diff --cached --check
          if git diff --cached --quiet; then
            echo "No source delta to commit."
            exit 0
          fi
          git commit -m "EXP: materialize Runtime deployment second-blocker fixes [r062-materialized]"
          git push origin "HEAD:${GITHUB_REF_NAME}"
