name: Runtime v2 R062 second blockers candidate

on:
  push:
    branches:
      - exp/runtime-v2-r062-second-blockers

permissions:
  contents: write

concurrency:
  group: runtime-v2-r062-second-blockers-candidate
  cancel-in-progress: false

jobs:
  materialize-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Materialize bounded R-062 corrections
        run: python .github/scripts/materialize_r062_second_blockers.py

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4
        with:
          terraform_version: "1.14.9"
          terraform_wrapper: false

      - name: Format and validate affected Terraform surface
        working-directory: ai-space-generator/deploy/terraform/runtime-v2
        run: |
          set -euo pipefail
          terraform fmt -recursive
          terraform fmt -check -recursive
          terraform init -backend=false -input=false
          terraform validate -no-color
          terraform test -no-color

      - name: Run focused migration regression
        working-directory: ai-space-generator
        run: |
          set -euo pipefail
          python -m pip install --upgrade pytest
          python -m pytest tests/test_runtime_migrations.py -q

      - name: Verify retired and added seams
        run: |
          set -euo pipefail
          ! grep -R "otel_exporter_otlp_endpoint\|OTEL_EXPORTER_OTLP_ENDPOINT" ai-space-generator/deploy/terraform/runtime-v2 ai-space-generator/deploy/otel-collector.yaml
          grep -q "telemetry.googleapis.com:443" ai-space-generator/deploy/otel-collector.yaml
          grep -q 'resource "google_cloud_run_v2_job" "migration"' ai-space-generator/deploy/terraform/runtime-v2/cloud_run.tf
          grep -q 'output "cloud_sql_private_ip"' ai-space-generator/deploy/terraform/runtime-v2/outputs.tf
          grep -q "HAO_RUNTIME_MIGRATION_VERIFIED" ai-space-generator/src/runtime_migrations.py

      - name: Materialize verified source and retire candidate carrier
        run: |
          set -euo pipefail
          rm .github/workflows/runtime-v2-r062-second-blockers-candidate.yml
          rm .github/scripts/materialize_r062_second_blockers.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "EXP: materialize Runtime deployment second-blocker fixes [r062-materialized]"
          git push origin "HEAD:${GITHUB_REF_NAME}"
