name: Hao Activepieces Live Provider FAM

on:
  push:
    branches:
      - exp/hao-system-control-render
    paths:
      - '.github/workflows/hao-activepieces-live-provider-fam.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  activepieces-live-provider-fam:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Pull exact official runtime image
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p activepieces-fam-output
          docker pull activepieces/activepieces:latest
          IMAGE_DIGEST="$(docker image inspect activepieces/activepieces:latest --format '{{index .RepoDigests 0}}')"
          test -n "$IMAGE_DIGEST"
          echo "IMAGE_DIGEST=$IMAGE_DIGEST" >> "$GITHUB_ENV"
          printf '%s\n' "$IMAGE_DIGEST" > activepieces-fam-output/image-digest.txt
          echo "activepieces_image_digest=$IMAGE_DIGEST"

      - name: Start ephemeral Activepieces provider
        shell: bash
        run: |
          set -euo pipefail
          docker run -d --rm \
            --name hao-activepieces-live-fam \
            -p 8080:80 \
            -e AP_DB_TYPE=PGLITE \
            -e AP_REDIS_TYPE=MEMORY \
            -e AP_FRONTEND_URL=http://localhost:8080 \
            -e AP_PIECES_SYNC_MODE=OFFICIAL_AUTO \
            activepieces/activepieces:latest

          ready=0
          for i in $(seq 1 120); do
            if curl -fsS http://127.0.0.1:8080/api/v1/health > activepieces-fam-output/health.json 2>/dev/null; then
              ready=1
              break
            fi
            sleep 2
          done
          if [ "$ready" -ne 1 ]; then
            echo 'Activepieces provider did not become healthy in time' >&2
            docker logs --tail 200 hao-activepieces-live-fam 2>&1 | sed -E 's/(token|password|secret)([=: ]+)[^ ,}]*/\1\2[REDACTED]/Ig' >&2 || true
            exit 1
          fi
          echo 'activepieces_health=PASS'

      - name: Execute real provider run and tag-filter readback
        shell: bash
        env:
          GITHUB_RUN_ID_VALUE: ${{ github.run_id }}
        run: |
          set -euo pipefail
          FAM_PASSWORD="$(openssl rand -hex 18)Aa1!"
          echo "::add-mask::$FAM_PASSWORD"
          export FAM_PASSWORD

          cat > /tmp/activepieces-live-fam.mjs <<'NODE'
          import fs from 'node:fs';
          import assert from 'node:assert/strict';
          import { buildPreflightFromActivepieces, normalizeActivepiecesRun } from './hao-cloud-runtime/activepieces-active-work.mjs';

          const BASE = 'http://127.0.0.1:8080/api/v1';
          const runId = process.env.GITHUB_RUN_ID_VALUE ?? 'local';
          const syntheticEmail = `hao-live-fam-${runId}@example.test`;
          const password = process.env.FAM_PASSWORD;
          const tags = {
            runKey: `hao:run-key=LIVE-FAM-${runId}`,
            objective: 'hao:objective=ACTIVEPIECES_LIVE_FAM',
            target: 'hao:target=SYNTHETIC_TARGET',
            lane: 'hao:lane=GITHUB_ACTIONS_EPHEMERAL',
          };
          const expectedTags = Object.values(tags);
          const report = {
            schema: 'hao-activepieces-live-provider-fam-v1',
            providerRole: 'ACTIVE_WORK_SIGNAL_ONLY',
            authority: 'NONE',
            formalAuthorityMutation: false,
            globalTaskDatabaseCreated: false,
            imageDigest: process.env.IMAGE_DIGEST ?? null,
            githubRunId: runId,
            phases: {},
          };

          const sleep = (ms) => new Promise(r => setTimeout(r, ms));
          function listData(value) {
            if (Array.isArray(value)) return value;
            if (value && Array.isArray(value.data)) return value.data;
            if (value && Array.isArray(value.items)) return value.items;
            return [];
          }
          async function api(path, { method = 'GET', token, body, allowed = [200, 201, 204] } = {}) {
            const headers = { accept: 'application/json' };
            if (body !== undefined) headers['content-type'] = 'application/json';
            if (token) headers.authorization = `Bearer ${token}`;
            const response = await fetch(`${BASE}${path}`, {
              method,
              headers,
              body: body === undefined ? undefined : JSON.stringify(body),
              signal: AbortSignal.timeout(60_000),
            });
            const text = await response.text();
            let parsed = null;
            if (text) {
              try { parsed = JSON.parse(text); }
              catch { parsed = text; }
            }
            if (!allowed.includes(response.status)) {
              const safe = typeof parsed === 'string' ? parsed.slice(0, 500) : parsed;
              throw new Error(`${method} ${path} -> ${response.status}: ${JSON.stringify(safe)}`);
            }
            return parsed;
          }

          // Fresh ephemeral provider: first account is synthetic and disappears with the container.
          let auth = await api('/authentication/sign-up', {
            method: 'POST',
            body: {
              email: syntheticEmail,
              password,
              firstName: 'Hao',
              lastName: 'LiveFAM',
              trackEvents: false,
              newsLetter: false,
            },
          });
          let token = auth?.token;
          let projectId = auth?.projectId;
          assert.ok(token, 'sign-up did not return a token');

          if (!projectId) {
            const platform = await api('/platforms', {
              method: 'POST',
              token,
              body: { name: 'Hao Live FAM' },
            });
            token = platform?.token;
            projectId = platform?.projectId;
            assert.ok(token && projectId, 'platform onboarding did not return user token/projectId');
          }
          report.phases.authentication = 'PASS';
          report.projectId = projectId;

          // Piece sync is provider-native; do not hardcode current versions.
          let webhookMeta = null;
          let tagsMeta = null;
          for (let i = 0; i < 300; i += 1) {
            const pieces = listData(await api('/pieces'));
            webhookMeta = pieces.find(p => p?.name === '@activepieces/piece-webhook') ?? null;
            tagsMeta = pieces.find(p => p?.name === '@activepieces/piece-tags') ?? null;
            if (webhookMeta && tagsMeta) break;
            await sleep(1000);
          }
          assert.ok(webhookMeta, 'webhook piece not synced');
          assert.ok(tagsMeta, 'tags piece not synced');
          const versionOf = (p) => p?.version ?? p?.pieceVersion ?? p?.metadata?.version;
          const rangeVersion = (v) => {
            assert.equal(typeof v, 'string', 'piece version missing');
            return v.startsWith('~') ? v : `~${v}`;
          };
          const webhookVersion = rangeVersion(versionOf(webhookMeta));
          const tagsVersion = rangeVersion(versionOf(tagsMeta));
          report.phases.pieceSync = 'PASS';
          report.pieceVersions = {
            webhook: webhookVersion,
            tags: tagsVersion,
          };

          const flow = await api(`/flows?projectId=${encodeURIComponent(projectId)}`, {
            method: 'POST', token,
            body: { displayName: `Hao Live FAM ${runId}`, projectId },
          });
          const flowId = flow?.id;
          assert.ok(flowId, 'flow create did not return id');
          report.flowId = flowId;

          const actionNode = (name, displayName, tag, nextAction = undefined) => ({
            name,
            skip: false,
            type: 'PIECE',
            valid: true,
            settings: {
              input: { name: tag },
              pieceName: '@activepieces/piece-tags',
              actionName: 'add_tag',
              pieceVersion: tagsVersion,
              sampleData: {},
              propertySettings: { name: { type: 'MANUAL' } },
              errorHandlingOptions: {
                retryOnFailure: { value: false },
                continueOnFailure: { value: false },
              },
            },
            displayName,
            ...(nextAction ? { nextAction } : {}),
          });

          let chain;
          const ordered = [
            ['step_1', 'Tag RUN_KEY', tags.runKey],
            ['step_2', 'Tag Objective', tags.objective],
            ['step_3', 'Tag Target', tags.target],
            ['step_4', 'Tag Lane', tags.lane],
          ];
          for (let i = ordered.length - 1; i >= 0; i -= 1) {
            const [name, label, tag] = ordered[i];
            chain = actionNode(name, label, tag, chain);
          }

          await api(`/flows/${encodeURIComponent(flowId)}`, {
            method: 'POST', token,
            body: {
              type: 'IMPORT_FLOW',
              request: {
                displayName: `Hao Live FAM ${runId}`,
                schemaVersion: '17',
                notes: [],
                trigger: {
                  name: 'trigger',
                  valid: true,
                  displayName: 'Catch Webhook',
                  type: 'PIECE_TRIGGER',
                  settings: {
                    pieceName: '@activepieces/piece-webhook',
                    pieceVersion: webhookVersion,
                    triggerName: 'catch_webhook',
                    input: { authType: 'none', authFields: {} },
                    propertySettings: {
                      authType: { type: 'MANUAL' },
                      authFields: { type: 'MANUAL', schema: {} },
                      liveMarkdown: { type: 'MANUAL' },
                      syncMarkdown: { type: 'MANUAL' },
                      testMarkdown: { type: 'MANUAL' },
                    },
                    sampleData: {},
                  },
                  nextAction: chain,
                },
              },
            },
          });
          await api(`/flows/${encodeURIComponent(flowId)}`, {
            method: 'POST', token,
            body: { type: 'LOCK_AND_PUBLISH', request: {} },
          });
          await api(`/flows/${encodeURIComponent(flowId)}`, {
            method: 'POST', token,
            body: { type: 'CHANGE_STATUS', request: { status: 'ENABLED' } },
          });

          let enabled = false;
          for (let i = 0; i < 60; i += 1) {
            const current = await api(`/flows/${encodeURIComponent(flowId)}`, { token });
            if (current?.status === 'ENABLED') { enabled = true; break; }
            await sleep(1000);
          }
          assert.equal(enabled, true, 'flow did not become ENABLED');
          report.phases.flowPublishEnable = 'PASS';

          const webhookResponse = await fetch(`${BASE}/webhooks/${encodeURIComponent(flowId)}`, {
            method: 'POST',
            headers: { 'content-type': 'application/json' },
            body: JSON.stringify({ probe: 'hao-activepieces-live-fam', runId }),
            signal: AbortSignal.timeout(60_000),
          });
          assert.ok(webhookResponse.status >= 200 && webhookResponse.status < 300, `webhook returned ${webhookResponse.status}`);
          report.webhookHttpStatus = webhookResponse.status;

          let providerRun = null;
          for (let i = 0; i < 120; i += 1) {
            const params = new URLSearchParams({ projectId, flowId, limit: '20' });
            const page = await api(`/flow-runs?${params.toString()}`, { token });
            const runs = listData(page);
            if (runs.length > 0) {
              const candidate = runs.find(r => Array.isArray(r?.tags) && r.tags.includes(tags.runKey)) ?? runs[0];
              if (candidate?.status && !['RUNNING', 'QUEUED', 'PAUSED'].includes(candidate.status)) {
                providerRun = candidate;
                break;
              }
            }
            await sleep(1000);
          }
          assert.ok(providerRun, 'no terminal flow run observed');
          assert.equal(providerRun.status, 'SUCCEEDED', `flow run status=${providerRun.status}`);
          for (const tag of expectedTags) assert.ok(providerRun.tags?.includes(tag), `missing provider tag ${tag}`);
          report.providerRun = {
            id: providerRun.id,
            projectId: providerRun.projectId,
            flowId: providerRun.flowId,
            status: providerRun.status,
            tags: providerRun.tags,
            created: providerRun.created,
            updated: providerRun.updated,
            startTime: providerRun.startTime,
            finishTime: providerRun.finishTime,
          };
          report.phases.realFlowRun = 'PASS';

          // Prove server-side provider lookup by the RUN_KEY tag, not local filtering.
          const filterParams = new URLSearchParams({ projectId, flowId, limit: '20' });
          filterParams.append('tags', tags.runKey);
          const filteredPage = await api(`/flow-runs?${filterParams.toString()}`, { token });
          const filteredRuns = listData(filteredPage);
          assert.ok(filteredRuns.some(r => r?.id === providerRun.id), 'server-side tag-filtered list did not return the run');
          assert.ok(filteredRuns.every(r => Array.isArray(r?.tags) && r.tags.includes(tags.runKey)), 'tag-filter response contained a non-matching run');
          report.phases.serverSideTagFilter = 'PASS';
          report.filteredRunCount = filteredRuns.length;

          // Provider success alone is deliberately insufficient for Hao completion semantics.
          const candidate = {
            runKey: `LIVE-FAM-${runId}`,
            objective: 'ACTIVEPIECES_LIVE_FAM',
            target: 'SYNTHETIC_TARGET',
          };
          const normalizedWithoutReadback = normalizeActivepiecesRun(providerRun, candidate, { nowMs: Date.now() });
          assert.equal(normalizedWithoutReadback.status, 'UNKNOWN');
          assert.equal(normalizedWithoutReadback.relation, 'SAME_OBJECTIVE');

          const basePreflight = {
            action: 'LIVE_PROVIDER_FAM',
            freshStateRead: true,
            currentStateResolved: true,
            targetIdentityVerified: true,
            consequential: true,
            necessityEstablished: true,
            currentFingerprint: 'v1',
            desiredFingerprint: 'v2',
            validationPlanReady: true,
            selectedValidationEvidence: ['PROVIDER_READBACK'],
          };
          const failClosed = buildPreflightFromActivepieces({
            runs: [providerRun], candidate, preflight: basePreflight,
          });
          assert.equal(failClosed.decision, 'BLOCKED_ACTIVE_WORK_VISIBILITY_UNKNOWN');

          // This second check is an adapter integration assertion only: a caller may set this bit
          // only after an independent same-target readback. We do not claim the tag-only flow made a governed side effect.
          const withIndependentSyntheticReadback = buildPreflightFromActivepieces({
            runs: [providerRun],
            candidate: { ...candidate, targetReadbackVerifiedSatisfied: true },
            preflight: basePreflight,
          });
          assert.equal(withIndependentSyntheticReadback.decision, 'NO_OP_ACTIVE_WORK_COMPLETED_SAME_OBJECTIVE');
          report.phases.haoAdapter = {
            providerSuccessWithoutReadback: failClosed.decision,
            withIndependentSyntheticReadback: withIndependentSyntheticReadback.decision,
            note: 'Second assertion validates adapter integration only; no governed target side effect is claimed by this tag-only flow.',
          };

          report.result = 'PASS';
          fs.writeFileSync('activepieces-fam-output/report.json', JSON.stringify(report, null, 2));
          console.log(JSON.stringify({
            event: 'hao_activepieces_live_provider_fam',
            result: report.result,
            imageDigest: report.imageDigest,
            flowRunStatus: report.providerRun.status,
            providerTags: report.providerRun.tags.length,
            serverSideTagFilter: report.phases.serverSideTagFilter,
            providerSuccessWithoutReadback: report.phases.haoAdapter.providerSuccessWithoutReadback,
            independentReadbackAdapterDecision: report.phases.haoAdapter.withIndependentSyntheticReadback,
            authority: report.authority,
            formalAuthorityMutation: report.formalAuthorityMutation,
          }, null, 2));
          NODE

          node /tmp/activepieces-live-fam.mjs

      - name: Stop ephemeral provider
        if: always()
        shell: bash
        run: |
          docker rm -f hao-activepieces-live-fam >/dev/null 2>&1 || true

      - name: Upload bounded non-sensitive evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hao-activepieces-live-provider-fam-${{ github.run_id }}
          path: activepieces-fam-output/
          if-no-files-found: warn
          retention-days: 1
