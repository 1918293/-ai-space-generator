name: Hao Activepieces Real LLM FAM

on:
  push:
    branches: [exp/hao-activepieces-idempotency-fam]
    paths:
      - '.github/workflows/hao-activepieces-live-provider-fam.yml'
      - 'hao-cloud-runtime/activepieces-gemini-posthog-fam-runner.mjs'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  activepieces-real-llm-fam:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      ACTIVEPIECES_IMAGE: activepieces/activepieces@sha256:65ea85f5e7ea236416b342eef0d2dbade8da51247aaea495d191eb027095805a
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      POSTHOG_PROJECT_API_KEY: ${{ secrets.POSTHOG_PROJECT_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - name: Start isolated Activepieces provider
        shell: bash
        run: |
          set -euo pipefail
          docker pull "$ACTIVEPIECES_IMAGE"
          JWT_SECRET="$(openssl rand -hex 32)"
          WORKER_TOKEN="$(JWT_SECRET="$JWT_SECRET" node <<'NODE'
          const crypto=require('crypto'); const enc=v=>Buffer.from(JSON.stringify(v)).toString('base64url'); const now=Math.floor(Date.now()/1000); const h={alg:'HS256',typ:'JWT',kid:'1'}; const p={id:crypto.randomUUID(),type:'WORKER',iat:now,exp:now+86400,iss:'activepieces'}; const u=`${enc(h)}.${enc(p)}`; process.stdout.write(`${u}.${crypto.createHmac('sha256',process.env.JWT_SECRET).update(u).digest('base64url')}`)
          NODE
          )"
          echo "::add-mask::$JWT_SECRET"; echo "::add-mask::$WORKER_TOKEN"
          docker run -d --rm --name hao-activepieces-real-llm-fam -p 8080:80 \
            -e AP_DB_TYPE=PGLITE -e AP_REDIS_TYPE=MEMORY -e AP_FRONTEND_URL=http://127.0.0.1:80 \
            -e AP_PIECES_SYNC_MODE=NONE -e AP_TELEMETRY_ENABLED=false \
            -e AP_JWT_SECRET="$JWT_SECRET" -e AP_WORKER_TOKEN="$WORKER_TOKEN" "$ACTIVEPIECES_IMAGE"
          ready=0
          for i in $(seq 1 120); do if curl -fsS http://127.0.0.1:8080/api/v1/health >/dev/null 2>&1; then ready=1; break; fi; sleep 2; done
          test "$ready" -eq 1
          echo activepieces_health=PASS
      - name: Execute Activepieces to Gemini to PostHog FAM
        env:
          GITHUB_RUN_ID_VALUE: ${{ github.run_id }}
        run: node hao-cloud-runtime/activepieces-gemini-posthog-fam-runner.mjs
      - name: Provider diagnostics
        if: always()
        run: docker logs hao-activepieces-real-llm-fam 2>&1 | tail -n 300 || true
      - name: Stop provider
        if: always()
        run: docker rm -f hao-activepieces-real-llm-fam >/dev/null 2>&1 || true

# FAM execution trigger: real Activepieces -> Gemini Free Tier -> PostHog verification
