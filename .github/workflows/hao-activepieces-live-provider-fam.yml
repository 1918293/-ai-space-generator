name: Hao Activepieces Live Provider FAM

on:
  push:
    branches:
      - exp/hao-system-control-render
    paths:
      - '.github/workflows/hao-activepieces-live-provider-fam.yml'
      - 'hao-cloud-runtime/activepieces-live-provider-fam-runner.mjs'
      - 'hao-cloud-runtime/activepieces-active-work.mjs'
      - 'hao-cloud-runtime/maintenance-preflight.mjs'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  activepieces-live-provider-fam:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      ACTIVEPIECES_IMAGE: activepieces/activepieces@sha256:65ea85f5e7ea236416b342eef0d2dbade8da51247aaea495d191eb027095805a
    steps:
      - uses: actions/checkout@v4

      - name: Pull exact official runtime image
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p activepieces-fam-output
          docker pull "$ACTIVEPIECES_IMAGE"
          IMAGE_DIGEST="$(docker image inspect "$ACTIVEPIECES_IMAGE" --format '{{index .RepoDigests 0}}')"
          test -n "$IMAGE_DIGEST"
          echo "IMAGE_DIGEST=$IMAGE_DIGEST" >> "$GITHUB_ENV"
          printf '%s\n' "$IMAGE_DIGEST" > activepieces-fam-output/image-digest.txt
          echo "activepieces_image_digest=$IMAGE_DIGEST"

      - name: Start ephemeral Activepieces provider
        shell: bash
        run: |
          set -euo pipefail
          docker run -d --rm \
            --name hao-activepieces-live-fam \
            -p 8080:80 \
            -e AP_DB_TYPE=PGLITE \
            -e AP_REDIS_TYPE=MEMORY \
            -e AP_FRONTEND_URL=http://localhost:8080 \
            -e AP_PIECES_SYNC_MODE=NONE \
            -e AP_TELEMETRY_ENABLED=false \
            "$ACTIVEPIECES_IMAGE"
          ready=0
          for i in $(seq 1 120); do
            if curl -fsS http://127.0.0.1:8080/api/v1/health > activepieces-fam-output/health.json 2>/dev/null; then
              ready=1
              break
            fi
            sleep 2
          done
          test "$ready" -eq 1
          echo 'activepieces_health=PASS'

      - name: Execute real provider run and tag-filter readback
        shell: bash
        env:
          GITHUB_RUN_ID_VALUE: ${{ github.run_id }}
        run: |
          set -euo pipefail
          FAM_CREDENTIAL="$(openssl rand -hex 18)Aa1!"
          echo "::add-mask::$FAM_CREDENTIAL"
          export FAM_CREDENTIAL
          node hao-cloud-runtime/activepieces-live-provider-fam-runner.mjs

      - name: Capture bounded provider diagnostics
        if: always()
        shell: bash
        run: docker logs hao-activepieces-live-fam > activepieces-fam-output/provider.log 2>&1 || true

      - name: Stop ephemeral provider
        if: always()
        shell: bash
        run: docker rm -f hao-activepieces-live-fam >/dev/null 2>&1 || true

      - name: Upload bounded non-sensitive evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hao-activepieces-live-provider-fam-${{ github.run_id }}
          path: activepieces-fam-output/
          if-no-files-found: warn
          retention-days: 1
