name: Salon Hugging Face Zero Probe

on:
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/salon-hf-zero-validation.yml"
      - "experiments/salon-reconstruction/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe-zero-routes:
    name: qwen-zero-route-validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install clients
        run: python -m pip install --disable-pip-version-check gradio_client pillow

      - name: Probe official Qwen Space contract
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from gradio_client import Client

          client = Client("Qwen/Qwen-Image-Edit-2511", verbose=False)
          api = client.view_api(return_format="dict")
          endpoint = (api.get("named_endpoints") or {}).get("/infer")
          if endpoint is None:
              raise SystemExit("Official Qwen /infer endpoint not discovered")
          print("Official Qwen Space API contract: PASS")
          PY

      - name: Record official Qwen Zero duration gate
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          from PIL import Image
          from gradio_client import Client, handle_file
          from gradio_client.exceptions import AppError

          p = Path('/tmp/official-qwen-probe.png')
          Image.new('RGB', (256, 256), (100, 100, 100)).save(p)
          images = [{"image": handle_file(str(p))}]
          client = Client("Qwen/Qwen-Image-Edit-2511", verbose=False)
          try:
              client.predict(
                  images,
                  "Keep this synthetic image unchanged.",
                  47, False, 1.0, 1, 256, 256, False,
                  api_name="/infer",
              )
          except AppError as exc:
              message = str(exc)
              if "GPU duration" in message and "maximum allowed" in message:
                  print("Official Qwen Zero route: KNOWN_DURATION_POLICY_BLOCK")
              else:
                  raise
          else:
              print("Official Qwen Zero route unexpectedly executed: PASS")
          PY

      - name: Probe fast Qwen 2511 Zero route and run synthetic inference
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import base64
          import io
          import json
          from PIL import Image, ImageDraw
          from gradio_client import Client

          space = "prithivMLmods/Qwen-Image-Edit-2511-LoRAs-Fast"
          client = Client(space, verbose=False)
          api = client.view_api(return_format="dict")
          named = api.get("named_endpoints") or {}
          endpoint = None
          for candidate in ("/edit_image", "edit_image"):
              if candidate in named:
                  endpoint = candidate
                  break
          if endpoint is None:
              keys = list(named.keys())
              endpoint = next((k for k in keys if "edit_image" in k), None)
          if endpoint is None:
              raise SystemExit(f"Fast Space edit endpoint not found: {list(named)}")
          print(f"Fast Qwen Zero endpoint: {endpoint}")

          def to_b64(im):
              buf = io.BytesIO()
              im.save(buf, format='PNG')
              return 'data:image/png;base64,' + base64.b64encode(buf.getvalue()).decode('ascii')

          source = Image.new('RGB', (256, 256), (220, 210, 200))
          d = ImageDraw.Draw(source)
          d.ellipse((92, 28, 164, 100), fill=(170, 125, 95))
          d.rectangle((72, 96, 184, 232), fill=(45, 45, 45))

          garment = Image.new('RGB', (256, 256), (42, 42, 42))
          gd = ImageDraw.Draw(garment)
          gd.text((60, 112), 'CALIFORNIA', fill=(235, 210, 190))

          structure = Image.new('RGB', (256, 256), 'black')
          sd = ImageDraw.Draw(structure)
          sd.line([(128, 36), (128, 208)], fill='white', width=6)
          sd.line([(128, 92), (88, 142)], fill='white', width=6)
          sd.line([(128, 92), (168, 142)], fill='white', width=6)

          images_json = json.dumps([to_b64(source), to_b64(garment), to_b64(structure)])
          result = client.predict(
              images_json,
              "Keep the first synthetic subject recognizable. Use image 2 as garment reference and image 3 as structure guidance. Produce a coherent realistic image.",
              "Studio-DeLight",
              47,
              False,
              1.0,
              1,
              api_name=endpoint,
          )
          if not result:
              raise SystemExit("Fast Qwen Zero route returned no result")
          print("Fast Qwen 2511 Zero one-step synthetic inference: PASS")
          PY
