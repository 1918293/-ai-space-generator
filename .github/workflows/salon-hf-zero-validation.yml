name: Salon Hugging Face Zero Probe

on:
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/salon-hf-zero-validation.yml"
      - "experiments/salon-reconstruction/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe-official-qwen-space:
    name: official-qwen-space-api-probe
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install Gradio client
        run: python -m pip install --disable-pip-version-check gradio_client

      - name: Probe official Qwen Zero Space API
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from gradio_client import Client

          client = Client("Qwen/Qwen-Image-Edit-2511", verbose=False)
          api = client.view_api(return_format="dict")
          print(json.dumps(api, indent=2, default=str))
          text = json.dumps(api, default=str)
          if "infer" not in text.lower() and "predict" not in text.lower():
              raise SystemExit("No callable inference endpoint discovered")
          print("Official Qwen Zero Space API probe: PASS")
          PY
