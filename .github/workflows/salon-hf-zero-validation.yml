name: Salon Hugging Face Zero Probe

on:
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/salon-hf-zero-validation.yml"
      - "experiments/salon-reconstruction/run_hf_zero_fast_salon.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe-zero-routes:
    name: qwen-zero-route-validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install clients
        run: python -m pip install --disable-pip-version-check gradio_client pillow

      - name: Probe official Qwen Space contract
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from gradio_client import Client

          client = Client("Qwen/Qwen-Image-Edit-2511", verbose=False)
          api = client.view_api(return_format="dict")
          endpoint = (api.get("named_endpoints") or {}).get("/infer")
          if endpoint is None:
              raise SystemExit("Official Qwen /infer endpoint not discovered")
          print("Official Qwen Space API contract: PASS")
          PY

      - name: Record official Qwen Zero duration gate
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          from PIL import Image
          from gradio_client import Client, handle_file
          from gradio_client.exceptions import AppError

          p = Path('/tmp/official-qwen-probe.png')
          Image.new('RGB', (256, 256), (100, 100, 100)).save(p)
          images = [{"image": handle_file(str(p))}]
          client = Client("Qwen/Qwen-Image-Edit-2511", verbose=False)
          try:
              client.predict(
                  images,
                  "Keep this synthetic image unchanged.",
                  47, False, 1.0, 1, 256, 256, False,
                  api_name="/infer",
              )
          except AppError as exc:
              message = str(exc)
              if "GPU duration" in message and "maximum allowed" in message:
                  print("Official Qwen Zero route: KNOWN_DURATION_POLICY_BLOCK")
              else:
                  raise
          else:
              print("Official Qwen Zero route unexpectedly executed: PASS")
          PY

      - name: Build synthetic Salon pack
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/salon-zero-pack /tmp/salon-zero-output
          python - <<'PY'
          from pathlib import Path
          from PIL import Image, ImageDraw

          root = Path('/tmp/salon-zero-pack')

          source = Image.new('RGB', (256, 256), (220, 210, 200))
          d = ImageDraw.Draw(source)
          d.ellipse((92, 28, 164, 100), fill=(170, 125, 95))
          d.rectangle((72, 96, 184, 232), fill=(45, 45, 45))
          source.save(root / '01_Source_Original.png')

          garment = Image.new('RGB', (256, 256), (42, 42, 42))
          gd = ImageDraw.Draw(garment)
          gd.text((60, 112), 'CALIFORNIA', fill=(235, 210, 190))
          garment.save(root / '02_Garment_Reference_CALIFORNIA.png')

          structure = Image.new('RGB', (256, 256), 'black')
          sd = ImageDraw.Draw(structure)
          sd.line([(128, 36), (128, 208)], fill='white', width=6)
          sd.line([(128, 92), (88, 142)], fill='white', width=6)
          sd.line([(128, 92), (168, 142)], fill='white', width=6)
          structure.save(root / '03_Target_Keypoints_UpperBody_Strong.png')
          PY

      - name: Execute production Zero GPU runner end-to-end
        env:
          PACK_DIR: /tmp/salon-zero-pack
          OUT_DIR: /tmp/salon-zero-output
          HF_ZERO_STEPS: "1"
          HF_ZERO_GUIDANCE: "1.0"
          HF_ZERO_LORA: Studio-DeLight
          SEED: "47"
        shell: bash
        run: |
          set -euo pipefail
          python experiments/salon-reconstruction/run_hf_zero_fast_salon.py
          test -s /tmp/salon-zero-output/hf_zero_upper_body_strong.png
          python - <<'PY'
          from PIL import Image
          p = '/tmp/salon-zero-output/hf_zero_upper_body_strong.png'
          im = Image.open(p)
          im.verify()
          print('Production Zero runner end-to-end synthetic inference: PASS')
          PY

      - name: Clean synthetic files
        if: always()
        run: rm -rf /tmp/salon-zero-pack /tmp/salon-zero-output /tmp/official-qwen-probe.png
