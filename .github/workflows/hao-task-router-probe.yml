name: Hao Task Router Probe

on:
  push:
    branches:
      - exp/hao-system-control-render
    paths:
      - 'hao-cloud-runtime/task-router.mjs'
      - 'hao-cloud-runtime/maintenance-preflight.mjs'
      - 'hao-render-exp/server.mjs'
      - 'hao-render-exp/selftest.mjs'
      - '.github/workflows/hao-task-router-probe.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-router:
    runs-on: ubuntu-slim
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Verify routing and admission matrix
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p router-output
          node --input-type=module <<'NODE'
          import { routeTask, ROUTER_POLICY } from './hao-cloud-runtime/task-router.mjs';
          import fs from 'node:fs';

          const none = { checked: true, status: 'NONE', relation: 'NONE', source: 'PROVIDER_CURRENT' };
          const plan = { validationPlanReady: true, selectedValidationEvidence: ['PROVIDER_READBACK'] };
          const formalPreflight = {
            provider: 'DRIVE',
            action: 'FORMAL_WRITE',
            freshStateRead: true,
            currentStateResolved: true,
            targetIdentityVerified: true,
            formalMutation: true,
            necessityEstablished: true,
            activeWork: none,
            currentFingerprint: 'v1',
            desiredFingerprint: 'v2',
            ...plan,
          };
          const computePreflight = {
            provider: 'GITHUB',
            action: 'RUN_COMPUTE',
            freshStateRead: true,
            currentStateResolved: true,
            targetIdentityVerified: true,
            consequential: true,
            necessityEstablished: true,
            activeWork: none,
            currentFingerprint: 'old',
            desiredFingerprint: 'new',
            ...plan,
          };

          const cases = [
            ['synthetic image pixel QA', { deterministicCompute: true }, 'GITHUB_ACTIONS_PUBLIC'],
            ['private portrait QA', { deterministicCompute: true, privateData: true, personalData: true }, 'CHATGPT_PRIVATE_LANE'],
            ['formal canonical Drive write with preflight', { formalMutation: true, privateData: true, maintenancePreflight: formalPreflight }, 'SINGLE_WRITE_GATEWAY'],
            ['formal write without preflight fails closed', { formalMutation: true, privateData: true }, 'BLOCKED_MAINTENANCE_PREFLIGHT_REQUIRED'],
            ['declared mutating compute without preflight fails closed', { mutating: true, deterministicCompute: true }, 'BLOCKED_MAINTENANCE_PREFLIGHT_REQUIRED'],
            ['declared consequential compute with preflight', { consequential: true, deterministicCompute: true, maintenancePreflight: computePreflight }, 'GITHUB_ACTIONS_PUBLIC'],
            ['public read-only MCP control', { publicReadOnlyService: true }, 'RENDER_READ_ONLY'],
            ['public research synthesis', {}, 'CHATGPT_NATIVE'],
            ['connected app long browser workflow', { connectedApps: true, longRunningBrowser: true }, 'CHATGPT_PRIVATE_LANE'],
            ['secret-bearing deterministic build', { deterministicCompute: true, containsSecrets: true }, 'CHATGPT_PRIVATE_LANE'],
            ['local terminal only workflow', { requiresLocalDevice: true }, 'BLOCKED_LOCAL_DEVICE'],
            ['local-device block outranks missing preflight', { requiresLocalDevice: true, mutating: true }, 'BLOCKED_LOCAL_DEVICE'],
            ['formal write with preflight outranks read-only service', { formalMutation: true, publicReadOnlyService: true, maintenancePreflight: formalPreflight }, 'SINGLE_WRITE_GATEWAY'],
            ['public PDF batch transform', { deterministicCompute: true }, 'GITHUB_ACTIONS_PUBLIC'],
          ];

          const results = [];
          let pass = 0;
          for (const [name, task, expected] of cases) {
            const routed = routeTask(task);
            const actual = routed.lane ?? routed.disposition ?? 'UNRESOLVED';
            const ok = actual === expected;
            if (ok) pass++;
            results.push({ name, expected, actual, lane: routed.lane ?? null, disposition: routed.disposition ?? null, ok, reasons: routed.reasons, safeguards: routed.safeguards });
            console.log(`${ok ? 'PASS' : 'FAIL'} | ${name} | expected=${expected} actual=${actual}`);
          }

          const report = {
            policy: ROUTER_POLICY,
            total: cases.length,
            pass,
            fail: cases.length - pass,
            result: pass === cases.length ? 'PASS' : 'FAIL',
            results,
          };
          fs.writeFileSync('router-output/router-report.json', JSON.stringify(report, null, 2));
          console.log(`router_matrix=${pass}/${cases.length}`);
          if (pass !== cases.length) process.exit(1);
          NODE

      - name: Verify no-computer, authority, and fail-closed invariants
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import { ROUTER_POLICY } from './hao-cloud-runtime/task-router.mjs';
          if (ROUTER_POLICY.deviceAssumption !== 'NO_COMPUTER') process.exit(1);
          if (ROUTER_POLICY.formalAuthority !== 'Google Drive') process.exit(1);
          if (ROUTER_POLICY.publicComputeRule !== 'NON_SENSITIVE_ONLY') process.exit(1);
          if (ROUTER_POLICY.formalWriteRule !== 'EXISTING_SINGLE_WRITE_GATEWAY_ONLY') process.exit(1);
          if (ROUTER_POLICY.consequentialPreflightRule !== 'REQUIRED_WHEN_FORMAL_MUTATION_OR_MUTATING_OR_CONSEQUENTIAL') process.exit(1);
          if (ROUTER_POLICY.missingPreflightDisposition !== 'BLOCKED_MAINTENANCE_PREFLIGHT_REQUIRED') process.exit(1);
          if (ROUTER_POLICY.maintenancePreflight.ruleOrder[8] !== 'VALIDATION_PLAN') process.exit(1);
          console.log('router_invariants=PASS');
          NODE

      - name: Verify Render control consumer integration
        shell: bash
        run: |
          set -euo pipefail
          node --check hao-render-exp/server.mjs
          node --check hao-render-exp/selftest.mjs
          PORT=10000 RENDER_GIT_COMMIT="${GITHUB_SHA}" node hao-render-exp/server.mjs > router-output/render-server.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:10000/healthz >/dev/null; then
              break
            fi
            sleep 0.2
          done
          curl -fsS http://127.0.0.1:10000/healthz > router-output/render-health.json
          PORT=10000 node hao-render-exp/selftest.mjs | tee router-output/render-selftest.log
          grep -F '"event":"hao_mcp_selftest_summary"' router-output/render-selftest.log | grep -F '"result":"PASS"'
          grep -F '"version":"0.4.6-validation-plan-admission-exp"' router-output/render-health.json
          grep -F '"admissionFailClosed":"MISSING_PREFLIGHT_BLOCKS_DECLARED_CONSEQUENTIAL"' router-output/render-health.json
          grep -F '"validationPlan":"REQUIRED_BEFORE_DECLARED_CONSEQUENTIAL_PROCEED"' router-output/render-health.json
          kill "$SERVER_PID" 2>/dev/null || true
          wait "$SERVER_PID" 2>/dev/null || true
          trap - EXIT

      - name: Upload routing evidence
        uses: actions/upload-artifact@v4
        with:
          name: hao-task-router-evidence-${{ github.run_id }}
          path: |
            router-output/router-report.json
            router-output/render-health.json
            router-output/render-selftest.log
            router-output/render-server.log
          retention-days: 1
