name: Hao Hair Commercial Regression QA

on:
  push:
    branches:
      - hao-hair-sr-test-20260817
    paths:
      - '.github/workflows/hair-commercial-regression-qa.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  regression-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Download verified baseline SR
        uses: actions/download-artifact@v4
        with:
          name: hao-hair-realesr-general-x2-dn020
          path: work/baseline
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: 32003834720

      - name: Download umbrella-clean v15
        uses: actions/download-artifact@v4
        with:
          name: hao-hair-umbrella-source-plate-v15
          path: work/plate
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: 32008506857

      - name: Download hair-safe bokeh v02
        uses: actions/download-artifact@v4
        with:
          name: hao-hair-commercial-modnet-hairsafe-bokeh-v02
          path: work/bokeh
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: 32009172839

      - name: Download studio tone v01
        uses: actions/download-artifact@v4
        with:
          name: hao-hair-commercial-studiotone-v01
          path: work/tone
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: 32009395162

      - name: Download packaged primary candidate
        uses: actions/download-artifact@v4
        with:
          name: hao-hair-commercial-primary-candidate-v01
          path: work/package
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: 32009562632

      - name: Install QA stack
        run: |
          python -m pip install --upgrade pip
          pip install 'numpy<2' pillow opencv-python-headless==4.10.0.84 scikit-image==0.24.0

      - name: Generate end-to-end regression QA
        run: |
          python - <<'PY'
          import json, hashlib
          from pathlib import Path
          import numpy as np
          import cv2
          from PIL import Image
          from skimage.metrics import structural_similarity

          ROOT=Path('work')
          OUT=ROOT/'qa_final'
          OUT.mkdir(parents=True,exist_ok=True)

          def sha256(p): return hashlib.sha256(Path(p).read_bytes()).hexdigest()
          def load_rgb(p): return np.asarray(Image.open(p).convert('RGB'))
          def exact(root,name):
              hits=list((ROOT/root).rglob(name)); assert len(hits)==1,(root,name,hits); return hits[0]
          def find_fullres(root):
              hits=[]
              for p in (ROOT/root).rglob('*.png'):
                  try:
                      if Image.open(p).size==(2360,4192): hits.append(p)
                  except Exception: pass
              non_aux=[p for p in hits if all(k not in p.name.lower() for k in ['mask','protect','matte'])]
              assert non_aux,(root,hits)
              return max(non_aux,key=lambda p:p.stat().st_size)
          def grad_mag(a):
              g=cv2.cvtColor(a,cv2.COLOR_RGB2GRAY).astype(np.float32)
              gx=cv2.Sobel(g,cv2.CV_32F,1,0,ksize=3); gy=cv2.Sobel(g,cv2.CV_32F,0,1,ksize=3)
              return np.sqrt(gx*gx+gy*gy)
          def grad_corr(a,b,mask=None):
              ga=grad_mag(a); gb=grad_mag(b)
              if mask is not None:
                  ga=ga[mask]; gb=gb[mask]
              else:
                  ga=ga.ravel(); gb=gb.ravel()
              if ga.size<100 or float(np.std(ga))<1e-6 or float(np.std(gb))<1e-6: return 1.0
              return float(np.corrcoef(ga,gb)[0,1])

          baseline_p=find_fullres('baseline')
          plate_p=exact('plate','Hao_Hair_SR_x2_umbrella_source_plate_v15.png')
          mask_p=exact('plate','edit_mask_v15.png')
          protect_p=exact('plate','person_protect_v15.png')
          bokeh_p=exact('bokeh','Hao_Hair_Commercial_HairSafe_Bokeh_balanced_v02.png')
          matte_p=exact('bokeh','modnet_matte_768_v02.png')
          tone_p=exact('tone','Hao_Hair_Commercial_StudioTone_studio_v01.png')
          primary_p=exact('package','Hao_Hair_Commercial_PrimaryCandidate_v01.png')
          portfolio_p=exact('package','Hao_Hair_Commercial_Portfolio4x5_Candidate_v01.png')

          baseline=load_rgb(baseline_p); plate=load_rgb(plate_p); bokeh=load_rgb(bokeh_p); tone=load_rgb(tone_p); primary=load_rgb(primary_p)
          mask=np.asarray(Image.open(mask_p).convert('L'))>0
          protect=np.asarray(Image.open(protect_p).convert('L'))>0
          matte=np.asarray(Image.open(matte_p).convert('L')).astype(np.float32)/255.0
          assert baseline.shape==plate.shape==bokeh.shape==tone.shape==primary.shape==(4192,2360,3)

          report={'status':'TECHNICAL_QA_PENDING','hard_gates':{},'diagnostics':{},'metrics':{},'source_files':{}}
          for label,p in [('baseline_sr',baseline_p),('umbrella_clean_v15',plate_p),('hairsafe_bokeh_v02',bokeh_p),('studio_tone_v01',tone_p),('primary_candidate',primary_p),('portfolio_4x5',portfolio_p)]:
              report['source_files'][label]={'name':Path(p).name,'sha256':sha256(p)}

          # Hard Gate 1: removal isolation and person preservation.
          outside=~mask
          hair_roi=(350,800,1900,2600); x0,y0,x1,y1=hair_roi
          g1_outside=bool(np.array_equal(baseline[outside],plate[outside]))
          g1_person=bool(np.array_equal(baseline[protect],plate[protect]))
          g1_hair=bool(np.array_equal(baseline[y0:y1,x0:x1],plate[y0:y1,x0:x1]))
          g1=bool(g1_outside and g1_person and g1_hair)
          report['hard_gates']['umbrella_removal_isolation']={
              'pass':g1,'outside_edit_mask_bit_identical':g1_outside,
              'protected_person_bit_identical':g1_person,'hair_face_roi_bit_identical':g1_hair,
              'edit_mask_pixels':int(mask.sum()),'protected_person_pixels':int(protect.sum())}

          # Hard Gate 2: the MODNet-defined core subject is exact. Whole-ROI SSIM is diagnostic only,
          # because the ROI intentionally includes background that should become defocused.
          core=matte>=0.65
          g2=bool(np.array_equal(plate[core],bokeh[core]))
          roi_plate=plate[y0:y1,x0:x1]; roi_bokeh=bokeh[y0:y1,x0:x1]; roi_matte=matte[y0:y1,x0:x1]
          subject_eval=roi_matte>=0.20
          transition=(roi_matte>=0.20)&(roi_matte<0.65)
          diff_b=np.mean(np.abs(roi_plate.astype(np.int16)-roi_bokeh.astype(np.int16)),axis=2)
          report['hard_gates']['hairsafe_bokeh_core']={'pass':g2,'modnet_core_subject_bit_identical':g2,'core_threshold':0.65,'core_pixels':int(core.sum())}
          report['diagnostics']['hairsafe_bokeh']={
              'whole_hair_face_roi_ssim':float(structural_similarity(roi_plate,roi_bokeh,channel_axis=2,data_range=255)),
              'subject_weighted_gradient_correlation':grad_corr(roi_plate,roi_bokeh,subject_eval),
              'transition_band_pixels':int(transition.sum()),
              'transition_band_mean_abs_error':float(np.mean(diff_b[transition])) if np.any(transition) else 0.0,
              'transition_band_p95_abs_error':float(np.percentile(diff_b[transition],95)) if np.any(transition) else 0.0}

          # Hard Gate 3: studio tone can change luminance but may not materially rotate hue or destroy structure.
          roi_tone=tone[y0:y1,x0:x1]
          gc_tone=grad_corr(roi_bokeh,roi_tone,subject_eval)
          ssim_tone=float(structural_similarity(roi_bokeh,roi_tone,channel_axis=2,data_range=255))
          roi_core=roi_matte>=0.65
          hsv0=cv2.cvtColor(roi_bokeh,cv2.COLOR_RGB2HSV).astype(np.float32)
          hsv1=cv2.cvtColor(roi_tone,cv2.COLOR_RGB2HSV).astype(np.float32)
          chroma=roi_core & (hsv0[:,:,1]>=35) & (hsv0[:,:,2]>=25)
          if np.any(chroma):
              hd=np.abs(hsv1[:,:,0]-hsv0[:,:,0]); hd=np.minimum(hd,180-hd)*2.0
              sd=np.abs(hsv1[:,:,1]-hsv0[:,:,1])
              hue_med=float(np.median(hd[chroma])); hue_p95=float(np.percentile(hd[chroma],95)); sat_med=float(np.median(sd[chroma]))
          else: hue_med=hue_p95=sat_med=0.0
          g3=bool(gc_tone>0.995 and hue_med<=2.0 and hue_p95<=6.0 and sat_med<=4.0)
          report['hard_gates']['studio_tone_fidelity']={
              'pass':g3,'subject_gradient_correlation_vs_bokeh':gc_tone,'whole_roi_ssim_vs_bokeh':ssim_tone,
              'core_chromatic_pixels':int(chroma.sum()),'median_hue_shift_degrees':hue_med,
              'p95_hue_shift_degrees':hue_p95,'median_saturation_shift_8bit':sat_med}

          # Hard Gate 4: packaging integrity.
          portfolio=load_rgb(portfolio_p); crop_box=(280,560,2080,2810); cx0,cy0,cx1,cy1=crop_box
          g4_primary=bool(np.array_equal(tone,primary)) and Path(tone_p).read_bytes()==Path(primary_p).read_bytes()
          g4_crop=portfolio.shape==(2250,1800,3) and bool(np.array_equal(portfolio,primary[cy0:cy1,cx0:cx1]))
          g4=bool(g4_primary and g4_crop)
          report['hard_gates']['package_integrity']={'pass':g4,'primary_byte_identical_to_selected_studio_tone':g4_primary,'portfolio_native_pixel_crop_identical':g4_crop,'portfolio_crop_box_xyxy':list(crop_box)}

          report['metrics']['final_highlight_clip_fraction']=float(np.mean(np.any(primary>=255,axis=2)))
          report['metrics']['final_black_clip_fraction']=float(np.mean(np.all(primary<=0,axis=2)))
          report['metrics']['baseline_to_plate_changed_fraction']=float(np.mean(np.any(baseline!=plate,axis=2)))
          report['metrics']['plate_to_bokeh_changed_fraction']=float(np.mean(np.any(plate!=bokeh,axis=2)))
          report['metrics']['bokeh_to_tone_changed_fraction']=float(np.mean(np.any(bokeh!=tone,axis=2)))

          # QA visual 1: umbrella before/after.
          crop_lr=(1200,2300,2360,4192)
          before=Image.fromarray(baseline,'RGB').crop(crop_lr); after=Image.fromarray(plate,'RGB').crop(crop_lr)
          before.thumbnail((700,1100)); after.thumbnail((700,1100))
          sheet=Image.new('RGB',(before.width+after.width,max(before.height,after.height)),(255,255,255)); sheet.paste(before,(0,0)); sheet.paste(after,(before.width,0)); sheet.save(OUT/'qa_umbrella_before_after.png')

          # QA visual 2: clean plate, hair-safe bokeh, studio tone, amplified difference heatmap.
          thumbs=[]
          for a in [roi_plate,roi_bokeh,roi_tone]:
              im=Image.fromarray(a,'RGB'); im.thumbnail((520,620)); thumbs.append(im)
          diff=np.mean(np.abs(roi_tone.astype(np.int16)-roi_plate.astype(np.int16)),axis=2)
          heat=cv2.applyColorMap(np.clip(diff*8,0,255).astype(np.uint8),cv2.COLORMAP_TURBO); heat=cv2.cvtColor(heat,cv2.COLOR_BGR2RGB)
          hi=Image.fromarray(heat,'RGB'); hi.thumbnail((520,620)); thumbs.append(hi)
          stage=Image.new('RGB',(sum(i.width for i in thumbs),max(i.height for i in thumbs)),(255,255,255)); px=0
          for im in thumbs: stage.paste(im,(px,0)); px+=im.width
          stage.save(OUT/'qa_hair_face_stages_and_diff.png')

          # QA visual 3: matte edge overlay so transition-band behavior can be visually inspected.
          edge_vis=roi_bokeh.copy()
          edge=transition
          overlay=edge_vis.astype(np.float32); overlay[edge]=0.55*overlay[edge]+0.45*np.array([255,0,0],dtype=np.float32)
          eim=Image.fromarray(np.clip(overlay,0,255).astype(np.uint8),'RGB'); eim.thumbnail((900,1100)); eim.save(OUT/'qa_hair_transition_band_overlay.png')

          # QA visual 4: full final and native 4:5 crop.
          p1=Image.fromarray(primary,'RGB'); p1.thumbnail((720,1280)); p2=Image.fromarray(portfolio,'RGB'); p2.thumbnail((720,1280))
          final_sheet=Image.new('RGB',(p1.width+p2.width,max(p1.height,p2.height)),(255,255,255)); final_sheet.paste(p1,(0,0)); final_sheet.paste(p2,(p1.width,0)); final_sheet.save(OUT/'qa_final_full_and_4x5.png')

          hard_pass=bool(g1 and g2 and g3 and g4)
          report['hard_pass']=hard_pass
          report['status']='PASS_HARD_GATES_PENDING_VISUAL_EDGE_QA' if hard_pass else 'FAIL_HARD_GATES'
          (OUT/'regression_qa_report.json').write_text(json.dumps(report,indent=2),encoding='utf-8')
          (OUT/'REGRESSION_QA_SUMMARY.md').write_text(
              '# Hao Hair Commercial Regression QA v02\n\n'
              f"Status: **{report['status']}**\n\n"
              f"- Umbrella edit isolation: {'PASS' if g1 else 'FAIL'}\n"
              f"- Hair-safe core exactness: {'PASS' if g2 else 'FAIL'}\n"
              f"- Subject-weighted gradient corr clean→bokeh: {report['diagnostics']['hairsafe_bokeh']['subject_weighted_gradient_correlation']:.6f}\n"
              f"- Transition-band MAE: {report['diagnostics']['hairsafe_bokeh']['transition_band_mean_abs_error']:.3f}; p95: {report['diagnostics']['hairsafe_bokeh']['transition_band_p95_abs_error']:.3f}\n"
              f"- Subject gradient corr bokeh→tone: {gc_tone:.6f}\n"
              f"- Median hue shift: {hue_med:.3f}°; p95: {hue_p95:.3f}°\n"
              f"- Package integrity: {'PASS' if g4 else 'FAIL'}\n\n"
              'Hard gates do not replace visual review of the MODNet transition band. User acceptance remains separate.\n',encoding='utf-8')
          print(json.dumps(report,indent=2))
          PY

      - name: Upload regression QA
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hao-hair-commercial-regression-qa-v02
          path: work/qa_final/*
          if-no-files-found: error
          retention-days: 7

      - name: Enforce hard regression gates
        run: |
          python - <<'PY'
          import json, sys
          r=json.load(open('work/qa_final/regression_qa_report.json','r',encoding='utf-8'))
          print('QA_STATUS',r['status'])
          if not r.get('hard_pass',False): sys.exit(1)
          PY
