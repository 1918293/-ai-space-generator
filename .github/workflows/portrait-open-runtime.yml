name: Hao Open Portrait Runtime

# Pose-guided Realistic Vision + IP-Adapter proof. Push-trigger is temporary for this launch.
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/portrait-open-runtime.yml"

permissions:
  contents: write
  actions: write

jobs:
  generate:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Publish one-time encryption public key
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git reset --hard origin/main
          mkdir -p portrait-runtime
          RUN_ID="${GITHUB_RUN_ID}"
          openssl genpkey -algorithm RSA -pkeyopt rsa_keygen_bits:3072 -out /tmp/portrait-private.pem
          openssl pkey -in /tmp/portrait-private.pem -pubout -out portrait-runtime/public.pem
          printf '%s\n' "$RUN_ID" > portrait-runtime/session.txt
          git config user.name "hao-open-runtime"
          git config user.email "actions@users.noreply.github.com"
          git add portrait-runtime/public.pem portrait-runtime/session.txt
          git commit -m "runtime: publish one-time portrait key $RUN_ID" || true
          if ! git push origin HEAD:main; then
            git fetch origin main
            git rebase origin/main
            git push origin HEAD:main
          fi

      - name: Wait for encrypted reference chunks
        shell: bash
        run: |
          set -euo pipefail
          RUN_ID="${GITHUB_RUN_ID}"
          for i in $(seq 1 120); do
            git fetch origin main
            git reset --hard origin/main
            MANIFEST="portrait-runtime/${RUN_ID}.manifest"
            KEY="portrait-runtime/${RUN_ID}.key.enc.b64"
            if [ -f "$MANIFEST" ] && [ -f "$KEY" ]; then
              COUNT=$(tr -d '[:space:]' < "$MANIFEST")
              if [[ "$COUNT" =~ ^[0-9]+$ ]] && [ "$COUNT" -gt 0 ]; then
                COMPLETE=1
                for n in $(seq 0 $((COUNT-1))); do
                  PART=$(printf "portrait-runtime/%s.ref.part%02d" "$RUN_ID" "$n")
                  [ -f "$PART" ] || COMPLETE=0
                done
                if [ "$COMPLETE" -eq 1 ]; then
                  echo "Encrypted reference chunks received: $COUNT"
                  exit 0
                fi
              fi
            fi
            sleep 5
          done
          echo "Timed out waiting for encrypted reference chunks." >&2
          exit 1

      - name: Decrypt reference in runner memory
        shell: bash
        run: |
          set -euo pipefail
          RUN_ID="${GITHUB_RUN_ID}"
          mkdir -p /tmp/portrait-input
          COUNT=$(tr -d '[:space:]' < "portrait-runtime/${RUN_ID}.manifest")
          base64 -d "portrait-runtime/${RUN_ID}.key.enc.b64" > /tmp/portrait-input/key.enc
          : > /tmp/portrait-input/ref.enc.b64
          for n in $(seq 0 $((COUNT-1))); do
            PART=$(printf "portrait-runtime/%s.ref.part%02d" "$RUN_ID" "$n")
            cat "$PART" >> /tmp/portrait-input/ref.enc.b64
          done
          base64 -d /tmp/portrait-input/ref.enc.b64 > /tmp/portrait-input/ref.enc
          openssl pkeyutl -decrypt             -inkey /tmp/portrait-private.pem             -in /tmp/portrait-input/key.enc             -out /tmp/portrait-input/pass.txt             -pkeyopt rsa_padding_mode:oaep             -pkeyopt rsa_oaep_md:sha256
          openssl enc -d -aes-256-cbc -pbkdf2 -iter 100000             -in /tmp/portrait-input/ref.enc             -out /tmp/portrait-input/reference.jpg             -pass file:/tmp/portrait-input/pass.txt
          file /tmp/portrait-input/reference.jpg
          sha256sum /tmp/portrait-input/reference.jpg

      - name: Build upright full-body composition guide
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --quiet pillow
          python3 - <<'PY'
          from PIL import Image, ImageDraw, ImageFilter
          W,H=384,768
          img=Image.new("RGB",(W,H),(235,230,224))
          d=ImageDraw.Draw(img)
          d.rectangle([0,570,W,H], fill=(218,230,232))
          d.rectangle([0,620,W,650], fill=(245,245,240))
          d.rectangle([20,40,115,520], fill=(228,224,219))
          d.rectangle([285,20,360,520], fill=(242,239,234))
          skin=(210,164,143); hair=(95,35,50); burg=(92,24,42)
          d.ellipse([142,52,242,160], fill=hair)
          d.rounded_rectangle([138,100,246,280], radius=45, fill=hair)
          d.ellipse([158,68,226,142], fill=skin)
          d.rectangle([178,132,206,166], fill=skin)
          d.polygon([(154,160),(230,160),(242,330),(142,330)], fill=skin)
          d.polygon([(150,180),(190,168),(234,180),(228,238),(154,238)], fill=burg)
          d.polygon([(145,350),(239,350),(228,410),(156,410)], fill=burg)
          d.rounded_rectangle([125,165,148,420], radius=12, fill=skin)
          d.rounded_rectangle([236,165,259,420], radius=12, fill=skin)
          d.ellipse([126,402,149,430], fill=skin)
          d.ellipse([235,402,258,430], fill=skin)
          d.rounded_rectangle([157,398,187,675], radius=14, fill=skin)
          d.rounded_rectangle([197,398,227,675], radius=14, fill=skin)
          d.ellipse([146,658,188,692], fill=skin)
          d.ellipse([196,658,238,692], fill=skin)
          img=img.filter(ImageFilter.GaussianBlur(2.2))
          img.save('/tmp/portrait-input/pose-guide.png')
          PY

      - name: Download photorealistic runtime and reference adapter
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/sdcpp
          curl -fL --retry 5 --retry-delay 3             "https://github.com/leejet/stable-diffusion.cpp/releases/download/master-920-2f88688/sd-master-2f88688-bin-Linux-Ubuntu-24.04-x86_64.zip"             -o /tmp/sdcpp/sd.zip
          unzip -q /tmp/sdcpp/sd.zip -d /tmp/sdcpp/bin
          curl -fL --retry 6 --retry-delay 5             "https://huggingface.co/second-state/Realistic_Vision_V6.0_B1-GGUF/resolve/main/realisticVisionV60B1_v51HyperVAE-Q4_0.gguf"             -o /tmp/sdcpp/realistic-vision-hyper-q4.gguf
          curl -fL --retry 6 --retry-delay 5             "https://huggingface.co/h94/IP-Adapter/resolve/main/models/image_encoder/model.safetensors"             -o /tmp/sdcpp/clip_vision_h.safetensors
          curl -fL --retry 6 --retry-delay 5             "https://huggingface.co/h94/IP-Adapter/resolve/main/models/ip-adapter-plus_sd15.safetensors"             -o /tmp/sdcpp/ip-adapter-plus_sd15.safetensors
          sha256sum             /tmp/sdcpp/realistic-vision-hyper-q4.gguf             /tmp/sdcpp/clip_vision_h.safetensors             /tmp/sdcpp/ip-adapter-plus_sd15.safetensors

      - name: Generate pose-guided standing portrait
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/sdcpp/bin
          export LD_LIBRARY_PATH="$PWD"
          ./sd-cli             -m /tmp/sdcpp/realistic-vision-hyper-q4.gguf             -i /tmp/portrait-input/pose-guide.png             --strength 0.78             --clip_vision /tmp/sdcpp/clip_vision_h.safetensors             --ip-adapter /tmp/sdcpp/ip-adapter-plus_sd15.safetensors             --ip-adapter-image /tmp/portrait-input/reference.jpg             --ip-adapter-strength 0.72             -W 384 -H 768             --steps 6             --cfg-scale 1.5             --sampling-method euler_a             --scheduler karras             --diffusion-fa             -p "RAW photo, photorealistic full-body lifestyle photograph of the same adult woman from the reference, recognizable facial structure, natural eyes, nose and smile, long burgundy-red straight layered hair with side-swept bangs, standing upright naturally beside a clean minimal swimming pool, entire body visible from head through both feet, both feet completely inside frame, balanced relaxed standing posture, shoulders level, arms resting naturally at her sides, wearing a separate deep burgundy two-piece swimsuit, bikini top matching the reference with gathered center-front knot detail and narrow straps, visible bare abdomen between top and matching modest swim bottoms, realistic adult body proportions, natural hands and feet, realistic skin pores, individual hair strands and subtle flyaways, soft diffused warm daylight, understated resort architecture, 50mm realistic photography, natural perspective, high detail"             -n "sitting, seated, crouching, kneeling, bent knees, knee in foreground, foreground leg, close-up, portrait crop, upper-body crop, cropped feet, missing feet, one-piece swimsuit, monokini, dress, lingerie, different person, generic AI face, face beautification, wig, helmet hair, plastic skin, wax skin, CGI, cartoon, painting, glamour pose, sexualized pose, exaggerated chest, exaggerated waist, exaggerated hips, bad anatomy, extra limbs, extra fingers, malformed hands, malformed feet, duplicate body, text, watermark"             -o /tmp/portrait-output.png             -v

      - name: Upload result
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/portrait-output
          cp /tmp/portrait-output.png /tmp/portrait-output/pose-guided-realistic.png
          cp /tmp/portrait-input/pose-guide.png /tmp/portrait-output/pose-guide.png

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: hao-open-portrait-pose-guided-${{ github.run_id }}
          path: /tmp/portrait-output/
          if-no-files-found: error
          retention-days: 1
          compression-level: 6
