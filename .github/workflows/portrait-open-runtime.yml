name: Hao Open Portrait Runtime

# Artifact-chained lower-body outpaint. Push-trigger is temporary for this launch.
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/portrait-open-runtime.yml"

concurrency:
  group: hao-open-portrait-runtime
  cancel-in-progress: true

permissions:
  contents: read
  actions: read

jobs:
  generate:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Download prior pose-guided artifact
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/portrait-input
          gh api             -H "Accept: application/vnd.github+json"             "/repos/${GITHUB_REPOSITORY}/actions/artifacts/10920188488/zip"             > /tmp/portrait-input/prior.zip
          unzip -q /tmp/portrait-input/prior.zip -d /tmp/portrait-input/prior
          test -f /tmp/portrait-input/prior/pose-guided-realistic.png
          file /tmp/portrait-input/prior/pose-guided-realistic.png
          sha256sum /tmp/portrait-input/prior/pose-guided-realistic.png

      - name: Build protected lower-body outpaint canvas
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --quiet pillow
          python3 - <<'PY'
          from PIL import Image, ImageFilter, ImageDraw
          from pathlib import Path
          src=Image.open('/tmp/portrait-input/prior/pose-guided-realistic.png').convert('RGB')
          W,TOP_H,H=384,768,1152
          ref=src.resize((W,TOP_H),Image.Resampling.LANCZOS)
          strip=ref.crop((0,TOP_H-72,W,TOP_H)).filter(ImageFilter.GaussianBlur(24))
          extension=strip.resize((W,H-TOP_H),Image.Resampling.BILINEAR)
          init=Image.new('RGB',(W,H),(230,226,220))
          init.paste(ref,(0,0))
          init.paste(extension,(0,TOP_H))
          mirror=ref.crop((0,TOP_H-120,W,TOP_H)).transpose(Image.Transpose.FLIP_TOP_BOTTOM)
          mirror=mirror.resize((W,180),Image.Resampling.LANCZOS)
          init.paste(mirror,(0,TOP_H))
          Path('/tmp/portrait-work').mkdir(parents=True,exist_ok=True)
          init.save('/tmp/portrait-work/init.png')

          mask=Image.new('L',(W,H),0)
          d=ImageDraw.Draw(mask)
          for y in range(675,H):
              v=255 if y>=760 else max(0,min(255,round((y-675)/85*255)))
              d.line((0,y,W,y),fill=v)
          mask.save('/tmp/portrait-work/mask.png')
          print('source',src.size,'working',init.size)
          PY

      - name: Download fast inpainting runtime
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/sdcpp/loras
          curl -fL --retry 5 --retry-delay 3             "https://github.com/leejet/stable-diffusion.cpp/releases/download/master-920-2f88688/sd-master-2f88688-bin-Linux-Ubuntu-24.04-x86_64.zip"             -o /tmp/sdcpp/sd.zip
          unzip -q /tmp/sdcpp/sd.zip -d /tmp/sdcpp/bin
          curl -fL --retry 6 --retry-delay 5             "https://huggingface.co/gpustack/stable-diffusion-v1-5-inpainting-GGUF/resolve/main/stable-diffusion-v1-5-inpainting-Q4_0.gguf?download=true"             -o /tmp/sdcpp/inpaint-q4.gguf
          curl -fL --retry 6 --retry-delay 5             "https://huggingface.co/latent-consistency/lcm-lora-sdv1-5/resolve/main/pytorch_lora_weights.safetensors"             -o /tmp/sdcpp/loras/lcm-lora-sdv1-5.safetensors
          sha256sum /tmp/sdcpp/inpaint-q4.gguf /tmp/sdcpp/loras/lcm-lora-sdv1-5.safetensors

      - name: Extend legs and feet
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/sdcpp/bin
          export LD_LIBRARY_PATH="$PWD"
          ./sd-cli             -m /tmp/sdcpp/inpaint-q4.gguf             -i /tmp/portrait-work/init.png             --mask /tmp/portrait-work/mask.png             -W 384 -H 1152             --steps 5             --cfg-scale 1.0             --sampling-method lcm             --strength 0.98             --lora-model-dir /tmp/sdcpp/loras             --diffusion-fa             -p "photorealistic seamless continuation of the adult woman visible above, complete her standing body from the existing upper thighs down through two natural knees, calves, ankles and two feet, both complete bare feet visible resting naturally on the poolside floor, straight relaxed legs, subtle balanced stance, realistic adult proportions, same natural skin tone, same deep burgundy modest swim bottoms, anatomically correct legs and feet, soft diffused daylight, realistic poolside floor, natural photographic perspective<lora:lcm-lora-sdv1-5:1>"             -n "cropped feet, missing feet, no feet, sitting, seated, crouching, kneeling, giant knee, foreground knee, foreground leg, crossed legs, extra legs, duplicate legs, extra feet, fused legs, malformed knees, malformed ankles, malformed feet, high heels, shoes, different swimsuit color, dress, text, watermark, CGI, cartoon"             -o /tmp/portrait-work/generated.png             -v

      - name: Restore protected pixels and blend transition
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from PIL import Image
          from pathlib import Path
          init=Image.open('/tmp/portrait-work/init.png').convert('RGB')
          gen=Image.open('/tmp/portrait-work/generated.png').convert('RGB')
          mask=Image.open('/tmp/portrait-work/mask.png').convert('L')
          final=Image.composite(gen,init,mask)
          out=Path('/tmp/portrait-output')
          out.mkdir(parents=True,exist_ok=True)
          final.save(out/'full-body-outpaint.png')
          mask.save(out/'generation-mask.png')
          print('final',final.size)
          PY

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: hao-open-portrait-fullbody-${{ github.run_id }}
          path: /tmp/portrait-output/
          if-no-files-found: error
          retention-days: 1
          compression-level: 6
