name: Hao Open Portrait Runtime

# Full-frame IP-Adapter + LCM proof. Push-trigger is temporary for this launch.
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/portrait-open-runtime.yml"

permissions:
  contents: write
  actions: write

jobs:
  generate:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Publish one-time encryption public key
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git reset --hard origin/main
          mkdir -p portrait-runtime
          RUN_ID="${GITHUB_RUN_ID}"
          openssl genpkey -algorithm RSA -pkeyopt rsa_keygen_bits:3072 -out /tmp/portrait-private.pem
          openssl pkey -in /tmp/portrait-private.pem -pubout -out portrait-runtime/public.pem
          printf '%s\n' "$RUN_ID" > portrait-runtime/session.txt
          git config user.name "hao-open-runtime"
          git config user.email "actions@users.noreply.github.com"
          git add portrait-runtime/public.pem portrait-runtime/session.txt
          git commit -m "runtime: publish one-time portrait key $RUN_ID" || true
          if ! git push origin HEAD:main; then
            git fetch origin main
            git rebase origin/main
            git push origin HEAD:main
          fi

      - name: Wait for encrypted reference chunks
        shell: bash
        run: |
          set -euo pipefail
          RUN_ID="${GITHUB_RUN_ID}"
          for i in $(seq 1 120); do
            git fetch origin main
            git reset --hard origin/main
            MANIFEST="portrait-runtime/${RUN_ID}.manifest"
            KEY="portrait-runtime/${RUN_ID}.key.enc.b64"
            if [ -f "$MANIFEST" ] && [ -f "$KEY" ]; then
              COUNT=$(tr -d '[:space:]' < "$MANIFEST")
              if [[ "$COUNT" =~ ^[0-9]+$ ]] && [ "$COUNT" -gt 0 ]; then
                COMPLETE=1
                for n in $(seq 0 $((COUNT-1))); do
                  PART=$(printf "portrait-runtime/%s.ref.part%02d" "$RUN_ID" "$n")
                  [ -f "$PART" ] || COMPLETE=0
                done
                if [ "$COMPLETE" -eq 1 ]; then
                  echo "Encrypted reference chunks received: $COUNT"
                  exit 0
                fi
              fi
            fi
            sleep 5
          done
          echo "Timed out waiting for encrypted reference chunks." >&2
          exit 1

      - name: Decrypt reference in runner memory
        shell: bash
        run: |
          set -euo pipefail
          RUN_ID="${GITHUB_RUN_ID}"
          mkdir -p /tmp/portrait-input
          COUNT=$(tr -d '[:space:]' < "portrait-runtime/${RUN_ID}.manifest")
          base64 -d "portrait-runtime/${RUN_ID}.key.enc.b64" > /tmp/portrait-input/key.enc
          : > /tmp/portrait-input/ref.enc.b64
          for n in $(seq 0 $((COUNT-1))); do
            PART=$(printf "portrait-runtime/%s.ref.part%02d" "$RUN_ID" "$n")
            cat "$PART" >> /tmp/portrait-input/ref.enc.b64
          done
          base64 -d /tmp/portrait-input/ref.enc.b64 > /tmp/portrait-input/ref.enc
          openssl pkeyutl -decrypt             -inkey /tmp/portrait-private.pem             -in /tmp/portrait-input/key.enc             -out /tmp/portrait-input/pass.txt             -pkeyopt rsa_padding_mode:oaep             -pkeyopt rsa_oaep_md:sha256
          openssl enc -d -aes-256-cbc -pbkdf2 -iter 100000             -in /tmp/portrait-input/ref.enc             -out /tmp/portrait-input/reference.jpg             -pass file:/tmp/portrait-input/pass.txt
          file /tmp/portrait-input/reference.jpg
          sha256sum /tmp/portrait-input/reference.jpg

      - name: Download open-source full-frame runtime
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/sdcpp/loras
          curl -fL --retry 5 --retry-delay 3             "https://github.com/leejet/stable-diffusion.cpp/releases/download/master-920-2f88688/sd-master-2f88688-bin-Linux-Ubuntu-24.04-x86_64.zip"             -o /tmp/sdcpp/sd.zip
          unzip -q /tmp/sdcpp/sd.zip -d /tmp/sdcpp/bin
          curl -fL --retry 6 --retry-delay 5             "https://huggingface.co/second-state/stable-diffusion-v1-5-GGUF/resolve/main/stable-diffusion-v1-5-pruned-emaonly-Q4_0.gguf"             -o /tmp/sdcpp/sd15-q4.gguf
          curl -fL --retry 6 --retry-delay 5             "https://huggingface.co/h94/IP-Adapter/resolve/main/models/image_encoder/model.safetensors"             -o /tmp/sdcpp/clip_vision_h.safetensors
          curl -fL --retry 6 --retry-delay 5             "https://huggingface.co/h94/IP-Adapter/resolve/main/models/ip-adapter-plus_sd15.safetensors"             -o /tmp/sdcpp/ip-adapter-plus_sd15.safetensors
          curl -fL --retry 6 --retry-delay 5             "https://huggingface.co/latent-consistency/lcm-lora-sdv1-5/resolve/main/pytorch_lora_weights.safetensors"             -o /tmp/sdcpp/loras/lcm-lora-sdv1-5.safetensors
          sha256sum             /tmp/sdcpp/sd15-q4.gguf             /tmp/sdcpp/clip_vision_h.safetensors             /tmp/sdcpp/ip-adapter-plus_sd15.safetensors             /tmp/sdcpp/loras/lcm-lora-sdv1-5.safetensors

      - name: Generate standing full-body portrait
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/sdcpp/bin
          export LD_LIBRARY_PATH="$PWD"
          ./sd-cli             -m /tmp/sdcpp/sd15-q4.gguf             --clip_vision /tmp/sdcpp/clip_vision_h.safetensors             --ip-adapter /tmp/sdcpp/ip-adapter-plus_sd15.safetensors             --ip-adapter-image /tmp/portrait-input/reference.jpg             --ip-adapter-strength 0.60             -W 384 -H 768             --steps 5             --cfg-scale 1.0             --sampling-method lcm             --lora-model-dir /tmp/sdcpp/loras             --diffusion-fa             -p "photorealistic full-body lifestyle photograph of the same adult woman, recognizable East Asian facial structure from the reference, long burgundy-red straight layered hair with side-swept bangs, wearing a simple deep burgundy modern two-piece swimsuit matching the reference top with gathered center-front detail and narrow straps, matching modest swim bottoms, standing upright naturally beside a clean minimal swimming pool, entire body visible from head to both feet, both feet fully inside frame, balanced relaxed posture, natural shoulders, arms resting naturally, realistic adult body proportions, healthy natural non-sexualized presentation, realistic skin texture and pores, realistic individual hair strands and subtle flyaways, soft diffused warm daylight, understated resort architecture, realistic photography, natural perspective<lora:lcm-lora-sdv1-5:1>"             -n "sitting, seated, crouching, bent knees, knee in foreground, foreground leg, close-up, upper-body crop, cropped feet, feet outside frame, different person, generic AI face, altered face, face beautification, wig, helmet hair, plastic skin, wax skin, CGI, glamour pose, sexualized pose, lingerie, exaggerated chest, exaggerated waist, exaggerated hips, bad anatomy, extra limbs, extra fingers, malformed hands, malformed feet, duplicate body, text, watermark"             -o /tmp/portrait-output.png             -v

      - name: Upload result
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/portrait-output
          cp /tmp/portrait-output.png /tmp/portrait-output/full-frame-ipadapter.png

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: hao-open-portrait-ipadapter-${{ github.run_id }}
          path: /tmp/portrait-output/
          if-no-files-found: error
          retention-days: 1
          compression-level: 6
