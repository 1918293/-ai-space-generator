name: Runtime v2 Lane B Production Foundation

on:
  push:
    branches:
      - exp/runtime-v2-lane-b-prod-foundation
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lane-b-engineering-gate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ai-space-generator
    steps:
      - uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install Runtime v2 dependencies
        run: python -m pip install --upgrade pytest -r requirements-control.txt
      - name: Run complete Runtime v2 regression surface
        run: >-
          python -m pytest tests -q
          --ignore=tests/test_core.py
          --ignore=tests/test_validation.py
      - name: Compile production entrypoints
        run: >-
          python -m py_compile
          src/runtime_config.py
          src/runtime_migrations.py
          src/runtime_lifecycle.py
          src/runtime_observability.py
          src/runtime_deployment.py
      - name: Build runtime container
        run: docker build -f Dockerfile.runtime .
