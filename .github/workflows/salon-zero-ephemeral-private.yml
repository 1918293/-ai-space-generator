name: Salon Ephemeral Encrypted Reconstruction

on:
  push:
    branches:
      - exp/salon-reconstruction-v0.1
    paths:
      - "experiments/salon-reconstruction/ephemeral/*/session_request.json"

permissions:
  contents: write

jobs:
  reconstruct:
    name: encrypted-private-zero-reconstruction
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          ref: exp/salon-reconstruction-v0.1
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install runtime and crypto dependencies
        run: python -m pip install --disable-pip-version-check gradio_client pillow cryptography

      - name: Resolve session request
        shell: bash
        run: |
          set -euo pipefail
          request="$(git diff-tree --no-commit-id --name-only -r "$GITHUB_SHA" | grep -E '^experiments/salon-reconstruction/ephemeral/[^/]+/session_request.json$' | head -1)"
          test -n "$request" || { echo "::error::No session_request.json in triggering commit"; exit 2; }
          session_dir="$(dirname "$request")"
          session_id="$(basename "$session_dir")"
          echo "SESSION_DIR=$session_dir" >> "$GITHUB_ENV"
          echo "SESSION_ID=$session_id" >> "$GITHUB_ENV"
          cp "$request" /tmp/session_request.json
          echo "Resolved encrypted Salon session: $session_id"

      - name: Generate one-time input transport key
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import base64
          from pathlib import Path
          from cryptography.hazmat.primitives import serialization
          from cryptography.hazmat.primitives.asymmetric import rsa

          key = rsa.generate_private_key(public_exponent=65537, key_size=3072)
          private_pem = key.private_bytes(
              serialization.Encoding.PEM,
              serialization.PrivateFormat.PKCS8,
              serialization.NoEncryption(),
          )
          public_pem = key.public_key().public_bytes(
              serialization.Encoding.PEM,
              serialization.PublicFormat.SubjectPublicKeyInfo,
          )
          Path('/tmp/salon_input_private.pem').write_bytes(private_pem)
          print('SALON_INPUT_PUBLIC_KEY_B64=' + base64.b64encode(public_pem).decode('ascii'))
          print('Waiting for encrypted input chunks; plaintext is never written to the repository.')
          PY

      - name: Wait for encrypted source envelope
        shell: bash
        run: |
          set -euo pipefail
          branch="exp/salon-reconstruction-v0.1"
          manifest="$SESSION_DIR/input_manifest.json"
          found=0
          for _ in $(seq 1 120); do
            git fetch -q origin "$branch"
            if git cat-file -e "origin/$branch:$manifest" 2>/dev/null; then
              found=1
              break
            fi
            sleep 5
          done
          test "$found" -eq 1 || { echo "::error::Timed out waiting for encrypted input"; exit 3; }
          git show "origin/$branch:$manifest" > /tmp/input_manifest.json
          python - <<'PY'
          import json, os, subprocess
          from pathlib import Path

          session_dir = os.environ['SESSION_DIR']
          branch = 'origin/exp/salon-reconstruction-v0.1'
          manifest = json.loads(Path('/tmp/input_manifest.json').read_text())
          count = int(manifest['chunk_count'])
          pieces = []
          for i in range(count):
              path = f"{session_dir}/input_chunk_{i:03d}.txt"
              pieces.append(subprocess.check_output(['git','show',f'{branch}:{path}'], text=True).strip())
          Path('/tmp/input_cipher.b64').write_text(''.join(pieces))
          print(f'Encrypted input envelope assembled from {count} chunks.')
          PY

      - name: Decrypt source and build private control pack
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/salon-pack /tmp/salon-output
          python - <<'PY'
          import base64, json, os
          from pathlib import Path
          from PIL import Image, ImageDraw
          from cryptography.hazmat.primitives import hashes, serialization
          from cryptography.hazmat.primitives.asymmetric import padding
          from cryptography.hazmat.primitives.ciphers.aead import AESGCM

          session_id = os.environ['SESSION_ID']
          m = json.loads(Path('/tmp/input_manifest.json').read_text())
          private_key = serialization.load_pem_private_key(
              Path('/tmp/salon_input_private.pem').read_bytes(), password=None
          )
          aes_key = private_key.decrypt(
              base64.b64decode(m['encrypted_key_b64']),
              padding.OAEP(
                  mgf=padding.MGF1(algorithm=hashes.SHA256()),
                  algorithm=hashes.SHA256(),
                  label=None,
              ),
          )
          nonce = base64.b64decode(m['nonce_b64'])
          ciphertext = base64.b64decode(Path('/tmp/input_cipher.b64').read_text())
          source_bytes = AESGCM(aes_key).decrypt(nonce, ciphertext, session_id.encode())
          source_jpeg = Path('/tmp/source.jpeg')
          source_jpeg.write_bytes(source_bytes)

          root = Path('/tmp/salon-pack')
          im = Image.open(source_jpeg).convert('RGB')
          W, H = im.size
          if (W, H) != (1180, 2096):
              print(f'::warning::Unexpected source size {(W,H)}; target coordinates were designed for 1180x2096.')
          im.save(root / '01_Source_Original.png')
          im.crop((120, 990, min(1000, W), H)).save(root / '02_Garment_Reference_CALIFORNIA.png')

          # Strong upper-body target structure derived from the approved EXP profile.
          kp = Image.new('RGB', (W, H), 'black')
          d = ImageDraw.Draw(kp)
          pts = {
              'head': (420,650), 'neck': (500,980),
              'l_shoulder': (245,1095), 'r_shoulder': (770,1125),
              'l_elbow': (135,1485), 'r_elbow': (860,1480),
              'l_wrist': (185,1695), 'r_wrist': (690,1740),
              'torso_center': (505,1440), 'lower_torso': (505,1975),
          }
          edges = [
              ('head','neck'), ('neck','l_shoulder'), ('neck','r_shoulder'),
              ('l_shoulder','l_elbow'), ('l_elbow','l_wrist'),
              ('r_shoulder','r_elbow'), ('r_elbow','r_wrist'),
              ('neck','torso_center'), ('torso_center','lower_torso'),
          ]
          for a,b in edges:
              d.line([pts[a],pts[b]], fill='white', width=8)
          for name,(x,y) in pts.items():
              r = 15 if name == 'head' else 10
              d.ellipse((x-r,y-r,x+r,y+r), fill='white')
          kp.save(root / '03_Target_Keypoints_UpperBody_Strong.png')
          print('Private control pack built in /tmp; no plaintext committed.')
          PY

      - name: Run free Qwen 2511 Zero reconstruction
        env:
          PACK_DIR: /tmp/salon-pack
          OUT_DIR: /tmp/salon-output
          HF_ZERO_LORA: Studio-DeLight
          HF_ZERO_STEPS: "4"
          HF_ZERO_GUIDANCE: "1.0"
          SEED: "47"
        shell: bash
        run: |
          set -euo pipefail
          python experiments/salon-reconstruction/run_hf_zero_fast_salon.py
          test -s /tmp/salon-output/hf_zero_upper_body_strong.png
          python - <<'PY'
          from PIL import Image
          im = Image.open('/tmp/salon-output/hf_zero_upper_body_strong.png')
          im.verify()
          print('Real private Salon Zero inference returned a valid PNG.')
          PY

      - name: Encrypt result for return transport
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import base64, json, os, secrets
          from pathlib import Path
          from cryptography.hazmat.primitives import hashes, serialization
          from cryptography.hazmat.primitives.asymmetric import padding
          from cryptography.hazmat.primitives.ciphers.aead import AESGCM

          session_id = os.environ['SESSION_ID']
          request = json.loads(Path('/tmp/session_request.json').read_text())
          output_public = serialization.load_der_public_key(
              base64.b64decode(request['output_public_key_der_b64'])
          )
          plaintext = Path('/tmp/salon-output/hf_zero_upper_body_strong.png').read_bytes()
          aes_key = AESGCM.generate_key(bit_length=256)
          nonce = secrets.token_bytes(12)
          ciphertext = AESGCM(aes_key).encrypt(nonce, plaintext, session_id.encode())
          encrypted_key = output_public.encrypt(
              aes_key,
              padding.OAEP(
                  mgf=padding.MGF1(algorithm=hashes.SHA256()),
                  algorithm=hashes.SHA256(),
                  label=None,
              ),
          )
          b64 = base64.b64encode(ciphertext).decode('ascii')
          chunk_size = 180000
          chunks = [b64[i:i+chunk_size] for i in range(0, len(b64), chunk_size)]
          out = Path('/tmp/encrypted-output')
          out.mkdir()
          for i, chunk in enumerate(chunks):
              (out / f'output_chunk_{i:03d}.txt').write_text(chunk)
          manifest = {
              'version': 1,
              'session_id': session_id,
              'algorithm': 'RSA-OAEP-SHA256 + AES-256-GCM',
              'encrypted_key_b64': base64.b64encode(encrypted_key).decode('ascii'),
              'nonce_b64': base64.b64encode(nonce).decode('ascii'),
              'chunk_count': len(chunks),
              'plaintext_sha256': __import__('hashlib').sha256(plaintext).hexdigest(),
          }
          (out / 'output_manifest.json').write_text(json.dumps(manifest, indent=2))
          print(f'Encrypted result prepared in {len(chunks)} chunks.')
          PY

      - name: Commit encrypted result envelope
        shell: bash
        run: |
          set -euo pipefail
          branch="exp/salon-reconstruction-v0.1"
          git fetch -q origin "$branch"
          git reset --hard "origin/$branch"
          mkdir -p "$SESSION_DIR"
          cp /tmp/encrypted-output/output_manifest.json "$SESSION_DIR/output_manifest.json"
          cp /tmp/encrypted-output/output_chunk_*.txt "$SESSION_DIR/"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$SESSION_DIR/output_manifest.json" "$SESSION_DIR"/output_chunk_*.txt
          git commit -m "Return encrypted Salon reconstruction $SESSION_ID"
          git push origin "HEAD:$branch"
          echo "Encrypted output committed; plaintext result was never committed."

      - name: Destroy ephemeral plaintext and private key
        if: always()
        shell: bash
        run: |
          rm -rf /tmp/salon-pack /tmp/salon-output /tmp/encrypted-output \
                 /tmp/source.jpeg /tmp/input_manifest.json /tmp/input_cipher.b64 \
                 /tmp/session_request.json /tmp/salon_input_private.pem
