name: Salon Private Zero Run

on:
  pull_request:
    paths:
      - '.github/workflows/salon-private-zero-run.yml'
      - 'experiments/salon-reconstruction/run_hf_zero_fast_salon.py'
      - 'experiments/salon-reconstruction/profiles/**'
      - 'runtime-private/triggers/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  private-qwen-zero:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install runtime dependencies
        run: python -m pip install --disable-pip-version-check gradio_client pillow requests

      - name: Generate ephemeral transport key
        run: |
          set -euo pipefail
          mkdir -p /tmp/salon-private/pack /tmp/salon-private/output
          openssl genpkey -algorithm RSA -pkeyopt rsa_keygen_bits:3072 -out /tmp/salon-private/private.pem 2>/dev/null
          openssl pkey -in /tmp/salon-private/private.pem -pubout -out /tmp/salon-private/public.pem
          echo "RUN_ID=${GITHUB_RUN_ID}" > /tmp/salon-private/run.txt

      - name: Publish public key only
        uses: actions/upload-artifact@v4
        with:
          name: salon-transport-public-key-${{ github.run_id }}
          path: |
            /tmp/salon-private/public.pem
            /tmp/salon-private/run.txt
          retention-days: 1

      - name: Wait for RSA-encrypted private URL manifest
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          API="https://api.github.com/repos/${GITHUB_REPOSITORY}/contents/runtime-private/manifests/salon-${GITHUB_RUN_ID}.b64?ref=exp%2Fsalon-reconstruction-v0.1"
          for i in $(seq 1 180); do
            if curl -fsSL -H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/vnd.github+json" "$API" -o /tmp/salon-private/content.json; then
              python - <<'PY'
          import base64, json
          src=json.load(open('/tmp/salon-private/content.json'))
          body=base64.b64decode(src['content']).decode('ascii').strip()
          open('/tmp/salon-private/urls.enc','wb').write(base64.b64decode(body))
          PY
              openssl pkeyutl -decrypt -inkey /tmp/salon-private/private.pem -in /tmp/salon-private/urls.enc -out /tmp/salon-private/transport.json
              echo "PRIVATE_URL_MANIFEST_DECRYPT=PASS"
              exit 0
            fi
            sleep 5
          done
          echo "Timed out waiting for encrypted URL manifest" >&2
          exit 1

      - name: Download private runtime inputs
        run: |
          python - <<'PY'
          import json, requests
          from pathlib import Path

          root=Path('/tmp/salon-private/pack')
          m=json.load(open('/tmp/salon-private/transport.json'))
          urls=m['image_urls']
          if not (1 <= len(urls) <= 3):
              raise RuntimeError('image_urls must contain 1–3 URLs')

          names = [
              '01_Source_Original.png',
              '02_Garment_Reference_CALIFORNIA.png',
              '03_Target_Keypoints_UpperBody_Strong.png',
          ]
          for url,name in zip(urls,names):
              r=requests.get(url,timeout=120,allow_redirects=True)
              r.raise_for_status()
              p=root/name
              p.write_bytes(r.content)
              if p.stat().st_size < 100:
                  raise RuntimeError(f'Input unexpectedly small: {name}')

          mode={1:'source_only',2:'source_garment',3:'source_garment_structure'}[len(urls)]
          Path('/tmp/salon-private/result.pass').write_text(m['result_pass'],encoding='ascii')
          Path('/tmp/salon-private/variant.txt').write_text(m.get('variant','preserve_garment'),encoding='utf-8')
          Path('/tmp/salon-private/input_mode.txt').write_text(mode,encoding='utf-8')
          print('PRIVATE_INPUT_DOWNLOAD=PASS',len(urls),mode,m.get('variant'))
          PY

      - name: Execute private Qwen 2511 Lightning reconstruction
        shell: bash
        run: |
          set -euo pipefail
          export PACK_DIR=/tmp/salon-private/pack
          export OUT_DIR=/tmp/salon-private/output
          export HF_ZERO_BACKEND=lightning
          export HF_ZERO_INPUT_MODE="$(cat /tmp/salon-private/input_mode.txt)"
          export HF_ZERO_VARIANT="$(cat /tmp/salon-private/variant.txt)"
          export HF_ZERO_STEPS=4
          export HF_ZERO_GUIDANCE=1.0
          export HF_ZERO_HEIGHT=1024
          export HF_ZERO_WIDTH=576
          export SEED=47
          python experiments/salon-reconstruction/run_hf_zero_fast_salon.py
          result="$OUT_DIR/hf_zero_${HF_ZERO_BACKEND}_${HF_ZERO_VARIANT}.png"
          test -s "$result"
          cp "$result" /tmp/salon-private/result.png
          python - <<'PY'
          from PIL import Image
          p='/tmp/salon-private/result.png'
          with Image.open(p) as im:
              im.verify()
          print('PRIVATE_QWEN_ZERO_INFERENCE=PASS')
          PY

      - name: Encrypt reconstruction result
        if: success()
        run: |
          set -euo pipefail
          openssl enc -aes-256-cbc -salt -pbkdf2 -pass file:/tmp/salon-private/result.pass -in /tmp/salon-private/result.png -out /tmp/salon-private/result.png.enc
          sha256sum /tmp/salon-private/result.png.enc > /tmp/salon-private/result.sha256

      - name: Upload encrypted result only
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: salon-private-zero-result-${{ github.run_id }}
          path: |
            /tmp/salon-private/result.png.enc
            /tmp/salon-private/result.sha256
          retention-days: 1

      - name: Cleanup private material
        if: always()
        run: rm -rf /tmp/salon-private || true
