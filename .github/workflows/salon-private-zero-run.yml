name: Salon Private Zero Run

# Privacy-preserving EXP execution. Ordinary code/docs commits never start it.
# A run starts only from workflow_dispatch or an explicit one-time request file.
on:
  workflow_dispatch:
  push:
    branches:
      - exp/salon-reconstruction-v0.1
    paths:
      - 'runtime-private/requests/start-*.txt'

permissions:
  contents: read

jobs:
  private-qwen-zero:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      contains(toJSON(github.event.commits.*.added), 'runtime-private/requests/start-') ||
      contains(toJSON(github.event.commits.*.modified), 'runtime-private/requests/start-')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          ref: exp/salon-reconstruction-v0.1
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install runtime dependencies
        run: python -m pip install --disable-pip-version-check gradio_client pillow requests cryptography

      - name: Generate ephemeral transport key
        run: |
          set -euo pipefail
          mkdir -p /tmp/salon-private/pack /tmp/salon-private/output
          openssl genpkey -algorithm RSA -pkeyopt rsa_keygen_bits:3072 -out /tmp/salon-private/private.pem 2>/dev/null
          openssl pkey -in /tmp/salon-private/private.pem -pubout -out /tmp/salon-private/public.pem
          echo "RUN_ID=${GITHUB_RUN_ID}" > /tmp/salon-private/run.txt

      - name: Publish public key only
        uses: actions/upload-artifact@v4
        with:
          name: salon-transport-public-key-${{ github.run_id }}
          path: |
            /tmp/salon-private/public.pem
            /tmp/salon-private/run.txt
          retention-days: 1

      - name: Wait for RSA-encrypted private transport manifest
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          API="https://api.github.com/repos/${GITHUB_REPOSITORY}/contents/runtime-private/manifests/salon-${GITHUB_RUN_ID}.b64?ref=exp%2Fsalon-reconstruction-v0.1"
          for i in $(seq 1 180); do
            if curl -fsSL -H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/vnd.github+json" "$API" -o /tmp/salon-private/content.json; then
              python - <<'PY'
          import base64, json
          src=json.load(open('/tmp/salon-private/content.json'))
          body=base64.b64decode(src['content']).decode('ascii').strip()
          open('/tmp/salon-private/transport.enc','wb').write(base64.b64decode(body))
          PY
              openssl pkeyutl -decrypt -inkey /tmp/salon-private/private.pem -in /tmp/salon-private/transport.enc -out /tmp/salon-private/transport.json
              echo "PRIVATE_TRANSPORT_MANIFEST_DECRYPT=PASS"
              exit 0
            fi
            sleep 5
          done
          echo "Timed out waiting for encrypted transport manifest" >&2
          exit 1

      - name: Resolve private runtime inputs
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import base64, json, os, subprocess, zipfile
          from pathlib import Path
          import requests
          from cryptography.hazmat.primitives.ciphers.aead import AESGCM

          root=Path('/tmp/salon-private/pack')
          m=json.load(open('/tmp/salon-private/transport.json'))
          transport=m.get('transport_mode','private_urls')

          if transport == 'repo_encrypted_pack':
              branch='origin/exp/salon-reconstruction-v0.1'
              subprocess.run(['git','fetch','-q','origin','exp/salon-reconstruction-v0.1'],check=True)
              prefix=m['payload_prefix'].rstrip('/')
              count=int(m['chunk_count'])
              pieces=[]
              for i in range(count):
                  path=f"{prefix}/chunk_{i:03d}.txt"
                  pieces.append(subprocess.check_output(['git','show',f'{branch}:{path}'],text=True).strip())
              ciphertext=base64.b64decode(''.join(pieces))
              key=base64.b64decode(m['payload_key_b64'])
              nonce=base64.b64decode(m['payload_nonce_b64'])
              aad=str(m['run_id']).encode('ascii')
              plaintext=AESGCM(key).decrypt(nonce,ciphertext,aad)
              pack_zip=Path('/tmp/salon-private/pack.zip')
              pack_zip.write_bytes(plaintext)
              with zipfile.ZipFile(pack_zip,'r') as z:
                  z.extractall(root)
              print('PRIVATE_ENCRYPTED_PACK_DECRYPT=PASS',count)
          elif transport == 'private_urls':
              urls=m['image_urls']
              if not (1 <= len(urls) <= 3):
                  raise RuntimeError('image_urls must contain 1–3 URLs')
              names=[
                  '01_Source_Original.png',
                  '02_Garment_Reference_CALIFORNIA.png',
                  '03_Target_Keypoints_UpperBody_Strong.png',
              ]
              for url,name in zip(urls,names):
                  r=requests.get(url,timeout=120,allow_redirects=True)
                  r.raise_for_status()
                  p=root/name
                  p.write_bytes(r.content)
                  if p.stat().st_size < 100:
                      raise RuntimeError(f'Input unexpectedly small: {name}')
              print('PRIVATE_URL_INPUT_DOWNLOAD=PASS',len(urls))
          else:
              raise RuntimeError(f'Unknown transport_mode: {transport}')

          source=root/'01_Source_Original.png'
          garment=root/'02_Garment_Reference_CALIFORNIA.png'
          structure=root/'03_Target_Keypoints_UpperBody_Strong.png'
          if not source.exists():
              raise RuntimeError('Missing source image after transport resolution')
          if structure.exists(): mode='source_garment_structure'
          elif garment.exists(): mode='source_garment'
          else: mode='source_only'

          Path('/tmp/salon-private/result.pass').write_text(m['result_pass'],encoding='ascii')
          Path('/tmp/salon-private/backend.txt').write_text(m.get('backend','lora_fast'),encoding='utf-8')
          Path('/tmp/salon-private/variant.txt').write_text(m.get('variant','preserve_garment'),encoding='utf-8')
          Path('/tmp/salon-private/input_mode.txt').write_text(m.get('input_mode',mode),encoding='utf-8')
          print('PRIVATE_INPUT_RESOLVE=PASS',m.get('backend','lora_fast'),m.get('variant','preserve_garment'),m.get('input_mode',mode))
          PY

      - name: Execute private Qwen 2511 reconstruction
        shell: bash
        run: |
          set -euo pipefail
          export PACK_DIR=/tmp/salon-private/pack
          export OUT_DIR=/tmp/salon-private/output
          export HF_ZERO_BACKEND="$(cat /tmp/salon-private/backend.txt)"
          export HF_ZERO_INPUT_MODE="$(cat /tmp/salon-private/input_mode.txt)"
          export HF_ZERO_VARIANT="$(cat /tmp/salon-private/variant.txt)"
          export HF_ZERO_STEPS=4
          export HF_ZERO_GUIDANCE=1.0
          export HF_ZERO_HEIGHT=1024
          export HF_ZERO_WIDTH=576
          export SEED=47
          python experiments/salon-reconstruction/run_hf_zero_fast_salon.py
          result="$OUT_DIR/hf_zero_${HF_ZERO_BACKEND}_${HF_ZERO_VARIANT}.png"
          test -s "$result"
          cp "$result" /tmp/salon-private/result.png
          python - <<'PY'
          from PIL import Image
          p='/tmp/salon-private/result.png'
          with Image.open(p) as im:
              im.verify()
          print('PRIVATE_QWEN_ZERO_INFERENCE=PASS')
          PY

      - name: Encrypt reconstruction result
        if: success()
        run: |
          set -euo pipefail
          openssl enc -aes-256-cbc -salt -pbkdf2 -pass file:/tmp/salon-private/result.pass -in /tmp/salon-private/result.png -out /tmp/salon-private/result.png.enc
          sha256sum /tmp/salon-private/result.png.enc > /tmp/salon-private/result.sha256

      - name: Upload encrypted result only
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: salon-private-zero-result-${{ github.run_id }}
          path: |
            /tmp/salon-private/result.png.enc
            /tmp/salon-private/result.sha256
          retention-days: 1

      - name: Cleanup private material
        if: always()
        run: rm -rf /tmp/salon-private || true
